const chapters=[{"name":"LANGKAH","subtitle":"Untuk jalan yang Ki pilih sendiri.","symbol":"👣","gift":"KASUT","intro":["Ki, saya buat satu perjalanan kecil untuk hari lahir Ki. Dalam bab pertama, Ki akan berjalan dari rumah ke sebuah bukit. Ada peta yang koyak, simpang yang mengelirukan, dan orang baik yang singgah membantu.","Saya pilih tema langkah sebab kita semua ada jalan masing-masing. Saya harap Ki tak rasa perlu cepat sampai ke mana-mana. Selesaikan satu teka-teki, kemudian tengok apa yang menanti di selekoh seterusnya."],"scenes":[["Pagi di depan rumah","Pagi masih sejuk. Ki jumpa sekeping peta terselit di bawah pintu. Di belakangnya saya tulis: “Kita mula dari sini, ya.” Tiada arahan panjang. Cuma satu titik merah dan jalan yang belum diteroka."],["Gerai di simpang","Sebelum simpang pertama, ada gerai kecil yang baru buka. Pemiliknya beri Ki air dan pesan supaya periksa arah dulu. Kadang-kadang, lima minit berhenti boleh elakkan satu jam sesat."],["Jejak di tepi sungai","Jalan tanah bertukar jadi laluan batu. Ada tanda kasut lama pada tanah lembap. Ki tak perlu ikut setiap jejak itu. Cari petanda yang betul, kemudian pilih jalan sendiri."],["Simpang tiga","Sebuah papan tanda menunjukkan tiga arah. Yang paling cantik belum tentu paling dekat. Ki keluarkan peta, kira jarak, dan cuba pilih berdasarkan apa yang ada di depan mata."],["Pondok rehat","Hujan turun sekejap. Ki berteduh di pondok lama. Ada nota kecil pada dinding: “Rehat pun sebahagian daripada perjalanan.” Saya suka ayat itu. Harap Ki pun ingat nanti."],["Jambatan kayu","Bunyi air makin kuat. Jambatan di depan nampak kukuh, tetapi ada papan yang tidak sama saiz. Ki perlu perhati dan susun langkah sebelum menyeberang."],["Laluan berbatu","Tanah mulai curam. Kadang-kadang batu yang nampak mudah dipijak sebenarnya licin. Ki perlahankan langkah. Tak mengapa. Bukit itu tidak ke mana-mana."],["Cahaya dari jauh","Dari celah pokok, Ki nampak cahaya rumah kecil di lereng bukit. Nampaknya jalan ini betul. Ki simpan peta yang sudah berkedut dan teruskan perlahan-lahan."],["Hampir ke puncak","Udara semakin nyaman. Beberapa tanda di batu perlu dibaca dengan teliti untuk membuka pagar terakhir. Saya harap Ki menikmati bahagian ini. Kita sudah jauh berjalan."],["Kotak di puncak","Ki sampai di tempat yang boleh nampak seluruh laluan tadi. Ada sebuah kotak dengan nama Ki di atasnya. Saya tinggalkan sesuatu untuk perjalanan Ki yang seterusnya."]],"bridge":"Itulah hadiah pertama. Bukan sebab Ki perlu berjalan jauh setiap hari. Saya cuma harap, bila Ki bersedia mencuba sesuatu yang baharu, ada teman yang selesa untuk dibawa bersama.","tasks":[{"kind":"order","title":"Peta Yang Berkecai","question":"Tekan empat cebisan peta dalam susunan logik, daripada memulakan perjalanan hingga tiba di destinasi.","answer":["Tetapkan tujuan","Ambil langkah pertama","Belajar daripada halangan","Raikan kemajuan"],"hints":["Mulakan dengan sesuatu yang menentukan arah sebelum bergerak.","Tujuan dahulu, kemudian tindakan. Halangan mengajar sebelum hasil diraikan.","Jawapan tepat: Tetapkan tujuan → Ambil langkah pertama → Belajar daripada halangan → Raikan kemajuan."],"explain":"Kemajuan yang bermakna berlaku secara berperingkat.","choices":["Raikan kemajuan","Belajar daripada halangan","Tetapkan tujuan","Ambil langkah pertama"]},{"kind":"input","title":"Kata Pada Pintu","question":"Susun huruf H – A – L – G – K – A – N menjadi satu perkataan Melayu yang bermaksud gerakan kecil untuk maju.","answer":"LANGKAH","hints":["Perkataan ini berkaitan dengan kaki dan perjalanan.","Huruf pertamanya L, huruf terakhir H. Ia mempunyai tujuh huruf.","Jawapan tepat: LANGKAH."],"explain":"Langkah yang kecil tetap membawa perubahan."},{"kind":"match","title":"Empat Kawan di Jejak","question":"Empat pengembara mempunyai keperluan berlainan. Padankan cabaran dengan bantuan yang paling sesuai.","answer":["Tidak tahu laluan","Kehabisan air","Tali kasut longgar","Perlu mengira jarak"],"hints":["Setiap cabaran memerlukan alat atau tindakan yang khusus.","Tidak tahu laluan → peta; tiada air → isi botol; tali kasut → ikat semula; jarak → tanda kilometer.","Jawapan tepat: Tidak tahu laluan → Buka peta laluan; Kehabisan air → Isi semula botol minuman; Tali kasut longgar → Ikat semula dengan kemas; Perlu mengira jarak → Semak tanda kilometer."],"explain":"Perjalanan menjadi lebih mudah apabila masalah sebenar dikenal pasti.","choices":["Semak tanda kilometer","Isi semula botol minuman","Buka peta laluan","Ikat semula dengan kemas"],"accept":["Buka peta laluan","Isi semula botol minuman","Ikat semula dengan kemas","Semak tanda kilometer"]},{"kind":"choice","title":"Kompas Tanpa Jarum","question":"Kompas Ki tidak menunjukkan utara. Ia hanya menunjukkan apa yang Ki mahu capai. Apakah yang paling sesuai dijadikan panduan memilih jalan?","answer":"Tujuan yang jelas dan nilai yang penting","hints":["Fikirkan panduan yang tetap berguna apabila jalan sukar.","Pilih perkara yang menentukan arah, bukan pujian atau jalan pintas.","Jawapan tepat: Tujuan yang jelas dan nilai yang penting."],"explain":"Arah yang bermakna datang daripada tujuan, bukannya tekanan sekeliling.","choices":["Jalan yang paling ramai pilih","Tujuan yang jelas dan nilai yang penting","Jalan yang tidak pernah mencabar","Tempat yang paling dekat"]},{"kind":"multi","title":"Bekal Untuk Perjalanan","question":"Pilih TEPAT TIGA perkara yang membantu perjalanan jangka panjang.","answer":["Rehat apabila perlu","Belajar daripada kesilapan","Usaha secara konsisten"],"hints":["Fikirkan pilihan yang mengekalkan semangat serta tenaga.","Pilih rehat, pembelajaran dan konsistensi. Elakkan dua pilihan yang melambatkan kemajuan.","Jawapan tepat: Rehat apabila perlu, Belajar daripada kesilapan, Usaha secara konsisten."],"explain":"Ketekunan memerlukan usaha, pembelajaran dan rehat.","choices":["Bandingkan diri setiap masa","Rehat apabila perlu","Belajar daripada kesilapan","Menunggu semuanya sempurna","Usaha secara konsisten"]},{"kind":"visualDots","title":"Batu Yang Semakin Banyak","question":"Setiap batu mempunyai satu titik lebih daripada batu sebelumnya. Berapakah titik pada batu kelima?","answer":"5","hints":["Kira titik pada batu pertama hingga keempat.","Bilangan titik ialah 1, 2, 3, 4, kemudian tambah satu lagi.","Jawapan: 5 titik."],"explain":"Perjalanan panjang pun bermula dengan tambahan yang kecil.","choices":["3","4","5","6"],"counts":[1,2,3,4]},{"kind":"truth","title":"Empat Peraturan Peta","question":"Baca empat ayat berdasarkan PERATURAN: Setiap laluan harus ada arah; rehat dibenarkan; laluan yang tertutup tidak boleh dipilih; perjalanan tidak perlu sempurna. Tandakan Benar atau Salah mengikut peraturan yang diberi.","answer":["Benar","Salah","Benar","Salah"],"hints":["Bandingkan setiap ayat dengan empat peraturan yang dicetak di atas.","Ayat pertama dan ketiga sejajar dengan peraturan. Ayat kedua dan keempat bercanggah.","Jawapan: Benar, Salah, Benar, Salah."],"explain":"Sebuah arah tidak hilang hanya kerana Ki berhenti berehat.","statements":["Setiap laluan yang dipilih memerlukan arah.","Ki dilarang berhenti untuk berehat.","Laluan tertutup tidak patut dipilih.","Perjalanan mestilah sempurna sejak hari pertama."]},{"kind":"tiles","title":"Huruf Keberanian","question":"Susun SEMUA kepingan huruf menjadi perkataan enam huruf yang bermaksud tidak takut untuk mencuba walaupun belum pasti berjaya.","answer":"BERANI","hints":["Sifat ini diperlukan ketika membuka langkah pertama.","Perkataan enam huruf ini bermula B, diikuti E, dan berakhir I.","Susun huruf: B – E – R – A – N – I (BERANI)."],"explain":"Berani bukan bermaksud tiada rasa bimbang; berani bermaksud tetap memilih untuk mencuba.","letters":["N","I","E","B","A","R"]},{"kind":"visualSignal","title":"Lampu Di Laluan","question":"Lampu jalan menyala mengikut corak dua warna secara bergilir. Apakah warna lampu kelima?","answer":"EMAS","hints":["Perhatikan warna pada tempat pertama dan ketiga.","Warna pada kedudukan ganjil sama: emas.","Jawapan: EMAS."],"explain":"Kadang-kadang corak hanya kelihatan apabila kita memerhati.","choices":["EMAS","BIRU","HIJAU","MERAH"],"symbols":["EMAS","BIRU","EMAS","BIRU"],"palette":{"EMAS":"#f8cf82","BIRU":"#8fc3ee","HIJAU":"#9de2b5","MERAH":"#ec899f"}},{"kind":"pattern","title":"Tangga Kemajuan","question":"Bilangan anak tangga yang dilalui setiap fasa ialah 3, 6, 12, 24. Jika pola berganda berterusan, berapa bilangan bagi fasa seterusnya?","answer":"48","hints":["Perhatikan setiap nombor merupakan gandaan nombor sebelumnya.","24 × 2 = 48.","Jawapan tepat: 48."],"explain":"Maju berperingkat memerlukan kesabaran walaupun hasil berkembang."},{"kind":"match","title":"Empat Tanda Jalan","question":"Padankan setiap tanda dengan tindakan yang paling sesuai.","answer":["Laluan licin","Peta kabur","Kaki penat","Arah salah"],"hints":["Fikirkan tindak balas yang sesuai bagi setiap keadaan khusus.","Laluan licin perlukan langkah hati-hati; peta kabur semak arah; kaki penat perlu rehat; arah salah perlu ubah laluan.","Jawapan tepat: Laluan licin → Perlahankan langkah; Peta kabur → Semak arah semula; Kaki penat → Berehat seketika; Arah salah → Ubah laluan."],"explain":"Bijak berjalan bermaksud menyesuaikan tindakan dengan keadaan.","choices":["Semak arah semula","Berehat seketika","Perlahankan langkah","Ubah laluan"],"accept":["Perlahankan langkah","Semak arah semula","Berehat seketika","Ubah laluan"]},{"kind":"route","title":"Cari Jalan Terdekat","question":"Ki nak sampai ke titik Tamat. Pilih laluan dengan jumlah jarak (km) PALING RENDAH. Tekan tempat persinggahan mengikut urutan.","answer":"A C F","hints":["Setiap garisan ada jarak. Jumlahkan jarak bagi setiap laluan.","Dari Mula, pergi ke Denai (2 km), kemudian Pokok (2 km). Dari situ ke Tamat (3 km).","Jawapan: Mula → Denai (A) → Pokok (C) → Tamat (F). Jumlah 7 km."],"explain":"Bukan semua jalan pintas nampak seperti jalan pintas.","route":{"nodes":[{"id":"M","label":"Mula","x":10,"y":54},{"id":"A","label":"Denai","x":34,"y":18},{"id":"B","label":"Tasik","x":34,"y":82},{"id":"C","label":"Pokok","x":63,"y":19},{"id":"D","label":"Taman","x":63,"y":82},{"id":"F","label":"Tamat","x":90,"y":50}],"edges":[{"a":"M","b":"A","cost":2},{"a":"M","b":"B","cost":4},{"a":"A","b":"C","cost":2},{"a":"A","b":"D","cost":6},{"a":"B","b":"C","cost":5},{"a":"B","b":"D","cost":3},{"a":"C","b":"F","cost":3},{"a":"D","b":"F","cost":4}],"start":"M","goal":"F","answer":["A","C","F"]}},{"kind":"match","title":"Peta Emosi","question":"Padankan setiap keadaan dengan tindakan yang dinyatakan paling sesuai.","answer":["Hilang arah","Terlalu penat","Jalan licin","Sudah sampai"],"hints":["Keadaan memerlukan tindak balas yang khusus dan selamat.","Hilang arah → semak peta; penat → rehat; jalan licin → perlahan; sudah sampai → hargai kemajuan.","Padanan: Hilang arah—Semak peta; Terlalu penat—Berehat; Jalan licin—Perlahankan langkah; Sudah sampai—Raikan kemajuan."],"explain":"Mengenal keperluan diri sendiri ialah sebahagian daripada kebijaksanaan.","choices":["Raikan kemajuan","Perlahankan langkah","Berehat","Semak peta"],"accept":["Semak peta","Berehat","Perlahankan langkah","Raikan kemajuan"]},{"kind":"choice","title":"Tiga Lorong, Satu Tujuan","question":"Pintu A membawa ke tangga tetapi tangga ditutup. Pintu B menuju terus ke perpustakaan yang Ki cari. Pintu C kembali ke titik mula. Pintu mana patut dipilih untuk tiba di perpustakaan?","answer":"Pintu B","hints":["Baca DESTINASI setiap pintu, bukan rupanya.","Pintu A tertutup, C kembali ke awal, hanya B menuju tempat yang dicari.","Jawapan tepat: Pintu B."],"explain":"Keputusan menjadi lebih jelas apabila Ki berani membaca kenyataan, bukan andaian.","choices":["Pintu C","Pintu A","Pintu B"]},{"kind":"visualOrder","title":"Empat Waktu, Satu Hari","question":"Susun perjalanan hari daripada waktu paling awal hingga paling lewat.","answer":"Pagi Tengah hari Petang Malam","hints":["Bayangkan satu hari biasa dari bangun hingga tidur.","Matahari naik pada pagi, diikuti tengah hari, petang, kemudian malam.","Jawapan: Pagi → Tengah hari → Petang → Malam."],"explain":"Satu hari mempunyai banyak langkah kecil.","answerList":["Pagi","Tengah hari","Petang","Malam"],"choices":["Petang","Pagi","Malam","Tengah hari"],"symbols":{"Pagi":"🌅","Tengah hari":"☀️","Petang":"🌇","Malam":"🌙"}},{"kind":"order","title":"Jambatan Empat Papan","question":"Empat papan jambatan tertulis langkah penyelesaian masalah. Susun supaya tindakan dibuat selepas memahami masalah.","answer":["Kenal pasti masalah","Cari beberapa pilihan","Pilih tindakan sesuai","Nilai hasilnya"],"hints":["Jangan terus menilai hasil sebelum berbuat sesuatu.","Kenal pasti dahulu, cari pilihan, kemudian bertindak dan menilai.","Jawapan tepat: Kenal pasti masalah → Cari beberapa pilihan → Pilih tindakan sesuai → Nilai hasilnya."],"explain":"Keputusan yang baik lahir daripada pemahaman dan semakan.","choices":["Nilai hasilnya","Cari beberapa pilihan","Kenal pasti masalah","Pilih tindakan sesuai"]},{"kind":"order","title":"Rancangan Lima Langkah","question":"Susun LIMA tindakan supaya Ki menamatkan perjalanan yang belum pernah dicuba secara lebih teratur.","answer":["Tentukan destinasi","Semak keadaan dan laluan","Sediakan keperluan penting","Mulakan perjalanan","Semak semula kemajuan"],"hints":["Tidak munasabah untuk memulakan perjalanan sebelum mengetahui destinasi.","Destinasi → semak laluan → sediakan barang → bermula → nilai kemajuan.","Jawapan tepat: Tentukan destinasi → Semak keadaan dan laluan → Sediakan keperluan penting → Mulakan perjalanan → Semak semula kemajuan."],"explain":"Persediaan membantu Ki bergerak dengan lebih yakin.","choices":["Semak semula kemajuan","Mulakan perjalanan","Tentukan destinasi","Sediakan keperluan penting","Semak keadaan dan laluan"]},{"kind":"visualGrid","title":"Jejak Pada Petak","question":"Mula di petak kiri atas. Bergerak dua petak ke KANAN, kemudian satu petak ke BAWAH. Pilih petak tempat Ki berhenti.","answer":"B3","hints":["Baris paling atas ialah A; baris kedua ialah B. Lajur dikira dari kiri.","Dua langkah ke kanan membawa Ki ke A3; satu langkah ke bawah membawa Ki ke B3.","Jawapan: B3 (ikon khemah)."],"explain":"Arah jadi lebih mudah bila dibaca satu langkah pada satu masa.","cells":["🌱","🪨","🌲","🌙","🌉","⛺","💧","⭐","🏁"]},{"kind":"order","title":"Empat Hari Di Laluan","question":"Susun catatan Ki dari hari pertama hingga hari keempat mengikut petunjuk ini: Ki berehat SELEPAS merancang; Ki cuba berjalan SELEPAS berehat; Ki menilai hasil SELEPAS mencuba.","answer":["Merancang perjalanan","Berehat secukupnya","Mencuba langkah pertama","Menilai hasil"],"hints":["Ikut setiap perkataan SELEPAS dalam soalan.","Rancang dahulu, kemudian rehat; setelah itu cuba; terakhir nilai.","Urutan: Merancang perjalanan → Berehat secukupnya → Mencuba langkah pertama → Menilai hasil."],"explain":"Kemajuan tidak menolak rehat; kedua-duanya boleh wujud bersama.","choices":["Menilai hasil","Berehat secukupnya","Merancang perjalanan","Mencuba langkah pertama"]},{"kind":"truth","title":"Tanda Benar Di Persimpangan","question":"Sebuah papan memberitahu: Jambatan merah rosak; jambatan biru terbuka; peta masih di dalam beg; destinasi berada di seberang sungai. Pilih Benar atau Salah berdasarkan maklumat itu.","answer":["Salah","Benar","Benar","Salah"],"hints":["Jangan mengagak. Padankan ayat dengan fakta pada papan.","Merah bukan selamat, biru terbuka, peta memang dalam beg, dan destinasi bukan di tebing ini.","Jawapan: Salah, Benar, Benar, Salah."],"explain":"Tidak semua suara yakin adalah benar. Semak fakta sebelum melangkah.","statements":["Jambatan merah boleh digunakan dengan selamat.","Jambatan biru masih boleh dilalui.","Peta Ki ada di dalam beg.","Destinasi terletak di tebing tempat Ki berdiri."]},{"kind":"tiles","title":"Bina Sebuah Usaha","question":"Cari perkataan lima huruf yang bermaksud ikhtiar bersungguh-sungguh, dengan menyusun SEMUA kepingan huruf.","answer":"USAHA","hints":["Apakah yang dilakukan selepas menetapkan tujuan?","Bermula U, diikuti S; huruf A muncul dua kali.","Susunan tepat: U – S – A – H – A (USAHA)."],"explain":"Niat menunjukkan arah; usaha menggerakkan kaki.","letters":["A","H","S","A","U"]},{"kind":"memory","title":"Warna Pada Laluan","question":"Hafal urutan lampu di sepanjang laluan. Apabila bersedia, tekan “Sembunyikan”, kemudian ulang dengan menekan simbol mengikut urutan.","answer":["🌿","☀️","🌙","🌿","⭐","☀️"],"hints":["Ingat simbol yang muncul semula; dua simbol diulang.","Urutan mula dengan 🌿 → ☀️ → 🌙, kemudian 🌿.","Jawapan tepat: 🌿 → ☀️ → 🌙 → 🌿 → ⭐ → ☀️."],"explain":"Memberi perhatian pada satu langkah pada satu masa membantu kita tidak hilang arah.","choices":["🌿","☀️","🌙","⭐"]},{"kind":"multi","title":"Isi Beg Pengembara","question":"Ki hanya boleh membawa TIGA benda untuk perjalanan berjalan kaki yang panjang pada waktu siang. Pilih tiga benda yang paling relevan daripada senarai.","answer":["Air minuman","Peta laluan","Kasut yang sesuai"],"hints":["Fikirkan keperluan bergerak, arah dan hidrasi.","Pilih air, peta, dan alas kaki yang sesuai; elakkan barang hiasan.","Jawapan tepat: Air minuman, Peta laluan, Kasut yang sesuai."],"explain":"Persediaan ringkas yang betul membantu perjalanan terasa lebih selesa.","choices":["Air minuman","Bingkai gambar besar","Peta laluan","Kasut yang sesuai","Patung kaca yang berat"]},{"kind":"visualOdd","title":"Tanda Yang Tersilap","question":"Pada setiap baris, tanda sepatutnya berselang-seli pokok dan daun. Satu petak tidak mengikut corak. Pilih petak itu.","answer":"B4","hints":["Bandingkan petak di lajur yang sama antara dua baris.","Baris kedua sepatutnya 🌲 🌿 🌲 🌿, tetapi hujungnya berbeza.","Jawapan: B4. Sepatutnya daun 🌿."],"explain":"Jangan terlepas pandang petunjuk paling kecil.","cells":["🌲","🌿","🌲","🌿","🌲","🌿","🌲","🌲"]},{"kind":"memory","title":"Lampu Di Atas Jambatan","question":"Ingat susunan tujuh tanda cahaya. Sembunyikan, kemudian ulang semula mengikut urutan.","answer":["🔹","🔸","🌙","⭐","🔹","🌙","🔸"],"hints":["Perhatikan dua warna berlainan di permulaan.","Tiga tanda awal: 🔹 → 🔸 → 🌙; tanda keempat ialah ⭐.","Jawapan: 🔹 → 🔸 → 🌙 → ⭐ → 🔹 → 🌙 → 🔸."],"explain":"Perhatian kepada perincian membantu kita terus ke arah yang dipilih.","choices":["⭐","🔸","🔹","🌙"]},{"kind":"keypad","title":"Kunci Tiang Penanda","question":"Tiang menunjukkan siri 3, 6, 12, 24. Setiap nombor DIGANDAKAN. Kunci menggunakan nombor selepas 24 dalam TIGA digit.","answer":"048","hints":["Lihat hubungan 3 kepada 6 dan 6 kepada 12.","Setiap nilai darab dua: 24 × 2 = 48. Letak sifar di depan.","Kod tepat: 048."],"explain":"Sesuatu pola boleh difahami apabila Ki melihat hubungannya, bukan hanya hasilnya."},{"kind":"visualCompass","title":"Jarum Kompas","question":"Jarum bermula menghala UTARA. Ia berpusing 90° mengikut arah jam, kemudian berpusing 90° mengikut arah jam sekali lagi. Ke manakah jarum menghala?","answer":"SELATAN","hints":["Fikirkan arah putaran jam: utara → timur dahulu.","Selepas dua kali putaran 90°, jumlahnya ialah 180°.","Jawapan: SELATAN."],"explain":"Walaupun berpusing, Ki masih boleh menentukan arah.","choices":["UTARA","TIMUR","SELATAN","BARAT"],"point":"S"},{"kind":"input","title":"Kod Kompas","question":"Gunakan kod A=1, B=2, ... Z=26. Nombor 1 – 18 – 1 – 8 membentuk perkataan Melayu apakah?","answer":"ARAH","hints":["Nombor 1 mewakili huruf A.","18=R dan 8=H; bacaan lengkap ialah A–R–A–H.","Jawapan tepat: ARAH."],"explain":"Kita mungkin tidak tahu semua perkara, tetapi masih boleh memilih arah."},{"kind":"match","title":"Musim Perjalanan","question":"Padankan keadaan dengan sikap yang sesuai.","answer":["Apabila tersilap","Apabila berjaya","Apabila keliru","Apabila letih"],"hints":["Pilih tindak balas yang paling membina, bukan yang paling cepat.","Tersilap = belajar; berjaya = bersyukur; keliru = bertanya; letih = berehat.","Jawapan tepat: Apabila tersilap → Belajar dan mencuba semula; Apabila berjaya → Menghargai usaha; Apabila keliru → Bertanya dan mencari penjelasan; Apabila letih → Mengambil rehat."],"explain":"Setiap fasa memerlukan cara menjaga diri yang berbeza.","choices":["Bertanya dan mencari penjelasan","Mengambil rehat","Belajar dan mencuba semula","Menghargai usaha"],"accept":["Belajar dan mencuba semula","Menghargai usaha","Bertanya dan mencari penjelasan","Mengambil rehat"]},{"kind":"giftChoice","title":"Kotak Di Puncak","question":"Hadiah pertama dibuat untuk dipakai pada kaki ketika berjalan. Apakah isi kotak ini?","answer":"KASUT","hints":["Barang ini dipakai ketika keluar rumah atau bersukan.","Ia sepasang dan membantu melindungi tapak kaki.","Jawapan: KASUT."],"explain":"Saya pilih benda ini untuk perjalanan Ki yang seterusnya.","choices":["TOPI","KASUT","JAM","BEG"]}],"wish":"Selamat hari lahir, Ki. Semoga kaki Ki melangkah ke tempat yang baik, urusan harian dipermudahkan, dan perjalanan pergi balik sentiasa selamat. Kalau penat, rehat dulu. Esok masih ada."},{"name":"MELODI","subtitle":"Untuk lagu dan masa tenang Ki.","symbol":"🎧","gift":"EARPHONE","intro":["Lepas jauh berjalan, Ki tiba di sebuah bandar yang sibuk. Ada bunyi enjin, orang berbual, dan lagu dari kedai di tepi jalan. Susah juga hendak dengar suara sendiri di tengah semua itu.","Bab Melodi bukan tentang muzik semata-mata. Ia tentang memilih apa yang mahu didengar, bila perlu berhenti, dan bagaimana satu lagu boleh buat hari yang serabut terasa sedikit lebih baik."],"scenes":[["Bunyi pertama","Ki masuk ke sebuah lorong dengan papan tanda berbentuk not. Dari tingkap, kedengaran orang sedang berlatih muzik. Lagu itu belum siap. Ada bahagian tersalah rentak, tetapi semua orang terus mencuba."],["Kedai piring hitam","Di rak kedai ada album lama, rakaman hujan dan bunyi ombak. Pemiliknya kata, “Tak semua bunyi perlu kuat untuk kita perasan.” Ki membelek rak sambil menyelesaikan satu kod."],["Lorong yang sibuk","Di luar, hon bersahut-sahutan. Ki kena pilih isyarat yang betul supaya tidak tersalah jalan. Dalam banyak bunyi, kadang-kadang yang kita perlukan cuma satu petunjuk jelas."],["Pintu studio","Sebuah studio kecil ada dua bilik: satu riuh, satu tenang. Ki mencari laluan yang paling kurang gangguan. Perhatikan nombor pada setiap jalan sebelum memilih."],["Radio lama","Di atas meja ada radio berdebu. Tombolnya masih boleh diputar. Satu nota menyuruh Ki dengar dahulu sebelum menjawab. Mungkin itu juga nasihat yang baik di luar permainan."],["Jeda sekejap","Lampu studio dimalapkan. Ki duduk dan biarkan satu lagu habis tanpa buat apa-apa. Saya harap Ki selalu ada ruang kecil macam ini untuk diri sendiri."],["Bilik latihan","Di dinding ada simbol muzik yang tersusun pelik. Ki cuba mencari coraknya. Walaupun tak tahu bermain alat muzik, Ki tetap boleh selesaikan teka-teki ini dengan memerhati."],["Di sebalik kaca","Hujan turun di luar tingkap studio. Orang di dalam sedang menyusun rakaman untuk dimainkan semula. Ada bunyi yang sesuai disimpan, ada yang lebih baik dibiarkan berlalu."],["Lagu terakhir","Jam hampir malam. Sebelum keluar, Ki perlu susun beberapa bunyi dan tanda. Bila susunannya betul, pintu ke bilik akhir akan terbuka."],["Ruang yang sunyi","Ki sampai ke sebuah bilik kecil dengan cahaya lampu hangat. Tiada bunyi kuat, cuma sebuah kotak di atas kerusi. Hadiah kedua sudah dekat."]],"bridge":"Untuk masa Ki mahu dengar lagu kegemaran, tengok video, atau duduk diam sekejap tanpa gangguan. Saya harap hadiah ini berguna dalam hari-hari biasa Ki.","tasks":[{"kind":"memory","title":"Lampu Pentas Pertama","question":"Hafal corak not muzik sebelum menyembunyikannya dan mengulanginya.","answer":["♪","♫","♬","♪","♩","♫"],"hints":["Tiga simbol pertama ialah ♪, ♫, ♬.","Selepas ♪ ♫ ♬, urutannya ialah ♪ ♩ ♫.","Jawapan tepat: ♪ → ♫ → ♬ → ♪ → ♩ → ♫."],"explain":"Mendengar bermula dengan memberi perhatian.","choices":["♪","♫","♬","♩"]},{"kind":"choice","title":"Suara Dalam Keramaian","question":"Seorang kawan sedang menerangkan masalah, tetapi Ki belum memahami maksudnya. Apakah langkah terbaik?","answer":"Dengar hingga selesai dan tanya dengan baik","hints":["Cari cara memahami sebelum memberi respons.","Jangan mencelah atau meneka sebelum orang itu selesai.","Jawapan tepat: Dengar hingga selesai dan tanya dengan baik."],"explain":"Mendengar dengan teliti ialah bentuk penghargaan.","choices":["Mencelah setiap ayat","Dengar hingga selesai dan tanya dengan baik","Tukar topik tanpa sebab","Terus membuat andaian"]},{"kind":"match","title":"Empat Suasana Muzik","question":"Padankan keperluan dengan jenis bunyi yang paling serasi.","answer":["Mahu bersemangat untuk bersenam","Mahu fokus membaca","Mahu tidur dengan selesa","Mahu menari dengan rakan"],"hints":["Pertimbangkan tempo dan jumlah gangguan.","Bersenam → rentak bertenaga; membaca → instrumental lembut; tidur → bunyi alam perlahan; menari → irama rancak.","Jawapan tepat: Mahu bersemangat untuk bersenam → Rentak bertenaga; Mahu fokus membaca → Instrumental lembut tanpa lirik; Mahu tidur dengan selesa → Bunyi alam dengan kelantangan rendah; Mahu menari dengan rakan → Irama rancak untuk menari."],"explain":"Muzik berbeza boleh menemani suasana yang berbeza.","choices":["Irama rancak untuk menari","Bunyi alam dengan kelantangan rendah","Instrumental lembut tanpa lirik","Rentak bertenaga"],"accept":["Rentak bertenaga","Instrumental lembut tanpa lirik","Bunyi alam dengan kelantangan rendah","Irama rancak untuk menari"]},{"kind":"input","title":"Anagram Irama","question":"Susun huruf A – M – A – R – I supaya menjadi perkataan berkaitan rentak muzik.","answer":"IRAMA","hints":["Perkataan ini bermaksud rentak atau alunan.","Lima huruf. Bermula I dan berakhir A.","Jawapan tepat: IRAMA."],"explain":"Irama membantu bunyi yang berbeza terasa tersusun."},{"kind":"pattern","title":"Rentak Ketukan","question":"Satu corak ketukan ialah 2, 4, 6, 8, __. Apakah nombor selepas 8?","answer":"10","hints":["Kenal pasti beza tetap setiap nombor.","Tambah 2 setiap langkah.","Jawapan tepat: 10."],"explain":"Corak mudah pun boleh menghasilkan rentak yang jelas."},{"kind":"visualDots","title":"Ketukan Pada Pentas","question":"Setiap bar menunjukkan satu ketukan lebih banyak daripada bar sebelumnya. Berapa ketukan pada bar kelima?","answer":"5","hints":["Kira ketukan pada setiap bar.","Coraknya 1, 2, 3, 4. Tambah satu.","Jawapan: 5 ketukan."],"explain":"Rentak yang rumit boleh dibina satu ketukan demi satu ketukan.","choices":["4","5","6","8"],"counts":[1,2,3,4]},{"kind":"truth","title":"Peraturan Bilik Bunyi","question":"Di pintu studio tertulis: lampu hijau bermaksud boleh masuk; lampu merah bermaksud jangan masuk; bunyi terlalu kuat perlu dikecilkan; jeda boleh membantu fokus. Tandakan Benar/Salah.","answer":["Benar","Salah","Benar","Benar"],"hints":["Teks pintu memberi empat arahan jelas.","Hijau boleh masuk; merah tidak boleh; bunyi kuat dikecilkan; jeda dibenarkan.","Jawapan: Benar, Salah, Benar, Benar."],"explain":"Kadang-kadang harmoni bermula apabila kita mendengar isyarat dengan betul.","statements":["Lampu hijau membenarkan Ki masuk.","Lampu merah juga membenarkan Ki masuk.","Bunyi yang terlalu kuat patut dikecilkan.","Jeda boleh membantu Ki memberi tumpuan."]},{"kind":"tiles","title":"Kepingan Dengar","question":"Susun SEMUA enam huruf menjadi kata kerja tentang memberi perhatian pada bunyi dan kata-kata.","answer":"DENGAR","hints":["Bab ini bukan tentang menutup seluruh dunia, tetapi memilih apa yang didengar.","Kata kerja bermula D dan berakhir R.","Jawapan: D – E – N – G – A – R (DENGAR)."],"explain":"Mendengar adalah tindakan aktif, bukan sekadar membiarkan bunyi lalu.","letters":["R","N","D","A","G","E"]},{"kind":"visualSignal","title":"Lampu Rakaman","question":"Lampu studio bertukar antara merah dan biru. Warna manakah yang patut muncul selepas corak ini?","answer":"MERAH","hints":["Lihat lampu pertama dan ketiga.","Coraknya merah, biru, merah, biru.","Jawapan: MERAH."],"explain":"Dalam bunyi yang sibuk, corak membantu kita mencari aturan.","choices":["MERAH","BIRU","EMAS","HIJAU"],"symbols":["MERAH","BIRU","MERAH","BIRU"],"palette":{"EMAS":"#f8cf82","BIRU":"#8fc3ee","HIJAU":"#9de2b5","MERAH":"#ec899f"}},{"kind":"pattern","title":"Rentak Yang Bertambah","question":"Ketukan muncul pada masa 1, 2, 4, 7, 11. Jarak antara masa meningkat 1, 2, 3, 4. Pada masa berapakah ketukan seterusnya?","answer":"16","hints":["Cari beza antara nombor berturutan, bukan nombornya sahaja.","Selepas beza 4, tambah beza 5 kepada 11.","Jawapan tepat: 16."],"explain":"Irama yang rumit boleh difahami dengan memecahkannya kepada corak kecil."},{"kind":"multi","title":"Pisahkan Bunyi Daripada Makna","question":"Pilih TEPAT TIGA tindakan yang membantu seseorang mendengar dengan lebih jelas.","answer":["Kurangkan gangguan","Tumpukan perhatian","Minta penjelasan bila keliru"],"hints":["Cari tindakan yang mengurangkan gangguan dan meningkatkan kefahaman.","Kurangkan gangguan, fokus dan bertanya jika tidak jelas.","Jawapan tepat: Kurangkan gangguan, Tumpukan perhatian, Minta penjelasan bila keliru."],"explain":"Mendengar bukan sekadar menerima bunyi; ia tentang memahami.","choices":["Kurangkan gangguan","Buka lebih banyak bunyi serentak","Tumpukan perhatian","Minta penjelasan bila keliru","Buat andaian tanpa mendengar"]},{"kind":"route","title":"Cari Studio Yang Tenang","question":"Setiap sambungan mempunyai nombor tahap gangguan. Pilih laluan Mula ke Tamat dengan jumlah gangguan PALING RENDAH.","answer":"A C F","hints":["Jumlahkan nombor pada setiap sambungan.","Laluan Mula → Denai → Pokok → Tamat bernilai 2 + 2 + 3.","Jawapan: M → A → C → F, jumlah gangguan 7."],"explain":"Kadang-kadang ketenangan datang daripada memilih laluan yang lebih sesuai.","route":{"nodes":[{"id":"M","label":"Mula","x":10,"y":54},{"id":"A","label":"Koridor","x":34,"y":18},{"id":"B","label":"Pasar","x":34,"y":82},{"id":"C","label":"Bilik A","x":63,"y":19},{"id":"D","label":"Bilik B","x":63,"y":82},{"id":"F","label":"Tamat","x":90,"y":50}],"edges":[{"a":"M","b":"A","cost":2},{"a":"M","b":"B","cost":4},{"a":"A","b":"C","cost":2},{"a":"A","b":"D","cost":6},{"a":"B","b":"C","cost":5},{"a":"B","b":"D","cost":3},{"a":"C","b":"F","cost":3},{"a":"D","b":"F","cost":4}],"start":"M","goal":"F","answer":["A","C","F"]}},{"kind":"match","title":"Empat Suis Studio","question":"Padankan butang dengan fungsinya berdasarkan label pada meja studio.","answer":["PLAY","PAUSE","VOLUME +","MUTE"],"hints":["Setiap istilah ini digunakan pada alat audio.","PLAY mula, PAUSE henti sementara, + kuatkan, MUTE senyapkan.","Padanan: PLAY—Mainkan; PAUSE—Jeda sementara; VOLUME +—Kuatkan bunyi; MUTE—Senyapkan."],"explain":"Pilihan kecil memberi Ki kuasa untuk mengawal bunyi di sekeliling.","choices":["Senyapkan","Mainkan","Kuatkan bunyi","Jeda sementara"],"accept":["Mainkan","Jeda sementara","Kuatkan bunyi","Senyapkan"]},{"kind":"choice","title":"Siapa Mendengar Dulu?","question":"Studio mempunyai tiga alat: satu mikrofon menerima suara; satu pembesar suara mengeluarkan bunyi; satu pengadun mengubah aras bunyi. Alat manakah menerima suara sebagai input?","answer":"Mikrofon","hints":["Bezakan menerima bunyi dengan menghasilkan bunyi.","Alat yang menerima gelombang suara untuk dirakam ialah mikrofon.","Jawapan: Mikrofon."],"explain":"Mula-mula kita belajar mendengar; barulah sesuatu boleh disampaikan.","choices":["Pengadun","Mikrofon","Pembesar suara"]},{"kind":"visualOrder","title":"Dari Sunyi Ke Lagu","question":"Susun langkah menghasilkan satu rakaman muzik yang mudah.","answer":"Tulis Dengar Rakam Main","hints":["Mulakan dengan menyediakan melodi sebelum dimainkan.","Tulis idea dahulu, dengar/cuba melodi, rakam, kemudian mainkan semula.","Jawapan: Tulis → Dengar → Rakam → Main."],"explain":"Bunyi yang sedap didengar ada proses di belakangnya.","answerList":["Tulis","Dengar","Rakam","Main"],"choices":["Rakam","Main","Dengar","Tulis"],"symbols":{"Tulis":"✍️","Dengar":"👂","Rakam":"🎙️","Main":"▶️"}},{"kind":"input","title":"Kod Nada","question":"Gunakan A=1, B=2, ... Z=26. Tukarkan 14 – 1 – 4 – 1 kepada satu perkataan muzik.","answer":"NADA","hints":["14 ialah N dan 4 ialah D.","Urutannya N–A–D–A.","Jawapan tepat: NADA."],"explain":"Nada yang lembut kadangkala membawa kesan yang besar."},{"kind":"order","title":"Lima Not Sebuah Kisah","question":"Lima kad ini membentuk kisah mendengar yang baik. Susun daripada membina ruang sehingga mendapat pemahaman.","answer":["Cari ruang yang kurang gangguan","Dengar tanpa menyampuk","Catat perkara yang penting","Tanya bahagian yang belum jelas","Rumusan apa yang difahami"],"hints":["Tindakan pertama sepatutnya membantu Ki memberi perhatian.","Ruang tenang → dengar → catat → tanya → rumuskan.","Jawapan tepat: Cari ruang yang kurang gangguan → Dengar tanpa menyampuk → Catat perkara yang penting → Tanya bahagian yang belum jelas → Rumusan apa yang difahami."],"explain":"Mendengar teliti membantu mengurangkan salah faham.","choices":["Tanya bahagian yang belum jelas","Rumusan apa yang difahami","Dengar tanpa menyampuk","Cari ruang yang kurang gangguan","Catat perkara yang penting"]},{"kind":"visualGrid","title":"Simbol Di Papan Bunyi","question":"Mula di petak TENGAH (B2). Bergerak satu petak ke BAWAH dan satu petak ke KIRI. Pilih petak tempat Ki berhenti.","answer":"C1","hints":["Petak tengah ialah baris B, lajur 2.","Turun menjadi C2, kemudian kiri menjadi C1.","Jawapan: C1 (ikon loceng)."],"explain":"Peka kepada susunan membantu Ki mencari isyarat yang betul.","cells":["♪","♫","♬","♩","🎧","🎼","🔔","🥁","🎹"]},{"kind":"order","title":"Rentak Perbualan","question":"Sebuah perbualan yang baik memerlukan empat tahap. Susun menurut petunjuk: mendengar mesti sebelum memahami; memahami sebelum menjawab; menjawab sebelum menyemak sama ada mesej diterima.","answer":["Dengar hingga selesai","Fahami maksud","Jawab dengan tenang","Semak kefahaman"],"hints":["Cari ayat yang menggunakan perkataan sebelum.","Dengar → Faham → Jawab → Semak.","Jawapan: Dengar hingga selesai → Fahami maksud → Jawab dengan tenang → Semak kefahaman."],"explain":"Ada melodi dalam percakapan yang memberi ruang kepada orang lain.","choices":["Semak kefahaman","Jawab dengan tenang","Dengar hingga selesai","Fahami maksud"]},{"kind":"truth","title":"Lembaran Nota Asli","question":"Di studio tertera: lagu A berdurasi 2 minit; lagu B 4 minit; lagu C 3 minit; album mini mengandungi A, B dan C sahaja. Tentukan Benar/Salah.","answer":["Benar","Salah","Benar","Salah"],"hints":["Gunakan jumlah atau masa yang TERTERA, bukan anggaran.","A+B=6 minit; B bukan paling singkat; tiga lagu; jumlah album = 9 minit.","Jawapan: Benar, Salah, Benar, Salah."],"explain":"Bunyi yang indah juga terhasil daripada ketepatan dan susunan.","statements":["A dan B berjumlah 6 minit.","Lagu B paling pendek.","Album mini mempunyai tiga lagu.","Jumlah album mini ialah 8 minit."]},{"kind":"tiles","title":"Peti Kesunyian","question":"Susun SEMUA huruf menjadi perkataan enam huruf yang bermaksud tiada suara atau tidak berbunyi.","answer":"SENYAP","hints":["Perkataan ini menggambarkan bilik apabila semua suis dimatikan.","Bermula S dan berakhir P.","Jawapan: S – E – N – Y – A – P (SENYAP)."],"explain":"Kesunyian sesekali membantu kita mendengar sesuatu yang penting.","letters":["A","P","S","Y","N","E"]},{"kind":"choice","title":"Ruang Untuk Diri","question":"Hari Ki sangat bising dan penuh tugasan. Apakah pilihan paling sesuai untuk berehat sebentar secara selamat?","answer":"Cari tempat sesuai dan dengar muzik pada kelantangan selesa","hints":["Utamakan pilihan yang membantu rehat tanpa menyusahkan diri.","Pilih rehat yang selesa dan kelantangan yang tidak terlalu kuat.","Jawapan tepat: Cari tempat sesuai dan dengar muzik pada kelantangan selesa."],"explain":"Berehat seketika juga sebahagian daripada menjaga diri.","choices":["Naikkan muzik paling kuat","Cari tempat sesuai dan dengar muzik pada kelantangan selesa","Abaikan rasa penat selamanya","Buka semua audio serentak"]},{"kind":"match","title":"Bahasa Muzik","question":"Padankan istilah dengan maksud.","answer":["Tempo","Lirik","Melodi","Jeda"],"hints":["Terdapat empat konsep: kelajuan, kata lagu, susunan nada dan masa berhenti.","Tempo=kelajuan; lirik=kata-kata; melodi=susunan nada; jeda=berhenti seketika.","Jawapan tepat: Tempo → Kelajuan muzik; Lirik → Kata-kata dalam lagu; Melodi → Susunan nada; Jeda → Berhenti seketika."],"explain":"Muzik mempunyai ruang untuk bunyi dan juga ruang untuk diam.","choices":["Berhenti seketika","Kata-kata dalam lagu","Kelajuan muzik","Susunan nada"],"accept":["Kelajuan muzik","Kata-kata dalam lagu","Susunan nada","Berhenti seketika"]},{"kind":"visualOdd","title":"Nota Yang Tersasar","question":"Setiap baris sepatutnya berselang-seli simbol ♪ dan ♫. Ada satu nota yang tersalah. Pilih petak tersebut.","answer":"B3","hints":["Perhatikan corak ♪ ♫ ♪ ♫.","Baris kedua mempunyai ♪ ♫ ♫ ♫. Simbol ketiga sepatutnya ♪.","Jawapan: B3."],"explain":"Muzik juga ada susunan yang boleh diuji.","cells":["♪","♫","♪","♫","♪","♫","♫","♫"]},{"kind":"memory","title":"Mesej Dari Radio Lama","question":"Hafal urutan tujuh simbol bunyi, kemudian sembunyikan dan ulang.","answer":["🎵","🔔","🎶","🎧","🔔","🎵","🎧"],"hints":["Empat simbol berbeza digunakan; beberapa simbol muncul dua kali.","Mula: 🎵 → 🔔 → 🎶 → 🎧.","Jawapan: 🎵 → 🔔 → 🎶 → 🎧 → 🔔 → 🎵 → 🎧."],"explain":"Lagu yang diingati kadang-kadang menjadi penanda satu masa yang istimewa.","choices":["🔔","🎧","🎵","🎶"]},{"kind":"keypad","title":"Nombor Dalam Irama","question":"Pola rentak ialah 5, 10, 20, 40. Setiap nilai DIDARAB DUA. Masukkan nombor seterusnya sebagai TIGA digit.","answer":"080","hints":["Bandingkan 5 ke 10 dan 10 ke 20.","40 × 2 = 80; tambah sifar di hadapan.","Kod tepat: 080."],"explain":"Apabila pola dapat dibaca, bunyi yang rumit menjadi lebih tersusun."},{"kind":"visualCompass","title":"Bunyi Dari Mana?","question":"Di pentas, bunyi bermula di arah UTARA. Ia bergerak satu suku pusingan mengikut arah jam. Bunyi kini datang dari arah mana?","answer":"TIMUR","hints":["Suku pusingan ialah 90°.","Daripada utara, satu putaran 90° mengikut jam sampai ke kanan.","Jawapan: TIMUR."],"explain":"Mendengar dengan teliti kadang-kadang bermula dengan tahu arah bunyi.","choices":["BARAT","SELATAN","TIMUR","UTARA"],"point":"E"},{"kind":"pattern","title":"Bar Muzik","question":"Satu bar mempunyai 4 ketukan. Berapa jumlah ketukan untuk 6 bar? Taip nombor sahaja.","answer":"24","hints":["Gunakan darab kerana setiap bar sama panjang.","4 × 6 = 24.","Jawapan tepat: 24."],"explain":"Bunyi yang berulang dengan pola boleh membentuk sesuatu yang tenang."},{"kind":"order","title":"Dari Riuh Ke Tenang","question":"Susun empat tindakan apabila persekitaran terlalu riuh supaya keputusan dibuat dengan lebih jelas.","answer":["Berhenti seketika","Alihkan perhatian daripada gangguan","Kenal pasti perkara utama","Fokus pada satu perkara dahulu"],"hints":["Mula dengan mewujudkan ruang untuk bertenang.","Berhenti → kurangkan gangguan → kenal pasti perkara utama → fokus.","Jawapan tepat: Berhenti seketika → Alihkan perhatian daripada gangguan → Kenal pasti perkara utama → Fokus pada satu perkara dahulu."],"explain":"Kadangkala yang kita perlukan bukan lebih banyak suara, tetapi lebih jelas pilihan.","choices":["Kenal pasti perkara utama","Fokus pada satu perkara dahulu","Berhenti seketika","Alihkan perhatian daripada gangguan"]},{"kind":"giftChoice","title":"Kotak Dari Studio","question":"Hadiah kedua membantu Ki mendengar muzik atau audio secara lebih peribadi tanpa perlu menggunakan pembesar suara bilik. Apakah hadiahnya?","answer":"EARPHONE","hints":["Barang kecil ini boleh disambungkan ke telefon.","Ia dipakai dekat telinga untuk mendengar lagu atau panggilan.","Jawapan: EARPHONE."],"explain":"Saya harap Ki boleh menikmati lagu kegemaran dengan selesa.","choices":["RADIO","LAMPU","EARPHONE","JAM"]}],"wish":"Selamat hari lahir lagi, Ki. Semoga tahun ini ada banyak lagu baharu yang Ki suka, perjalanan yang menyenangkan, dan masa rehat yang cukup. Tak perlu rasa bersalah untuk ambil masa sendiri."},{"name":"DAMAI","subtitle":"Untuk halaman yang belum Ki baca.","symbol":"📖","gift":"BUKU","intro":["Perjalanan terakhir membawa Ki ke sebuah kedai buku kecil. Kedainya tak besar, tetapi setiap rak ada cerita sendiri. Ada buku yang sudah lusuh, surat yang belum dihantar, dan satu meja kosong dekat tingkap.","Dalam Bab Damai, saya nak bercerita tentang perkara yang kadang-kadang susah disebut. Tentang belajar, memaafkan diri sendiri, dan memberi ruang untuk berubah. Jawapan mungkin tersembunyi pada perkataan yang Ki selalu dengar, cuma kali ini kita melihatnya dengan cara lain."],"scenes":[["Kedai di hujung jalan","Loceng pintu berbunyi apabila Ki masuk. Bau kertas dan kayu memenuhi ruang. Seorang penjaga tunjukkan rak bernombor dan berkata, “Ambil masa. Buku tak suka dibaca tergesa-gesa.”"],["Meja dekat tingkap","Di atas meja ada surat kosong dan sebatang pensel. Ki boleh memilih ayat yang mahu ditulis. Saya rasa kadang-kadang satu ayat yang jujur lebih bermakna daripada ucapan yang panjang."],["Rak kata-kata","Ki nampak perkataan seperti sabar, syukur dan empati ditulis pada kad kecil. Kad itu perlu disusun semula. Setiap satu membawa maksud yang berbeza."],["Laci berkunci","Di bawah rak ada laci dengan simbol halaman. Ki perlu mencari laluan dalam kedai yang paling singkat. Di dalam laci itu ada petunjuk untuk bab seterusnya."],["Halaman lama","Sebuah buku lama terbuka di tengah. Sebahagian tulisannya sudah pudar, tetapi mesejnya mudah: kita boleh belajar tanpa perlu tahu semua jawapan hari ini."],["Surat yang terlipat","Ki jumpa surat yang ditulis bertahun-tahun lalu. Ada ayat yang dipadam dan ditulis semula. Tak semua perkara perlu sempurna pada percubaan pertama."],["Sudut bacaan","Ada kerusi empuk di sebelah tingkap. Di luar, hujan turun perlahan. Ki selesaikan beberapa petunjuk sambil membayangkan hari yang tidak terlalu sibuk."],["Rak paling atas","Ki mencapai sebuah buku yang disusun di tempat tinggi. Di dalamnya ada corak simbol dan halaman yang hilang. Satu demi satu, maknanya mula jelas."],["Sampul untuk Ki","Di atas meja terakhir ada sampul tertutup. Nama Ki ditulis dengan tulisan tangan. Saya tak letak arahan susah di sini. Cuma beberapa petunjuk kecil sebelum hadiah terakhir."],["Halaman penutup","Ki membuka halaman paling akhir. Saya tinggalkan satu pesanan pendek: “Saya harap Ki baik-baik saja, walau apa pun cerita yang sedang Ki lalui.” Kotak terakhir menunggu di tepi meja."]],"bridge":"Saya pilih hadiah ini sebab ada masa satu muka surat boleh buat kita fikir dengan lebih tenang. Tak perlu habiskan cepat. Baca bila Ki ada masa, dan ambil apa yang bermanfaat.","tasks":[{"kind":"choice","title":"Ayat Pada Halaman Kosong","question":"Seseorang melakukan kesilapan. Ayat manakah paling membantu tanpa menafikan kesilapan itu?","answer":"Kesilapan ini boleh menjadi sesuatu yang Ki pelajari","hints":["Pilih ayat yang memberi ruang untuk belajar.","Elakkan label yang menghina atau ayat yang menafikan masalah.","Jawapan tepat: Kesilapan ini boleh menjadi sesuatu yang Ki pelajari."],"explain":"Kata-kata yang baik boleh mengakui kesilapan sambil membuka harapan.","choices":["Ki memang tidak boleh berubah","Kesilapan ini boleh menjadi sesuatu yang Ki pelajari","Semua perkara tidak pernah penting","Jangan pernah cuba lagi"]},{"kind":"input","title":"Anagram Damai","question":"Susun huruf I – A – D – A – M kepada perkataan yang bermaksud tenteram atau aman.","answer":"DAMAI","hints":["Perkataan ini dekat dengan ketenangan hati.","Lima huruf, bermula D, berakhir I.","Jawapan tepat: DAMAI."],"explain":"Kedamaian boleh bermula dengan cara kita melihat diri sendiri."},{"kind":"match","title":"Empat Jenis Surat","question":"Padankan keadaan dengan pembuka surat yang paling sesuai.","answer":["Surat terima kasih","Surat memohon maaf","Surat memberi semangat","Surat hari lahir"],"hints":["Tengok tujuan setiap surat terlebih dahulu.","Terima kasih → hargai bantuan; maaf → akui kesilapan; semangat → percaya usaha; hari lahir → doa dan ucapan.","Jawapan tepat: Surat terima kasih → Saya menghargai pertolongan Ki.; Surat memohon maaf → Saya sedar saya tersilap.; Surat memberi semangat → Saya percaya Ki boleh berusaha lagi.; Surat hari lahir → Saya doakan hari ini membawa kegembiraan.."],"explain":"Perkataan yang dipilih perlu sesuai dengan tujuan.","choices":["Saya doakan hari ini membawa kegembiraan.","Saya menghargai pertolongan Ki.","Saya sedar saya tersilap.","Saya percaya Ki boleh berusaha lagi."],"accept":["Saya menghargai pertolongan Ki.","Saya sedar saya tersilap.","Saya percaya Ki boleh berusaha lagi.","Saya doakan hari ini membawa kegembiraan."]},{"kind":"match","title":"Rak Perkataan","question":"Padankan kata dengan maksudnya.","answer":["Empati","Syukur","Harapan","Sabar"],"hints":["Baca maksud yang berkaitan dengan memahami, menghargai, percaya dan bertahan.","Empati=memahami perasaan; syukur=menghargai; harapan=percaya pada kemungkinan baik; sabar=bertahan dengan tenang.","Jawapan tepat: Empati → Memahami perasaan orang lain; Syukur → Menghargai apa yang ada; Harapan → Percaya pada kemungkinan baik; Sabar → Bertahan dengan tenang."],"explain":"Perkataan berbeza boleh membantu kita menghadapi hari yang berbeza.","choices":["Menghargai apa yang ada","Memahami perasaan orang lain","Percaya pada kemungkinan baik","Bertahan dengan tenang"],"accept":["Memahami perasaan orang lain","Menghargai apa yang ada","Percaya pada kemungkinan baik","Bertahan dengan tenang"]},{"kind":"order","title":"Surat Empat Baris","question":"Susun ayat menjadi surat yang logik, daripada mengenali hari sukar hingga menyampaikan harapan.","answer":["Saya tahu ada hari yang terasa berat.","Saya harap Ki memberi diri ruang untuk berehat.","Esok boleh membawa peluang baharu.","Saya doakan Ki menemui kekuatan untuk meneruskan."],"hints":["Surat bermula dengan memahami keadaan.","Fahami → rehat → harapan untuk esok → doa untuk meneruskan.","Jawapan tepat: Saya tahu ada hari yang terasa berat. → Saya harap Ki memberi diri ruang untuk berehat. → Esok boleh membawa peluang baharu. → Saya doakan Ki menemui kekuatan untuk meneruskan.."],"explain":"Kata yang lembut tidak menyelesaikan semua masalah, tetapi boleh memberi sokongan.","choices":["Esok boleh membawa peluang baharu.","Saya tahu ada hari yang terasa berat.","Saya doakan Ki menemui kekuatan untuk meneruskan.","Saya harap Ki memberi diri ruang untuk berehat."]},{"kind":"visualDots","title":"Halaman Yang Bertambah","question":"Satu buku nota menunjukkan bilangan tanda 1, 2, 3, 4 pada empat halaman. Berapakah tanda pada halaman kelima?","answer":"5","hints":["Lihat berapa banyak tanda ditambah setiap halaman.","Setiap halaman ada satu tanda lebih daripada sebelumnya.","Jawapan: 5 tanda."],"explain":"Sedikit tulisan setiap hari pun lama-lama menjadi satu cerita.","choices":["5","7","3","4"],"counts":[1,2,3,4]},{"kind":"truth","title":"Peraturan Rak Buku","question":"Pada meja ada empat nota: buku hijau di rak atas; surat putih dalam laci; pen hitam di sisi lampu; halaman kosong disimpan di dalam buku. Pilih Benar/Salah.","answer":["Benar","Salah","Benar","Benar"],"hints":["Semak kedudukan asal setiap benda.","Buku hijau atas, surat di laci, pen di lampu, halaman kosong dalam buku.","Jawapan: Benar, Salah, Benar, Benar."],"explain":"Kadangkala damai bermula dengan melihat apa yang sebenar ada di depan kita.","statements":["Buku hijau berada di rak atas.","Surat putih ada di bawah lampu.","Pen hitam terletak di sisi lampu.","Halaman kosong berada dalam sebuah buku."]},{"kind":"tiles","title":"Enam Huruf Menenangkan","question":"Susun SEMUA huruf menjadi perkataan enam huruf yang menggambarkan perasaan tidak gelisah.","answer":"TENANG","hints":["Perkataan ini melukiskan tujuan terakhir perjalanan Ki.","Bermula T, berakhir G, dan mempunyai enam huruf.","Jawapan: T – E – N – A – N – G (TENANG)."],"explain":"Tenang bukan bermakna semua masalah lenyap; tenang memberi ruang memilih langkah seterusnya.","letters":["N","G","T","A","E","N"]},{"kind":"visualSignal","title":"Penanda Buku","question":"Satu corak penanda buku bertukar antara emas dan hijau. Warna yang manakah seterusnya?","answer":"EMAS","hints":["Lihat warna pada penanda pertama dan ketiga.","Corak emas, hijau, emas, hijau.","Jawapan: EMAS."],"explain":"Perkara kecil yang berulang boleh membawa makna bila dilihat betul-betul.","choices":["HIJAU","EMAS","MERAH","BIRU"],"symbols":["EMAS","HIJAU","EMAS","HIJAU"],"palette":{"EMAS":"#f8cf82","BIRU":"#8fc3ee","HIJAU":"#9de2b5","MERAH":"#ec899f"}},{"kind":"pattern","title":"Buku Empat Halaman Sehari","question":"Ki membaca 4 halaman setiap hari selama 7 hari. Berapa halaman yang sudah dibaca semuanya? Taip nombor sahaja.","answer":"28","hints":["Darab halaman sehari dengan bilangan hari.","4 × 7 = 28.","Jawapan tepat: 28."],"explain":"Pengetahuan tumbuh satu halaman pada satu masa."},{"kind":"input","title":"Kod Hati","question":"Gunakan A=1 hingga Z=26. Tukarkan 8 – 1 – 20 – 9 kepada satu perkataan Melayu.","answer":"HATI","hints":["8=H dan 20=T.","Bacaan lengkap: H–A–T–I.","Jawapan tepat: HATI."],"explain":"Hati tidak selalu berubah oleh suara kuat; kadangkala oleh satu ayat ikhlas."},{"kind":"route","title":"Cari Sampul Rahsia","question":"Pilih laluan dari pintu kedai ke sampul akhir dengan jumlah masa PALING PENDEK. Nombor ialah minit untuk bergerak di antara tempat.","answer":"A C F","hints":["Kira jumlah minit pada setiap laluan.","Laluan Pintu → Rak → Meja → Sampul mengambil 2 + 2 + 3 minit.","Jawapan: M → A → C → F, jumlah 7 minit."],"explain":"Kadang-kadang jalan yang jelas hanya nampak selepas kita menyusun pilihan.","route":{"nodes":[{"id":"M","label":"Pintu","x":10,"y":54},{"id":"A","label":"Rak","x":34,"y":18},{"id":"B","label":"Laci","x":34,"y":82},{"id":"C","label":"Meja","x":63,"y":19},{"id":"D","label":"Tingkap","x":63,"y":82},{"id":"F","label":"Sampul","x":90,"y":50}],"edges":[{"a":"M","b":"A","cost":2},{"a":"M","b":"B","cost":4},{"a":"A","b":"C","cost":2},{"a":"A","b":"D","cost":6},{"a":"B","b":"C","cost":5},{"a":"B","b":"D","cost":3},{"a":"C","b":"F","cost":3},{"a":"D","b":"F","cost":4}],"start":"M","goal":"F","answer":["A","C","F"]}},{"kind":"match","title":"Penanda Dalam Diari","question":"Padankan perkataan dengan makna yang tertera pada glosari: SYUKUR=berterima kasih; SABAR=bertahan dengan tenang; EMPATI=memahami perasaan orang; HARAPAN=keinginan untuk masa depan.","answer":["SYUKUR","SABAR","EMPATI","HARAPAN"],"hints":["Glosari diberikan dalam soalan; baca setiap takrif.","Syukur = berterima kasih; sabar = bertahan; empati = memahami; harapan = keinginan masa depan.","Padanan: SYUKUR—Berterima kasih; SABAR—Bertahan dengan tenang; EMPATI—Memahami perasaan orang; HARAPAN—Keinginan untuk masa depan."],"explain":"Bahasa yang kita pilih boleh membantu hati memahami dirinya.","choices":["Keinginan untuk masa depan","Memahami perasaan orang","Berterima kasih","Bertahan dengan tenang"],"accept":["Berterima kasih","Bertahan dengan tenang","Memahami perasaan orang","Keinginan untuk masa depan"]},{"kind":"choice","title":"Halaman Yang Membawa Pulang","question":"Tiga nota dilekatkan pada tiga kotak. Nota A: “Semua soalan mesti dijawab hari ini.” Nota B: “Satu persoalan boleh direnungkan sedikit demi sedikit.” Nota C: “Tidak perlu pernah membaca.” Nota manakah paling menyokong sikap belajar secara berperingkat?","answer":"Nota B","hints":["Cari ayat yang tidak mendesak semua jawapan serentak.","Nota B mengizinkan proses perlahan dan bertahap.","Jawapan: Nota B."],"explain":"Rasa ingin tahu tidak memerlukan kita memahami segalanya pada satu hari.","choices":["Nota A","Nota C","Nota B"]},{"kind":"visualOrder","title":"Cerita Empat Halaman","question":"Susun peristiwa ini mengikut satu hari: mula menulis selepas bangun, sambung waktu rehat tengah hari, baca semula waktu petang, simpan buku sebelum tidur.","answer":"Pagi Tengah hari Petang Malam","hints":["Peristiwa ikut perjalanan waktu dalam satu hari.","Bermula dengan bangun pagi dan berakhir sebelum tidur.","Jawapan: Pagi → Tengah hari → Petang → Malam."],"explain":"Satu hari yang biasa pun boleh disimpan sebagai kenangan.","answerList":["Pagi","Tengah hari","Petang","Malam"],"choices":["Malam","Petang","Pagi","Tengah hari"],"symbols":{"Pagi":"🌄","Tengah hari":"☀️","Petang":"🌤️","Malam":"🌙"}},{"kind":"choice","title":"Dua Cara Menegur","question":"Ki mahu mengingatkan seseorang tentang kesilapan. Pilihan manakah paling jelas dan hormat?","answer":"Terangkan perkara yang salah dan cadangkan cara membaikinya","hints":["Teguran paling berkesan memberi maklumat yang berguna.","Fokus pada perbuatan dan cara membaiki, bukan menghina orangnya.","Jawapan tepat: Terangkan perkara yang salah dan cadangkan cara membaikinya."],"explain":"Kejujuran boleh disampaikan tanpa menyakitkan hati.","choices":["Mengejek di hadapan ramai orang","Terangkan perkara yang salah dan cadangkan cara membaikinya","Mendiamkan tanpa penjelasan selama-lamanya","Mengulang tuduhan tanpa bukti"]},{"kind":"order","title":"Lima Baris Ucapan","question":"Susun LIMA baris ini menjadi satu ucapan yang mempunyai pembuka, penghargaan, harapan, doa dan penutup.","answer":["Selamat hari lahir, Ki.","Terima kasih atas kebaikan Ki.","Semoga Ki terus menemukan perkara yang membahagiakan.","Saya doakan kesihatan dan ketenangan untuk Ki.","Semoga bab baharu hidup Ki membawa makna."],"hints":["Mulakan dengan ucapan hari lahir, bukan penutup.","Pembuka → terima kasih → harapan → doa → penutup.","Jawapan tepat: Selamat hari lahir, Ki. → Terima kasih atas kebaikan Ki. → Semoga Ki terus menemukan perkara yang membahagiakan. → Saya doakan kesihatan dan ketenangan untuk Ki. → Semoga bab baharu hidup Ki membawa makna.."],"explain":"Susunan ayat membantu mesej kedengaran lebih ikhlas dan jelas.","choices":["Saya doakan kesihatan dan ketenangan untuk Ki.","Semoga bab baharu hidup Ki membawa makna.","Terima kasih atas kebaikan Ki.","Selamat hari lahir, Ki.","Semoga Ki terus menemukan perkara yang membahagiakan."]},{"kind":"visualGrid","title":"Petak Dalam Manuskrip","question":"Mula dari petak KIRI BAWAH (C1). Bergerak dua petak ke ATAS, kemudian satu petak ke KANAN. Pilih petak tempat Ki berhenti.","answer":"A2","hints":["Kiri bawah ialah C1. Dua petak ke atas sampai A1.","Daripada A1, bergerak kanan sekali ke A2.","Jawapan: A2 (ikon sampul surat)."],"explain":"Arah yang jelas menjadikan petunjuk mudah diikuti.","cells":["📕","✉️","🌱","🪶","📖","🕯️","🗝️","⭐","🕊️"]},{"kind":"order","title":"Surat Yang Dilipat","question":"Susun empat ayat surat berdasarkan masa yang jelas: pagi → tengah hari → petang → malam.","answer":["Pagi saya membuka halaman pertama.","Tengah hari saya mencatat perkara yang dipelajari.","Petang saya berhenti seketika untuk berfikir.","Malam saya menutup buku dengan rasa syukur."],"hints":["Perhatikan penanda waktu pada setiap ayat.","Pagi berlaku sebelum tengah hari, kemudian petang, kemudian malam.","Jawapan: Pagi → Tengah hari → Petang → Malam."],"explain":"Satu hari yang sederhana juga berhak menjadi cerita yang indah.","choices":["Malam saya menutup buku dengan rasa syukur.","Petang saya berhenti seketika untuk berfikir.","Pagi saya membuka halaman pertama.","Tengah hari saya mencatat perkara yang dipelajari."]},{"kind":"truth","title":"Empat Ayat Dalam Manuskrip","question":"Dalam cerita: Ki membaca halaman 1 pada Isnin, halaman 2 pada Selasa, halaman 3 pada Rabu. Pada Khamis, Ki belum membuka buku. Tandakan Benar/Salah.","answer":["Benar","Salah","Benar","Salah"],"hints":["Semak hari dan nombor halaman yang dinyatakan.","Isnin 1, Selasa 2, Rabu 3, Khamis belum membaca.","Jawapan: Benar, Salah, Benar, Salah."],"explain":"Halaman yang belum dibuka tidak bermakna kisah sudah tamat.","statements":["Halaman 1 dibaca pada Isnin.","Halaman 3 dibaca pada Selasa.","Ki membaca pada Rabu.","Ki sudah membaca halaman 4 pada Khamis."]},{"kind":"tiles","title":"Kata Dalam Hati","question":"Susun SEMUA huruf menjadi perkataan enam huruf yang bermaksud jujur dan tulus melakukan sesuatu.","answer":"IKHLAS","hints":["Sesuatu pemberian tidak mesti mahal untuk mempunyai makna ini.","Huruf pertama I; huruf terakhir S.","Jawapan: I – K – H – L – A – S (IKHLAS)."],"explain":"Keikhlasan bukan ukuran harga, tetapi niat di sebalik suatu perbuatan.","letters":["A","S","K","I","L","H"]},{"kind":"match","title":"Sampul Dan Pesanan","question":"Padankan situasi dengan pesanan ringkas yang sesuai.","answer":["Ki berjaya menyiapkan sesuatu","Ki perlu berehat","Ki masih belajar perkara baharu","Ki berdepan pilihan sukar"],"hints":["Setiap pesanan perlu sepadan dengan keadaan.","Berjaya=raikan usaha; letih=rehat; belajar=tidak perlu terus mahir; pilihan sukar=nilai dan tujuan.","Jawapan tepat: Ki berjaya menyiapkan sesuatu → Raikan usaha yang telah dibuat; Ki perlu berehat → Ambil masa untuk pulihkan tenaga; Ki masih belajar perkara baharu → Tidak mengapa jika belum mahir; Ki berdepan pilihan sukar → Pilih berdasarkan nilai dan tujuan."],"explain":"Sokongan yang baik terasa tepat kerana ia memahami keadaan.","choices":["Raikan usaha yang telah dibuat","Ambil masa untuk pulihkan tenaga","Tidak mengapa jika belum mahir","Pilih berdasarkan nilai dan tujuan"],"accept":["Raikan usaha yang telah dibuat","Ambil masa untuk pulihkan tenaga","Tidak mengapa jika belum mahir","Pilih berdasarkan nilai dan tujuan"]},{"kind":"order","title":"Resipi Mendengar Hati","question":"Susun tindakan apabila Ki mahu memahami perasaan sendiri: namakan emosi, kenal pasti punca, pilih respons, semak keadaan.","answer":["Namakan perasaan","Fikirkan apa yang mencetuskannya","Pilih langkah kecil yang membantu","Perhatikan sama ada keadaan bertambah baik"],"hints":["Mulakan dengan mengenal perasaan.","Perasaan → punca → tindakan → semakan.","Jawapan tepat: Namakan perasaan → Fikirkan apa yang mencetuskannya → Pilih langkah kecil yang membantu → Perhatikan sama ada keadaan bertambah baik."],"explain":"Memahami diri selalunya mengambil masa dan itu tidak mengapa.","choices":["Pilih langkah kecil yang membantu","Perhatikan sama ada keadaan bertambah baik","Namakan perasaan","Fikirkan apa yang mencetuskannya"]},{"kind":"visualOdd","title":"Halaman Berbeza","question":"Setiap baris sepatutnya berselang-seli buku terbuka 📖 dan surat ✉️. Ada satu petak tersalah. Pilih petak itu.","answer":"B2","hints":["Corak yang betul ialah 📖 ✉️ 📖 ✉️.","Baris kedua mempunyai dua simbol 📖 pada awal. Yang kedua sepatutnya ✉️.","Jawapan: B2."],"explain":"Tidak semua kesalahan besar; kadang-kadang cuma satu simbol.","cells":["📖","✉️","📖","✉️","📖","📖","📖","✉️"]},{"kind":"memory","title":"Tujuh Tanda Pada Kertas","question":"Hafal urutan tujuh tanda di kertas, sembunyikan dan ulang.","answer":["📖","🕊️","✉️","🌱","📖","✉️","🌱"],"hints":["Simbol pertama ialah buku; simbol kedua ialah burung merpati.","Empat tanda awal: 📖 → 🕊️ → ✉️ → 🌱.","Jawapan: 📖 → 🕊️ → ✉️ → 🌱 → 📖 → ✉️ → 🌱."],"explain":"Ada perkara kecil yang tinggal dalam ingatan kerana kita memberi perhatian.","choices":["🌱","✉️","🕊️","📖"]},{"kind":"keypad","title":"Kunci Nombor Halaman","question":"Setiap bahagian mempunyai 6 halaman. Terdapat 4 bahagian. Kunci ialah jumlah halaman ditulis sebagai TIGA digit.","answer":"024","hints":["Darab halaman setiap bahagian dengan jumlah bahagian.","6 × 4 = 24. Tulis menggunakan tiga digit.","Kod: 024."],"explain":"Satu bab kecil boleh menyumbang kepada makna keseluruhan."},{"kind":"visualCompass","title":"Arah Ke Rak Buku","question":"Ki menghadap BARAT. Ki berpusing 90° mengikut arah jam. Sekarang Ki menghadap arah mana?","answer":"UTARA","hints":["Bayangkan arah pada kompas.","Putaran 90° mengikut jam dari barat menghala ke bahagian atas kompas.","Jawapan: UTARA."],"explain":"Menukar pandangan sedikit kadang-kadang membantu kita nampak sesuatu yang baharu.","choices":["TIMUR","UTARA","SELATAN","BARAT"],"point":"N"},{"kind":"input","title":"Anagram Halaman","question":"Susun huruf A – M – A – N – H – A – L menjadi satu perkataan yang terdapat di dalam buku dan boleh dibaca satu demi satu.","answer":"HALAMAN","hints":["Ia mempunyai nombor dalam kebanyakan buku.","Tujuh huruf, bermula H, berakhir N.","Jawapan tepat: HALAMAN."],"explain":"Satu halaman mungkin kecil, tetapi boleh membawa idea yang besar."},{"kind":"multi","title":"Isi Surat Yang Ikhlas","question":"Pilih TEPAT TIGA unsur yang membuat ucapan hari lahir terasa bermakna.","answer":["Doa yang baik","Penghargaan yang jujur","Harapan untuk masa depan"],"hints":["Pilih isi yang menghargai penerima dan hidupnya.","Doa, penghargaan, dan harapan lebih bermakna daripada ejekan atau tekanan.","Jawapan tepat: Doa yang baik, Penghargaan yang jujur, Harapan untuk masa depan."],"explain":"Ucapan yang baik bukan pertandingan kata-kata paling hebat.","choices":["Doa yang baik","Ejekan tentang kekurangan","Penghargaan yang jujur","Harapan untuk masa depan","Desakan agar sentiasa sempurna"]},{"kind":"giftChoice","title":"Kotak Di Meja Bacaan","question":"Hadiah ketiga mempunyai halaman yang boleh dibaca satu demi satu. Ia menyimpan ilmu atau cerita. Apakah hadiahnya?","answer":"BUKU","hints":["Ada kulit depan dan banyak halaman.","Ki boleh membukanya dan membaca kandungannya.","Jawapan: BUKU."],"explain":"Saya harap ada ayat yang menemani Ki pada hari yang memerlukan sedikit ketenangan.","choices":["BUKU","KASUT","EARPHONE","PAYUNG"]}],"wish":"Selamat hari lahir, Ki. Semoga Ki sentiasa ada ruang untuk belajar, berehat dan memahami diri sendiri. Saya doakan hati Ki tenang, fikiran lebih ringan, dan orang sekeliling menjaga Ki dengan baik."}];
const TOTAL=chapters.reduce((a,c)=>a+c.tasks.length,0);
const KEY='tiga_bab_satu_takdir_ki_visual_v3';
const app=document.getElementById('app');
const progress=document.getElementById('progress');
const clock=document.getElementById('clock');
const scoreLabel=document.getElementById('scoreLabel');
function blank(){return {phase:'home',chapter:0,index:0,solved:0,score:0,hintsUsed:0,wrong:0,started:0,correct:false,hintLevel:0,picks:[],selected:'',typed:'',matches:{},truth:{},memoryVisible:true,notice:'',mapFocus:0,giftOpened:false};}
let state=blank();
try {let prev=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('tiga_bab_satu_takdir_ki_90_puzzles_v2')||'null');if(prev&&['home','intro','puzzle','bridge','ending'].includes(prev.phase)&&Number.isInteger(prev.chapter)&&prev.chapter>=0&&prev.chapter<3&&Number.isInteger(prev.index)&&prev.index>=0&&prev.index<30&&Number.isInteger(prev.solved)&&prev.solved>=0&&prev.solved<=TOTAL){state={...blank(),...prev,picks:Array.isArray(prev.picks)?prev.picks:[],matches:prev.matches&&typeof prev.matches==='object'?prev.matches:{}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const esc=x=>String(x).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const normalize=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[.,;:!?\-]+/g,' ').replace(/\s+/g,' ');
function current(){return chapters[state.chapter].tasks[state.index]}
function panel(kicker,title,body,buttons=''){app.innerHTML=`<section class="panel"><div class="eyebrow">${esc(kicker)}</div><h1 class="${state.phase==='home'?'display':'h2'}">${title}</h1>${body}${buttons?`<div class="actions">${buttons}</div>`:''}</section>`;updateHeader();save()}
function button(label,act,extra=''){return `<button type="button" class="btn ${extra}" data-action="${act}">${label}</button>`}
function updateHeader(){progress.style.width=(state.solved/TOTAL*100)+'%';scoreLabel.textContent='Mata: '+state.score;updateClock()}
function updateClock(){let sec=state.started?Math.max(0,Math.floor((Date.now()-state.started)/1000)):0;clock.textContent=`${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
setInterval(updateClock,1000);
function resetPuzzle(){state.correct=false;state.hintLevel=0;state.mapFocus=Math.floor(state.index/3);state.giftOpened=false;state.picks=[];state.selected='';state.typed='';state.matches={};state.truth={};state.memoryVisible=true;state.notice='';state.wrong=0;}

function showHome(){state.phase='home';document.body.dataset.chapter='0';panel('Sebuah permainan khas untuk Ki','Tiga Bab,<br>Satu Takdir',`${heroArt(0,0)}<div class="intro"><p>Selamat hari lahir, Ki. Saya ada buat sesuatu yang sedikit berbeza untuk Ki tahun ini.</p><p>Ada tiga tempat untuk diterokai, 90 teka-teki untuk diselesaikan dan tiga hadiah di penghujung setiap bab. Saya tak nak Ki cuma tekan jawapan. Saya nak Ki rasa macam sedang berjalan dalam cerita kecil yang saya sediakan.</p><p>Tak perlu tergesa-gesa. Kalau buntu, ada petunjuk. Yang penting, sampai ke penghujung cerita.</p></div><div class="chapter-list"><div class="chapter-card"><div class="emoji">👣</div><strong>Bab I</strong><span>Langkah</span></div><div class="chapter-card"><div class="emoji">🎧</div><strong>Bab II</strong><span>Melodi</span></div><div class="chapter-card"><div class="emoji">📖</div><strong>Bab III</strong><span>Damai</span></div></div><div class="menu-pills"><span class="chip">90 teka-teki</span><span class="chip">Peta & puzzle bergambar</span><span class="chip">Anggaran 60–90 minit</span></div><p class="muted small">Tiada internet diperlukan selepas fail dibuka. Kemajuan tersimpan dalam pelayar yang sama. Setiap teka-teki mempunyai tiga petunjuk yang semakin jelas.</p>`,button('Mulakan perjalanan Ki →','begin','primary wide'));}
function intro(){state.phase='intro';let c=chapters[state.chapter];document.body.dataset.chapter=String(state.chapter);panel(`Bab ${state.chapter+1} daripada 3 · ${esc(c.name)}`,`${c.symbol} ${esc(c.name)}`,`${heroArt(state.chapter,0)}<p class="muted">${esc(c.subtitle)}</p><div class="intro">${c.intro.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="menu-pills"><span class="chip">30 teka-teki</span><span class="chip">10 babak</span><span class="chip">3 petunjuk setiap teka-teki</span></div>`,button('Buka bab ini →','startchapter','primary wide'));}
function sectionScene(){if(state.index%3!==0)return '';const si=Math.floor(state.index/3);const s=chapters[state.chapter].scenes[si];return `<div class="scene-illustration">${heroArt(state.chapter,si)}</div><div class="scene"><div class="scene-title">Babak ${si+1} · ${esc(s[0])}</div><p>${esc(s[1])}</p></div>`;}
function choiceHTML(t){return `<div class="method">PILIH SATU JAWAPAN</div><div class="choices">${t.choices.map((x,i)=>`<button type="button" class="option ${state.selected===x?'selected':''}" aria-pressed="${state.selected===x}" data-action="choose" data-value="${i}" ${state.correct?'disabled':''}>${esc(x)}</button>`).join('')}</div>`}
function multiHTML(t){return `<div class="method">PILIH TEPAT ${t.answer.length} PILIHAN</div><div class="choices">${t.choices.map((x,i)=>`<button type="button" class="option ${state.picks.includes(x)?'selected':''}" aria-pressed="${state.picks.includes(x)}" data-action="multichoose" data-value="${i}" ${state.correct?'disabled':''}>${esc(x)}</button>`).join('')}</div><div class="status">${state.picks.length} daripada ${t.answer.length} dipilih.</div>`}
function orderHTML(t){return `<div class="method">SUSUN DENGAN MENEKAN PILIHAN MENGIKUT URUTAN</div><div class="selected-list" aria-label="Susunan dipilih">${state.picks.length?state.picks.map((x,i)=>`<span class="mini">${i+1}. ${esc(x)}</span>`).join(''):'Belum ada potongan dipilih.'}</div><div class="stack">${t.choices.map((x,i)=>`<button type="button" class="option ${state.picks.includes(x)?'selected':''}" data-action="orderchoose" data-value="${i}" ${state.picks.includes(x)||state.correct?'disabled':''}>${esc(x)}</button>`).join('')}</div>${button('↶ Buang pilihan terakhir','undo','subtle')} ${button('Kosongkan susunan','clear','subtle')}`}
function inputHTML(t){return `<div class="method">TAIP JAWAPAN</div><input id="answer" class="field" type="text" placeholder="Taip jawapan Ki di sini…" value="${esc(state.typed)}" autocomplete="off" autocapitalize="off" spellcheck="false" ${state.correct?'disabled':''} aria-label="Jawapan teka-teki"><div class="muted small" style="margin-top:8px">Huruf besar atau kecil tidak mempengaruhi semakan.</div>`}
function matchHTML(t){return `<div class="method">PADANKAN KEEMPAT-EMPAT ITEM</div><div class="stack">${t.answer.map((x,i)=>`<div class="rowpair"><label for="match-${i}">${esc(x)}</label><select id="match-${i}" data-index="${i}" aria-label="Padanan untuk ${esc(x)}" ${state.correct?'disabled':''}><option value="">— Pilih maksud —</option>${t.choices.map(v=>`<option value="${esc(v)}" ${state.matches[i]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`).join('')}</div>`}
function memoryHTML(t){return `<div class="method">INGAT URUTAN, SEMBUNYIKAN, KEMUDIAN ULANG</div><div class="memory-board" aria-label="Urutan memori">${state.memoryVisible?t.answer.map(x=>`<span class="memory-symbol">${esc(x)}</span>`).join(''):'<span class="memory-hide">Urutan disembunyikan. Pilih simbol di bawah satu demi satu.</span>'}</div>${state.memoryVisible?button('Sembunyikan & jawab','hide','primary wide'):`<div class="selected-list" aria-label="Urutan jawapan Ki">${state.picks.length?state.picks.map(x=>`<span class="mini">${esc(x)}</span>`).join(''):'Pilih simbol mengikut susunan yang diingati.'}</div><div class="memory-keys">${t.choices.map((v,i)=>`<button type="button" class="tile" data-action="memorychoose" data-value="${i}" ${state.correct||state.picks.length>=t.answer.length?'disabled':''}>${esc(v)}</button>`).join('')}</div><div class="actions">${button('↶ Buang simbol','undo','subtle')}${button('Lihat urutan semula','reveal','subtle')}</div>`}`}

function pathWeight(t,step){if(!step.length)return 0;let before=t.route.start,sum=0;for(let x of step){const e=t.route.edges.find(e=>(e.a===before&&e.b===x)||(e.b===before&&e.a===x));if(e)sum+=e.cost;before=x;}return sum}
function routeHTML(t){const r=t.route,now=state.picks.length?state.picks[state.picks.length-1]:r.start;
 const routeLabels=[r.nodes.find(x=>x.id===r.start).label,...state.picks.map(k=>r.nodes.find(x=>x.id===k).label)];
 const svg=r.edges.map(e=>{const p=r.nodes.find(x=>x.id===e.a),q=r.nodes.find(x=>x.id===e.b);const a=r.start===e.a?0:state.picks.indexOf(e.a),b=r.start===e.b?0:state.picks.indexOf(e.b);const chosen=(e.a===r.start&&state.picks[0]===e.b)||(e.b===r.start&&state.picks[0]===e.a)||state.picks.some((id,i)=>i>0&&((state.picks[i-1]===e.a&&id===e.b)||(state.picks[i-1]===e.b&&id===e.a)));return `<line x1="${p.x}%" y1="${p.y}%" x2="${q.x}%" y2="${q.y}%" stroke="${chosen?'#a5e4c0':'#83859f'}" stroke-width="${chosen?4:2.1}"/><text x="${(p.x+q.x)/2}%" y="${(p.y+q.y)/2-3}%" text-anchor="middle" font-size="13" font-weight="700" paint-order="stroke" stroke="#1d2338" stroke-width="3" fill="#fff0ca">${e.cost}</text>`}).join('');
 const nodes=r.nodes.map(n=>{const used=state.picks.includes(n.id),connected=r.edges.some(e=>(e.a===now&&e.b===n.id)||(e.b===now&&e.a===n.id));let off=state.correct||n.id===r.start||!connected||used||state.picks.includes(r.goal)||state.picks.length>=5;return `<button class="route-node ${used?'taken':''} ${now===n.id?'current':''}" type="button" data-action="routepick" data-value="${n.id}" style="left:${n.x}%;top:${n.y}%" ${off?'disabled':''} aria-label="${esc(n.label)} (simpang ${n.id})">${n.id}<small>${esc(n.label)}</small></button>`}).join('');
 return `<div class="visual-card"><div class="visual-label">Peta interaktif · tekan simpang yang bersambung</div><div class="route-canvas"><svg role="img" aria-label="Peta rangkaian jalan dengan nilai bagi setiap sambungan" viewBox="0 0 100 100" preserveAspectRatio="none">${svg}</svg>${nodes}</div><div class="route-readout"><span>Jejak: ${esc(routeLabels.join(' → '))}</span><span>Jumlah: <strong>${pathWeight(t,state.picks)}</strong></span></div><p class="diagram-note">Mula ditandakan M. Tekan simpang yang bersambung hingga Tamat (F). Nombor pada garisan menunjukkan jarak, masa atau gangguan. Ki boleh undur jika tersalah.</p><div class="actions">${button('↶ Undur satu simpang','undo','subtle')}${button('Ulang laluan','clear','subtle')}</div></div>`;
}
