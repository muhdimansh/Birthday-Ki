 if(t.hasAttribute('data-toggle')){ps.toggles[+t.dataset.toggle]=!ps.toggles[+t.dataset.toggle];emitSound();showPuzzle();return}
 if(t.hasAttribute('data-item')){const name=currentPuzzle().items[+t.dataset.item][0];ps.items=ps.items.includes(name)?ps.items.filter(x=>x!==name):[...ps.items,name];emitSound();showPuzzle();return}
 if(t.hasAttribute('data-append')){let p=currentPuzzle();if(ps.seq.length<p.len){ps.seq.push(p.choices[+t.dataset.append]);emitSound();showPuzzle()}return}
 if(t.hasAttribute('data-cell')){let p=currentPuzzle(),key=t.dataset.cell;if(p.type==='cell'){ps.cell=key;showPuzzle()}else if(p.type==='path'){let last=ps.path.at(-1),[r,c]=key.split(',').map(Number),[lr,lc]=last.split(',').map(Number);if(p.safe.includes(key)&&Math.abs(r-lr)+Math.abs(c-lc)===1&&!ps.path.includes(key)){ps.path.push(key);notice='';emitSound();showPuzzle()}else{notice='Pilih petak hijau yang bersebelahan dengan laluan terakhir.';showPuzzle()}}return}
 if(t.hasAttribute('data-wire')){let key=t.dataset.wire;ps.wire[key]=ps.wire[key]==='A'?'B':ps.wire[key]==='B'?null:'A';emitSound();showPuzzle();return}
 if(t.hasAttribute('data-angle')){ps.angle=+t.dataset.angle;emitSound();showPuzzle();return}
 if(t.hasAttribute('data-turn')){ps.angle=(ps.angle+(t.dataset.turn==='left'?270:90))%360;emitSound();showPuzzle();return}
 if(t.hasAttribute('data-letter')){if(ps.seq.length<2){ps.seq.push(t.dataset.letter);emitSound();showPuzzle()}return}
 if(t.tagName==='SELECT'&&t.hasAttribute('data-pipe')){ps.pipes[+t.dataset.pipe]=t.value;return}
 if(t.tagName==='SELECT'&&t.hasAttribute('data-match')){ps.match[+t.dataset.match]=t.value;return}
 if(t.tagName!=='BUTTON')return;
 switch(t.dataset.act){
 case 'home':if(game.phase!=='home'){closeModal();game.phase='home';render()}break;
 case 'begin':if(game.solved===36){game.phase='final'}else if(game.solved>0&&game.solved%12===0){game.chapter=game.solved/12-1;game.phase='gift'}else{game.chapter=Math.floor(game.solved/12);game.phase='intro'}render();break;
 case 'enter':game.phase='explore';render();break;
 case 'puzzle':if(game.phase==='explore')showPuzzle();break;
 case 'close':closeModal();break;
 case 'hint':{let p=currentPuzzle();game.hints[p.id]=Math.min(3,(game.hints[p.id]||0)+1);save();showPuzzle();break}
 case 'check':checkPuzzle();break;
 case 'advance':transitionAdvance();break;
 case 'undo':ps.seq.pop();notice='';showPuzzle();break;
 case 'clearPuzzle':{let p=currentPuzzle();if(p.type==='path')ps.path=[p.safe[0]];else ps.seq=[];notice='';showPuzzle();break}
 case 'startStill':startStillness();break;
 case 'openGift':game.giftOpen=true;render();fanfare();confetti(65);break;
 case 'nextChapter':if(game.chapter<2){game.chapter++;game.phase='intro';game.giftOpen=false}else{game.phase='final';game.finished=true;confetti(90);fanfare()}render();break;
 case 'sound':switchSound();break;
 case 'help':instruction();break;
 case 'map':journal();break;
 case 'journal':journal();break;
 case 'letter':letter();break;
 case 'copyLetter':navigator.clipboard?.writeText(window._kiLetter||'').then(()=>{const b=$('[data-act=copyLetter]');if(b)b.textContent='Disalin ✓'}).catch(()=>{});break;
 case 'confirmReset':screenModal('Mula semula?', 'Jika mula semula, semua kemajuan dan petunjuk permainan akan dikosongkan pada pelayar ini.','Batal');$('#overlayRoot .actions').insertAdjacentHTML('beforeend',button('Ya, mula semula','reset','btn ghost'));break;
 case 'reset':restart();break;
 case 'zone':{let to=+t.dataset.i;if(to<=activeZone()){world.setZone(to);setTimeout(()=>world.setZone(activeZone()),1300)}}break;
 default:break;
 }
}
document.addEventListener('click',handleActions);
document.addEventListener('input',e=>{if(!ps)return;let t=e.target;if(t.hasAttribute('data-slider')){ps.sliders[+t.dataset.slider]=+t.value;let o=$('#val'+t.dataset.slider);if(o)o.textContent=currentPuzzle().type==='radio'?currentPuzzle().choices[+t.value]:t.value}else if(t.id==='answerInput'){ps.code=t.value}else if(t.hasAttribute('data-final')){ps.match[+t.dataset.final]=t.value}});
document.addEventListener('change',e=>{let t=e.target;if(!ps)return;if(t.hasAttribute('data-pipe'))ps.pipes[+t.dataset.pipe]=t.value;if(t.hasAttribute('data-match'))ps.match[+t.dataset.match]=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlayRoot').hidden)closeModal();if(e.key==='Enter'&&!$('#overlayRoot').hidden&&modalKind==='open'&&$('#overlayRoot [data-act=check]')&&e.target.tagName==='INPUT')checkPuzzle()});
// Readonly diagnostics for local QA; gameplay still validates every user action.
window.KI_GAME_QA={chapters,puzzles,state:()=>({...game}),current:()=>currentPuzzle(),answer:()=>correctValue(currentPuzzle()),world:()=>world.available};
render();
</script></body></html>
