function bridge(){state.phase='bridge';const c=chapters[state.chapter];panel(`Bab ${state.chapter+1} telah tamat`,'Satu hadiah terbuka',`<div class="center big-symbol">${c.symbol} ✦</div><div class="gift-box"><div class="eyebrow">Hadiah yang Ki temui</div><div class="gift">${esc(c.gift)}</div><div class="muted">${esc(c.subtitle)}</div></div><div class="intro"><p>${esc(c.bridge)}</p><p><strong>Ucapan hari lahir untuk Ki:</strong> ${esc(c.wish)}</p></div><div class="menu-pills"><span class="chip">${state.solved} / ${TOTAL} diselesaikan</span><span class="chip">Mata: ${state.score}</span></div>`,button(state.chapter<2?'Sambung ke bab berikutnya →':'Buka surat terakhir untuk Ki →','nextchapter','primary wide'));}
function ending(){state.phase='ending';const totalSecs=state.started?Math.max(0,Math.floor((Date.now()-state.started)/1000)):0;const mins=Math.floor(totalSecs/60);panel('Surat terakhir · Khas untuk Ki','Selamat Hari Lahir, Ki ✦',`<div class="center big-symbol">👣 · 🎧 · 📖</div><div class="divider"></div><div class="letter"><p>Ki,</p><p>Selepas semua simpang, rentak, huruf dan halaman, akhirnya Ki sampai ke penghujung cerita ini. Tetapi saya harap perjalanan sebenar Ki masih dipenuhi banyak permulaan yang indah.</p><p><strong>KASUT — untuk setiap langkah.</strong><br>Semoga setiap tempat yang Ki tuju membawa pengalaman yang baik. Saya doakan agar Ki sentiasa diberi keberanian untuk memulakan sesuatu, kesabaran untuk belajar, dan keyakinan bahawa langkah kecil juga ada nilainya. Jika satu hari terasa berat, Ki tidak perlu membuktikan apa-apa dengan berlari. Cukup bergerak dengan cara yang paling baik untuk Ki.</p><p><strong>EARPHONE — untuk setiap melodi.</strong><br>Semoga Ki sentiasa menemukan lagu yang membuat hari terasa lebih ringan. Ada masa dunia terlalu bising dan terlalu banyak perkara mahu didengari. Saya harap hadiah kecil ini mengingatkan Ki bahawa Ki boleh memilih masa untuk berehat, mendengar muzik yang disukai, dan memberi diri sendiri ruang yang cukup.</p><p><strong>BUKU — untuk setiap halaman.</strong><br>Semoga setiap perkara yang Ki baca membuka satu pintu baharu dalam fikiran. Moga ada ayat yang membuat Ki tersenyum, ada halaman yang memberi semangat ketika penat, dan ada kata-kata yang membantu Ki melihat hidup dengan lebih tenang. Tidak semua jawapan datang serentak. Kadangkala, kita menemuinya satu halaman pada satu masa.</p><p><strong>Selamat hari lahir, Ki.</strong><br>Saya doakan Ki dikurniakan kesihatan yang baik, fikiran yang jernih, hati yang lapang, rezeki yang berkat, dan orang-orang yang menghargai Ki dengan ikhlas. Semoga usaha Ki membuahkan hasil, impian Ki berkembang dengan cara yang baik, dan setiap tahun yang tiba membawa sebab baharu untuk bersyukur.</p><p>Semoga Ki tidak kehilangan rasa ingin tahu walaupun dunia semakin sibuk. Semoga Ki tetap mampu menikmati perkara kecil: suasana selepas hujan, lagu yang datang pada waktu yang tepat, dan satu ayat yang tiba-tiba mengubah cara kita memahami sesuatu.</p><p>Jika ada hari yang tidak menjadi seperti dirancang, saya harap Ki tetap lembut terhadap diri sendiri. Jika ada kejayaan yang kecil, saya harap Ki sempat meraikannya. Jika ada jalan baharu yang ingin diteroka, saya harap Ki mempunyai keberanian untuk mencuba dan kebijaksanaan untuk menjaga diri.</p><p>Terima kasih kerana menjadi sebahagian daripada cerita yang ingin saya raikan pada hari istimewa ini. Saya memilih tiga hadiah ini bukan kerana semuanya besar, tetapi kerana maknanya saya harap boleh menemani Ki lebih lama daripada hari lahir ini.</p><p><strong>Tiga bab, tiga hadiah, satu pesanan:</strong><br>Teruskan melangkah. Temukan melodi Ki. Dan jangan berhenti membuka halaman baharu.</p><p>Untuk tahun baharu usia Ki, saya ada lebih banyak doa: semoga urusan yang rumit dipermudahkan, usaha yang ikhlas membuahkan hasil, hati yang penat diberi peluang berehat, dan fikiran yang sibuk menemukan semula keseimbangan. Semoga kesihatan Ki baik, setiap perjalanan selamat, setiap rezeki bermanfaat, dan setiap impian didekati dengan cara yang indah.</p><p>Saya doakan Ki sentiasa menemukan orang yang mendengar tanpa cepat menghukum, menghargai tanpa perlu membandingkan, dan menyokong tanpa memaksa. Jika tahun ini membawa cabaran, semoga Ki juga diberi kebijaksanaan dan ruang untuk menghadapinya satu demi satu.</p><p>Saya harap Ki dapat ketawa atas hal-hal kecil, menikmati makanan yang disukai, mengunjungi tempat yang belum pernah diteroka, mendengar lagu yang menjadi kegemaran baharu, dan membaca kisah yang mengubah cara melihat sesuatu. Semoga ulang tahun Ki bukan sekadar satu tarikh, tetapi permulaan banyak kenangan baik.</p><p>Saya tidak boleh menjanjikan hari yang sentiasa mudah, tetapi saya boleh mendoakan yang baik untuk Ki: semoga setiap keputusan besar datang bersama petunjuk yang jelas, setiap keberhasilan disertai syukur, dan setiap kesukaran mengajar sesuatu tanpa memadam rasa ingin tahu Ki.</p><p><strong>Dan kalau Ki terlupa satu perkara selepas menamatkan sembilan puluh teka-teki ini, ingatlah yang ini:</strong> Saya menghargai Ki sebagai seseorang yang mempunyai perjalanan, melodi dan cerita tersendiri. Ki tidak perlu menamatkan semuanya dengan sempurna untuk layak diraikan.</p><p>Untuk langkah yang akan datang, untuk lagu yang belum didengar, untuk halaman yang belum dibaca — <strong>selamat hari lahir, Ki. Semoga tahun ini penuh kebaikan, harapan, dan damai. ✦</strong></p><p>Semoga tahun ini menjadi bab yang baik untuk Ki.<br><strong>Selamat hari lahir sekali lagi. ✦</strong></p></div><div class="divider"></div><div class="menu-pills"><span class="chip">${TOTAL}/${TOTAL} teka-teki</span><span class="chip">Masa ${mins} minit</span><span class="chip">${state.hintsUsed} petunjuk digunakan</span><span class="chip">${state.score} mata</span></div>`,button('Baca semula dari awal ↻','restart','primary wide'));}
function render(){if(state.phase==='home')showHome();else if(state.phase==='intro')intro();else if(state.phase==='puzzle')puzzle();else if(state.phase==='bridge')bridge();else ending();}
function answerOk(){const t=current();if(t.kind==='choice')return state.selected===t.answer;
 if(t.kind==='multi')return state.picks.length===t.answer.length&&t.answer.every(v=>state.picks.includes(v));
 if(t.kind==='order'||t.kind==='memory')return state.picks.length===t.answer.length&&t.answer.every((v,i)=>v===state.picks[i]);
 if(t.kind==='match')return t.accept.every((v,i)=>state.matches[i]===v);
 if(t.kind==='truth')return t.answer.every((v,i)=>state.truth[i]===v);
 if(t.kind==='tiles')return state.picks.map(i=>t.letters[i]).join('')===t.answer;
 if(t.kind==='keypad')return state.picks.join('')===t.answer;
 let values=[t.answer,...(t.accept||[])];return values.some(x=>normalize(x)===normalize(state.typed));}
function check(){if(state.correct)return;const t=current();if(t.kind==='input'||t.kind==='pattern')state.typed=document.getElementById('answer')?.value||'';let ok=answerOk();if(ok){state.correct=true;state.solved+=1;state.score+=Math.max(5,20-5*state.hintLevel-2*state.wrong);state.notice='✓ Tepat! Pintu ke halaman seterusnya telah terbuka.';}else{state.wrong+=1;state.notice='Jawapan belum tepat. Ki boleh cuba lagi atau gunakan petunjuk. Permainan tidak akan bergerak sehingga jawapan betul.';}puzzle()}
function next(){if(!state.correct)return;if(state.index<chapters[state.chapter].tasks.length-1){state.index++;resetPuzzle();puzzle()}else bridge();window.scrollTo({top:0,behavior:'smooth'})}
function action(e){const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;const t=state.phase==='puzzle'?current():null;
 if(a==='begin'){state=blank();state.started=Date.now();state.phase='intro';intro();}
 else if(a==='startchapter'){resetPuzzle();puzzle()}
 else if(a==='restart'){state=blank();showHome()}
 else if(a==='nextchapter'){if(state.chapter<2){state.chapter++;state.index=0;resetPuzzle();intro()}else ending();}
 else if(a==='choose'&&t&&!state.correct){state.selected=t.choices[Number(v)];state.notice='';puzzle()}
 else if(a==='multichoose'&&t&&!state.correct){const x=t.choices[Number(v)];state.picks=state.picks.includes(x)?state.picks.filter(y=>y!==x):[...state.picks,x];state.notice='';puzzle()}
 else if(a==='orderchoose'&&t&&!state.correct){const x=t.choices[Number(v)];if(!state.picks.includes(x))state.picks.push(x);state.notice='';puzzle()}
 else if(a==='truth'&&t&&!state.correct){state.truth[Number(b.dataset.index)]=v;state.notice='';puzzle()}
 else if(a==='tilepick'&&t&&!state.correct){let ix=Number(v);if(!state.picks.includes(ix))state.picks.push(ix);state.notice='';puzzle()}
 else if(a==='digit'&&t&&!state.correct){if(state.picks.length<3)state.picks.push(v);state.notice='';puzzle()}
 else if(a==='memorychoose'&&t&&!state.correct&&!state.memoryVisible){if(state.picks.length<t.answer.length)state.picks.push(t.choices[Number(v)]);state.notice='';puzzle()}
 else if(a==='undo'&&t&&!state.correct){state.picks.pop();state.notice='';puzzle()}
 else if(a==='clear'&&t&&!state.correct){state.picks=[];state.notice='';puzzle()}
 else if(a==='hide'&&t&&!state.correct){state.memoryVisible=false;state.picks=[];state.notice='';puzzle()}
 else if(a==='reveal'&&t&&!state.correct){state.memoryVisible=true;state.picks=[];state.notice='';puzzle()}
 else if(a==='hint'&&t&&!state.correct){state.hintLevel=Math.min(3,state.hintLevel+1);state.hintsUsed++;state.notice='';puzzle()}
 else if(a==='check'){check()}
 else if(a==='next'){next()}
 if(['begin','startchapter','restart','nextchapter'].includes(a))window.scrollTo({top:0,behavior:'smooth'});
}
app.addEventListener('click',action);
app.addEventListener('input',e=>{if(e.target?.id==='answer'){state.typed=e.target.value;save();}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='answer'){e.preventDefault();check()}});
app.addEventListener('change',e=>{if(e.target.matches('select[data-index]')){state.matches[e.target.dataset.index]=e.target.value;state.notice='';save()}});
window.BIRTHDAY_GAME_QA={chapters,total:TOTAL,normalize,answerOk,version:'2.0-90'};
render();
})();
</script>
</body>
