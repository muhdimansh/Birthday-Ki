}
function bridge(){state.phase='bridge';document.body.dataset.chapter=String(state.chapter);const c=chapters[state.chapter];
 const opened=state.giftOpened;
 const stage=`<div class="gift-stage ${opened?'open':''}"><div class="present-shell"><div class="present-glow"></div><div class="present-body"></div><div class="present-lid"></div><div class="bow">🎀</div></div>${opened?`<div class="gift-reveal">${prizeArt(state.chapter)}<div class="eyebrow">Hadiah Bab ${state.chapter+1}</div><div class="gift">${esc(c.gift)}</div></div>`:`<p class="muted">Ki sudah selesaikan semua 30 teka-teki bab ini. Tekan butang untuk buka kotak.</p>`}</div>`;
 panel(`Bab ${state.chapter+1} telah tamat`,opened?'Ini hadiah untuk Ki ✦':'Ada sesuatu untuk Ki',`${heroArt(state.chapter,9)}${stage}${opened?`<div class="intro"><p>${esc(c.bridge)}</p><p>${esc(c.wish)}</p></div><div class="menu-pills"><span class="chip">${state.solved}/${TOTAL} selesai</span><span class="chip">${state.score} mata</span></div>`:''}`,opened?button(state.chapter<2?'Masuk ke bab berikutnya →':'Baca surat terakhir untuk Ki →','nextchapter','primary wide'):button('🎁 Buka hadiah','openGift','primary wide'));
}
function ending(){state.phase='ending';document.body.dataset.chapter='2';const seconds=state.started?Math.max(0,Math.floor((Date.now()-state.started)/1000)):0;const minutes=Math.floor(seconds/60);
 panel('Surat terakhir · untuk Ki','Selamat Hari Lahir, Ki ✦',`${heroArt(2,9)}<div class="ending-art"><span>👟</span><span>🎧</span><span>📖</span></div><div class="letter"><p>Ki,</p><p>Akhirnya habis juga 90 teka-teki. Terima kasih sebab sanggup ikut cerita yang saya buat ni sampai penghujung. Harap Ki seronok, walaupun mungkin ada masa Ki geram juga dengan soalan saya.</p><p>Saya pilih tiga hadiah ni sebab setiap satu ada perkara yang saya nak doakan untuk Ki.</p><p><strong>KASUT — untuk langkah yang seterusnya.</strong><br>Saya harap Ki dapat pergi ke tempat yang Ki teringin lawat, cuba benda yang dah lama Ki fikir nak buat, dan terus yakin dengan pilihan sendiri. Tak semestinya laju. Janji selamat dan sampai.</p><p><strong>EARPHONE — untuk masa Ki nak tenang.</strong><br>Untuk lagu yang Ki ulang banyak kali, video yang buat Ki ketawa, dan waktu Ki cuma nak berehat. Saya harap sentiasa ada sedikit ruang dalam hari Ki untuk perkara yang Ki suka.</p><p><strong>BUKU — untuk hari-hari yang perlukan kata-kata.</strong><br>Saya harap ada ayat dalam buku yang buat Ki rasa lebih ringan, atau sekurang-kurangnya beri sesuatu yang baik untuk difikirkan. Baca ikut masa Ki. Tak ada tarikh akhir.</p><p><strong>Selamat hari lahir, Ki.</strong></p><p>Saya doakan Ki sihat, tidur cukup, makan dengan baik, dan sentiasa selamat ke mana pun Ki pergi. Semoga kerja dan urusan Ki dipermudahkan. Semoga duit yang Ki usahakan cukup untuk keperluan, impian dan sedikit perkara yang Ki suka.</p><p>Kalau ada rancangan yang belum menjadi, saya harap Ki tak terlalu keras dengan diri sendiri. Kalau ada sesuatu yang berjaya, walaupun kecil, saya harap Ki sempat rasa bangga. Ki dah buat banyak perkara sampai ke hari ini.</p><p>Saya doakan Ki jumpa orang yang baik, yang mendengar bila Ki bercerita dan menghargai Ki sebagaimana adanya. Saya harap tahun ini Ki ada banyak sebab untuk ketawa, banyak hari yang biasa tapi menyenangkan, dan lebih banyak kenangan yang elok untuk disimpan.</p><p>Terima kasih sebab jadi sebahagian daripada hari-hari yang saya ingat dengan baik. Saya tak pandai buat ucapan yang sempurna, tapi saya memang nak hari lahir Ki rasa istimewa. Sebab itu saya buat permainan ni.</p><p>Kalau suatu hari Ki terjumpa semula fail ini, mungkin Ki akan ingat tiga perkara: <strong>terus melangkah, dengar apa yang menenangkan, dan beri ruang untuk cerita baharu.</strong></p><p>Semoga tahun baru usia Ki jadi tahun yang baik. Dan kalau ada hari yang kurang baik pun, saya harap Ki sentiasa ada kekuatan dan orang yang boleh dipercayai untuk melaluinya.</p><p><strong>Happy birthday, Ki. Jaga diri baik-baik, ya. 🎂</strong></p><p>— Daripada saya, yang sengaja buat Ki jawab 90 soalan sebelum dapat hadiah.</p></div><div class="divider"></div><div class="menu-pills"><span class="chip">90/90 teka-teki</span><span class="chip">${minutes} minit</span><span class="chip">${state.hintsUsed} petunjuk</span><span class="chip">${state.score} mata</span></div>`,button('Main semula ↻','restart','primary wide'));
}
function render(){if(state.phase==='home')showHome();else if(state.phase==='intro')intro();else if(state.phase==='puzzle')puzzle();else if(state.phase==='bridge')bridge();else ending();}
function answerOk(){const t=current();if(['choice','giftChoice','visualDots','visualSignal','visualGrid','visualOdd','visualCompass'].includes(t.kind))return state.selected===t.answer;
 if(t.kind==='route')return state.picks.join(',')===t.route.answer.join(',');
 if(t.kind==='visualOrder')return state.picks.join('|')===t.answerList.join('|');
 if(t.kind==='multi')return state.picks.length===t.answer.length&&t.answer.every(v=>state.picks.includes(v));
 if(t.kind==='order'||t.kind==='memory')return state.picks.length===t.answer.length&&t.answer.every((v,i)=>v===state.picks[i]);
 if(t.kind==='match')return t.accept.every((v,i)=>state.matches[i]===v);
 if(t.kind==='truth')return t.answer.every((v,i)=>state.truth[i]===v);
 if(t.kind==='tiles')return state.picks.map(i=>t.letters[i]).join('')===t.answer;
 if(t.kind==='keypad')return state.picks.join('')===t.answer;
 let values=[t.answer,...(t.accept||[])];return values.some(x=>normalize(x)===normalize(state.typed));}
function check(){if(state.correct)return;const t=current();if(t.kind==='input'||t.kind==='pattern')state.typed=document.getElementById('answer')?.value||'';let ok=answerOk();if(ok){state.correct=true;state.solved+=1;state.score+=Math.max(5,20-5*state.hintLevel-2*state.wrong);state.notice='✓ Tepat! Pintu ke halaman seterusnya telah terbuka.';}else{state.wrong+=1;state.notice='Jawapan belum tepat. Ki boleh cuba lagi atau gunakan petunjuk. Permainan tidak akan bergerak sehingga jawapan betul.';}puzzle()}
function next(){if(!state.correct)return;if(state.index<chapters[state.chapter].tasks.length-1){state.index++;resetPuzzle();puzzle()}else {state.giftOpened=false;bridge()}window.scrollTo({top:0,behavior:'smooth'})}
function action(e){const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;const t=state.phase==='puzzle'?current():null;
 if(a==='begin'){state=blank();state.started=Date.now();state.phase='intro';intro();}
 else if(a==='startchapter'){resetPuzzle();puzzle()}
 else if(a==='restart'){state=blank();showHome()}
 else if(a==='nextchapter'&&state.giftOpened){if(state.chapter<2){state.chapter++;state.index=0;resetPuzzle();intro()}else ending();}
 else if(a==='openGift'&&state.phase==='bridge'&&!state.giftOpened){state.giftOpened=true;bridge()}
 else if(a==='mapstop'&&t){let n=Number(v);if(Number.isInteger(n)&&n>=0&&n<=Math.floor(state.index/3)){state.mapFocus=n;let d=app.querySelector('.map-drawer');if(d){const p=d.querySelector('.map-caption');if(p){const s=chapters[state.chapter].scenes[n];p.innerHTML=`<strong>${esc(s[0])}.</strong> ${esc(s[1])}`;}}save();}}
 else if(a==='gridpick'&&t&&!state.correct){state.selected=v;state.notice='';puzzle()}
 else if(a==='routepick'&&t&&t.kind==='route'&&!state.correct){const last=state.picks.length?state.picks[state.picks.length-1]:t.route.start;const connected=t.route.edges.some(e=>(e.a===last&&e.b===v)||(e.b===last&&e.a===v));if(connected&&v!==t.route.start&&!state.picks.includes(v)&&!state.picks.includes(t.route.goal)&&state.picks.length<5)state.picks.push(v);state.notice='';puzzle()}
 else if(a==='choose'&&t&&!state.correct){state.selected=t.choices[Number(v)];state.notice='';puzzle()}
 else if(a==='multichoose'&&t&&!state.correct){const x=t.choices[Number(v)];state.picks=state.picks.includes(x)?state.picks.filter(y=>y!==x):[...state.picks,x];state.notice='';puzzle()}
 else if(a==='orderchoose'&&t&&!state.correct){const x=t.choices[Number(v)];if(!state.picks.includes(x))state.picks.push(x);state.notice='';puzzle()}
 else if(a==='truth'&&t&&!state.correct){state.truth[Number(b.dataset.index)]=v;state.notice='';puzzle()}
 else if(a==='tilepick'&&t&&!state.correct){let ix=Number(v);if(!state.picks.includes(ix))state.picks.push(ix);state.notice='';puzzle()}
 else if(a==='digit'&&t&&!state.correct){if(state.picks.length<3)state.picks.push(v);state.notice='';puzzle()}
 else if(a==='memorychoose'&&t&&!state.correct&&!state.memoryVisible){if(state.picks.length<t.answer.length)state.picks.push(t.choices[Number(v)]);state.notice='';puzzle()}
 else if(a==='undo'&&t&&!state.correct){state.picks.pop();state.notice='';puzzle()}
 else if(a==='clear'&&t&&!state.correct){state.picks=[];state.notice='';puzzle()}
 else if(a==='hide'&&t&&!state.correct){state.memoryVisible=false;state.picks=[];state.notice='';puzzle()}
 else if(a==='reveal'&&t&&!state.correct){state.memoryVisible=true;state.picks=[];state.notice='';puzzle()}
 else if(a==='hint'&&t&&!state.correct){state.hintLevel=Math.min(3,state.hintLevel+1);state.hintsUsed++;state.notice='';puzzle()}
 else if(a==='check'){check()}
 else if(a==='next'){next()}
 if(['begin','startchapter','restart','nextchapter'].includes(a))window.scrollTo({top:0,behavior:'smooth'});
}
app.addEventListener('click',action);
app.addEventListener('input',e=>{if(e.target?.id==='answer'){state.typed=e.target.value;save();}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='answer'){e.preventDefault();check()}});
app.addEventListener('change',e=>{if(e.target.matches('select[data-index]')){state.matches[e.target.dataset.index]=e.target.value;state.notice='';save()}});
window.BIRTHDAY_GAME_QA={chapters,total:TOTAL,normalize,answerOk,version:'3.0-visual-90'};
render();
})();
</script>
