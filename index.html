<script>
(function(){
'use strict';
const chapters=[{"name":"LANGKAH","subtitle":"Masa depan tidak meminta Ki berlari. Ia hanya meminta Ki bermula.","symbol":"👣","gift":"KASUT","intro":["Ki, ada perkara yang tidak dapat dijangka: selekoh jalan, cuaca pada hari esok, atau berapa kali kita perlu mencuba sebelum sesuatu menjadi mudah. Tetapi satu perkara sentiasa berada dalam pilihan kita: langkah seterusnya.","Bab pertama ini bukan tentang siapa paling cepat sampai. Ia tentang arah, keberanian untuk bermula, dan kesabaran untuk meneruskan perjalanan walaupun peta belum lengkap. Setiap jawapan yang Ki temui akan membuka sedikit lagi jalan ke hadapan.","Dalam bab ini, Ki akan menemui sepuluh babak dan tiga puluh cabaran. Ada teka-teki huruf, susunan masa, kod rahsia, ingatan, logik, dan perkara kecil yang memerlukan perhatian. Tiada jawapan yang meminta Ki meneka perasaan saya; setiap teka-teki mempunyai petunjuk yang boleh diperiksa.","Jika satu cabaran terasa sukar, Ki boleh membuka tiga petunjuk berperingkat. Petunjuk pertama memberi arah, yang kedua semakin jelas, dan yang ketiga memberitahu jawapan supaya perjalanan tidak terhenti."],"scenes":[["Pintu Pertama","Di ambang pagi, Ki menemukan peta tanpa penanda tamat. Kertasnya dilipat berkali-kali, seolah-olah seseorang pernah membukanya setiap kali dilanda ragu. Pada sudutnya tertulis: “Tidak mengapa jika Ki belum tahu semua jalan. Pilih sahaja satu arah yang baik.” Saya mahu bab ini bermula dengan sesuatu yang Ki boleh lakukan hari ini, bukannya sesuatu yang perlu disempurnakan esok. Setiap jawapan ialah langkah yang sedang Ki pilih sendiri."],["Batu Penanda","Di tepi jalan ada batu kecil dengan nombor yang semakin besar. Tidak ada sorakan, hanya bayang pokok yang bergerak bersama cahaya. Ki mungkin pernah melalui hari yang terasa biasa-biasa sahaja. Saya harap Ki tahu bahawa hari seperti itu juga penting. Kadangkala kemajuan ialah tidak berputus asa, bertanya soalan yang betul, dan mengambil rehat sebelum berjalan semula."],["Surat Dalam Poket","Seketul sampul tertinggal di celah peta. Di dalamnya bukan arahan yang keras, tetapi janji lembut: “Jangan ukur perjalanan dengan kepantasan orang lain.” Di hadapan Ki muncul lantai berjubin dengan huruf, nombor dan empat kenyataan. Tiada satu pun meminta Ki sempurna; semuanya sekadar meminta Ki melihat dengan teliti. Saya berharap ulang tahun ini memberi Ki kebebasan untuk mencuba tanpa takut jika jawapan pertama belum menjadi."],["Persimpangan","Laluan mula bercabang menjadi tiga. Ada lorong bercahaya tetapi menuju dinding, ada lorong yang tidak menarik tetapi menuju tempat dicari. Peta mengingatkan Ki bahawa sesuatu yang benar tidak semestinya paling nyaring atau paling cantik. Saya doakan Ki sentiasa dikelilingi pilihan yang memberi ruang untuk menjadi diri sendiri. Bila keliru, semaklah apa yang nyata, dan pilih berdasarkan tujuan yang Ki percaya."],["Stesen Keberanian","Dalam sebuah pondok persinggahan, Ki melihat rak bertanda “perasaan”, “pilihan” dan “tekad”. Pemilik pondok pernah menulis: “Orang yang cekal tidak perlu berpura-pura kuat sepanjang masa.” Di sinilah Ki diuji untuk memadankan apa yang terjadi dengan tindak balas yang sesuai. Saya berharap Ki tidak pernah merasakan bahawa meminta penjelasan atau berehat menjadikan sesuatu langkah kurang bermakna."],["Bukit Kecil","Angin di bukit terasa sedikit kuat. Jarak yang sama tiba-tiba memerlukan perhatian yang berbeza. Ki tidak wajib berlumba dengan sesiapa. Dalam cerita ini, berehat dan menyusun semula rancangan bukan kegagalan, kerana manusia bukan mesin. Ada hari yang sesuai untuk bergerak laju, dan ada hari yang sesuai untuk menghargai bahawa kita masih berada di jalan. Kedua-duanya tetap sebahagian daripada perjalanan."],["Bengkel Usaha","Ki tiba di bengkel yang tidak membaiki kasut, tetapi membaiki cara melihat masalah. Di dinding terdapat empat jadual, dua set peraturan dan kepingan huruf yang tidak tersusun. Satu perkataan tertulis pada lantai: USAHA. Saya berharap di luar permainan ini juga, Ki akan melihat kerja keras dan masa berehat sebagai dua perkara yang sama-sama bernilai. Tidak perlu membina seluruh masa depan dalam sehari."],["Jambatan Esok","Terdapat jambatan panjang dengan lampu kecil di sepanjang sisinya. Di hujung sana, tidak ada manusia yang boleh menjamin apa yang bakal terjadi. Namun Ki boleh belajar mengenali arah, menilai semula rancangan, dan menjaga tenaga yang ada. Saya berharap perjalanan baharu dalam hidup Ki kelak membawa ketenangan, keberanian, dan orang-orang yang menghargai usaha Ki tanpa syarat yang tidak adil."],["Cahaya Penunjuk","Sebelum kotak terakhir, Ki perlu membaca cahaya, mengingati urutan dan membuka satu kunci kecil. Ada simbol yang muncul semula, seperti kenangan baik yang kembali pada waktu kita tidak sangka. Bayangkan suatu hari Ki menoleh ke belakang dan mendapati banyak kejayaan kecil telah terkumpul. Semoga Ki memberi diri sendiri peluang untuk melihat semuanya. Bukan kerana seluruh jalan itu mudah, tetapi kerana Ki telah mencubanya."],["Kotak Pertama","Akhirnya Ki menemui kotak di bawah pokok yang tenang. Papan di atasnya berbunyi: “Untuk semua tempat yang belum diterokai, dan semua langkah yang sudah diambil.” Saya harap Ki akan mempunyai banyak destinasi indah, sama ada jauh ataupun dekat. Ke mana pun perjalanan membawa Ki, semoga kesihatan, keselamatan dan harapan baik menemani setiap gerak."]],"bridge":"Ki telah menyusun sebuah perjalanan: niat, pilihan, usaha, dan harapan. Hadiah pertama bukan jaminan bahawa setiap jalan akan mudah. Ia cuma teman untuk setiap langkah yang Ki pilih dengan berani.","tasks":[{"kind":"order","title":"Peta Yang Berkecai","question":"Tekan empat cebisan peta dalam susunan logik, daripada memulakan perjalanan hingga tiba di destinasi.","answer":["Tetapkan tujuan","Ambil langkah pertama","Belajar daripada halangan","Raikan kemajuan"],"hints":["Mulakan dengan sesuatu yang menentukan arah sebelum bergerak.","Tujuan dahulu, kemudian tindakan. Halangan mengajar sebelum hasil diraikan.","Jawapan tepat: Tetapkan tujuan → Ambil langkah pertama → Belajar daripada halangan → Raikan kemajuan."],"explain":"Kemajuan yang bermakna berlaku secara berperingkat.","choices":["Raikan kemajuan","Belajar daripada halangan","Tetapkan tujuan","Ambil langkah pertama"]},{"kind":"input","title":"Kata Pada Pintu","question":"Susun huruf H – A – L – G – K – A – N menjadi satu perkataan Melayu yang bermaksud gerakan kecil untuk maju.","answer":"LANGKAH","hints":["Perkataan ini berkaitan dengan kaki dan perjalanan.","Huruf pertamanya L, huruf terakhir H. Ia mempunyai tujuh huruf.","Jawapan tepat: LANGKAH."],"explain":"Langkah yang kecil tetap membawa perubahan."},{"kind":"match","title":"Empat Kawan di Jejak","question":"Empat pengembara mempunyai keperluan berlainan. Padankan cabaran dengan bantuan yang paling sesuai.","answer":["Tidak tahu laluan","Kehabisan air","Tali kasut longgar","Perlu mengira jarak"],"hints":["Setiap cabaran memerlukan alat atau tindakan yang khusus.","Tidak tahu laluan → peta; tiada air → isi botol; tali kasut → ikat semula; jarak → tanda kilometer.","Jawapan tepat: Tidak tahu laluan → Buka peta laluan; Kehabisan air → Isi semula botol minuman; Tali kasut longgar → Ikat semula dengan kemas; Perlu mengira jarak → Semak tanda kilometer."],"explain":"Perjalanan menjadi lebih mudah apabila masalah sebenar dikenal pasti.","choices":["Semak tanda kilometer","Isi semula botol minuman","Buka peta laluan","Ikat semula dengan kemas"],"accept":["Buka peta laluan","Isi semula botol minuman","Ikat semula dengan kemas","Semak tanda kilometer"]},{"kind":"choice","title":"Kompas Tanpa Jarum","question":"Kompas Ki tidak menunjukkan utara. Ia hanya menunjukkan apa yang Ki mahu capai. Apakah yang paling sesuai dijadikan panduan memilih jalan?","answer":"Tujuan yang jelas dan nilai yang penting","hints":["Fikirkan panduan yang tetap berguna apabila jalan sukar.","Pilih perkara yang menentukan arah, bukan pujian atau jalan pintas.","Jawapan tepat: Tujuan yang jelas dan nilai yang penting."],"explain":"Arah yang bermakna datang daripada tujuan, bukannya tekanan sekeliling.","choices":["Jalan yang paling ramai pilih","Tujuan yang jelas dan nilai yang penting","Jalan yang tidak pernah mencabar","Tempat yang paling dekat"]},{"kind":"multi","title":"Bekal Untuk Perjalanan","question":"Pilih TEPAT TIGA perkara yang membantu perjalanan jangka panjang.","answer":["Rehat apabila perlu","Belajar daripada kesilapan","Usaha secara konsisten"],"hints":["Fikirkan pilihan yang mengekalkan semangat serta tenaga.","Pilih rehat, pembelajaran dan konsistensi. Elakkan dua pilihan yang melambatkan kemajuan.","Jawapan tepat: Rehat apabila perlu, Belajar daripada kesilapan, Usaha secara konsisten."],"explain":"Ketekunan memerlukan usaha, pembelajaran dan rehat.","choices":["Bandingkan diri setiap masa","Rehat apabila perlu","Belajar daripada kesilapan","Menunggu semuanya sempurna","Usaha secara konsisten"]},{"kind":"pattern","title":"Batu Penanda Bernombor","question":"Batu pertama bertanda 2, kemudian 5, 8, 11. Setiap batu meningkat dengan jumlah yang sama. Apakah nombor pada batu kelima?","answer":"14","hints":["Cari beza antara dua nombor yang bersebelahan.","Setiap batu meningkat sebanyak 3: 11 + 3 = ?","Jawapan tepat: 14."],"explain":"Perubahan kecil yang konsisten mencipta pola kemajuan."},{"kind":"truth","title":"Empat Peraturan Peta","question":"Baca empat ayat berdasarkan PERATURAN: Setiap laluan harus ada arah; rehat dibenarkan; laluan yang tertutup tidak boleh dipilih; perjalanan tidak perlu sempurna. Tandakan Benar atau Salah mengikut peraturan yang diberi.","answer":["Benar","Salah","Benar","Salah"],"hints":["Bandingkan setiap ayat dengan empat peraturan yang dicetak di atas.","Ayat pertama dan ketiga sejajar dengan peraturan. Ayat kedua dan keempat bercanggah.","Jawapan: Benar, Salah, Benar, Salah."],"explain":"Sebuah arah tidak hilang hanya kerana Ki berhenti berehat.","statements":["Setiap laluan yang dipilih memerlukan arah.","Ki dilarang berhenti untuk berehat.","Laluan tertutup tidak patut dipilih.","Perjalanan mestilah sempurna sejak hari pertama."]},{"kind":"tiles","title":"Huruf Keberanian","question":"Susun SEMUA kepingan huruf menjadi perkataan enam huruf yang bermaksud tidak takut untuk mencuba walaupun belum pasti berjaya.","answer":"BERANI","hints":["Sifat ini diperlukan ketika membuka langkah pertama.","Perkataan enam huruf ini bermula B, diikuti E, dan berakhir I.","Susun huruf: B – E – R – A – N – I (BERANI)."],"explain":"Berani bukan bermaksud tiada rasa bimbang; berani bermaksud tetap memilih untuk mencuba.","letters":["N","I","E","B","A","R"]},{"kind":"keypad","title":"Kod Kilometer","question":"Di peta tertulis: 4 km dari rumah ke taman, 3 km dari taman ke sungai dan 5 km dari sungai ke mercu tanda. Kod kunci ialah jumlah jarak pergi, ditulis dalam TIGA digit dengan sifar di depan jika perlu.","answer":"012","hints":["Tambah ketiga-tiga jarak, jangan kira perjalanan pulang.","4 + 3 + 5 = 12. Kod mesti mempunyai 3 digit.","Kod: 012."],"explain":"Perjalanan besar terhasil daripada jumlah bahagian yang kecil."},{"kind":"pattern","title":"Tangga Kemajuan","question":"Bilangan anak tangga yang dilalui setiap fasa ialah 3, 6, 12, 24. Jika pola berganda berterusan, berapa bilangan bagi fasa seterusnya?","answer":"48","hints":["Perhatikan setiap nombor merupakan gandaan nombor sebelumnya.","24 × 2 = 48.","Jawapan tepat: 48."],"explain":"Maju berperingkat memerlukan kesabaran walaupun hasil berkembang."},{"kind":"match","title":"Empat Tanda Jalan","question":"Padankan setiap tanda dengan tindakan yang paling sesuai.","answer":["Laluan licin","Peta kabur","Kaki penat","Arah salah"],"hints":["Fikirkan tindak balas yang sesuai bagi setiap keadaan khusus.","Laluan licin perlukan langkah hati-hati; peta kabur semak arah; kaki penat perlu rehat; arah salah perlu ubah laluan.","Jawapan tepat: Laluan licin → Perlahankan langkah; Peta kabur → Semak arah semula; Kaki penat → Berehat seketika; Arah salah → Ubah laluan."],"explain":"Bijak berjalan bermaksud menyesuaikan tindakan dengan keadaan.","choices":["Semak arah semula","Berehat seketika","Perlahankan langkah","Ubah laluan"],"accept":["Perlahankan langkah","Semak arah semula","Berehat seketika","Ubah laluan"]},{"kind":"choice","title":"Persimpangan Senja","question":"Laluan A nampak singkat tetapi membawa Ki menjauhi matlamat. Laluan B sedikit panjang tetapi menuju matlamat. Laluan manakah lebih tepat?","answer":"Laluan B","hints":["Jangan gunakan jarak sebagai satu-satunya ukuran.","Laluan yang membawa ke matlamat lebih penting daripada laluan paling pendek.","Jawapan tepat: Laluan B."],"explain":"Bukan semua jalan pintas membawa kita ke tempat yang diinginkan.","choices":["Laluan A","Laluan B","Kedua-duanya sama","Berhenti tanpa memilih"]},{"kind":"match","title":"Peta Emosi","question":"Padankan setiap keadaan dengan tindakan yang dinyatakan paling sesuai.","answer":["Hilang arah","Terlalu penat","Jalan licin","Sudah sampai"],"hints":["Keadaan memerlukan tindak balas yang khusus dan selamat.","Hilang arah → semak peta; penat → rehat; jalan licin → perlahan; sudah sampai → hargai kemajuan.","Padanan: Hilang arah—Semak peta; Terlalu penat—Berehat; Jalan licin—Perlahankan langkah; Sudah sampai—Raikan kemajuan."],"explain":"Mengenal keperluan diri sendiri ialah sebahagian daripada kebijaksanaan.","choices":["Raikan kemajuan","Perlahankan langkah","Berehat","Semak peta"],"accept":["Semak peta","Berehat","Perlahankan langkah","Raikan kemajuan"]},{"kind":"choice","title":"Tiga Lorong, Satu Tujuan","question":"Pintu A membawa ke tangga tetapi tangga ditutup. Pintu B menuju terus ke perpustakaan yang Ki cari. Pintu C kembali ke titik mula. Pintu mana patut dipilih untuk tiba di perpustakaan?","answer":"Pintu B","hints":["Baca DESTINASI setiap pintu, bukan rupanya.","Pintu A tertutup, C kembali ke awal, hanya B menuju tempat yang dicari.","Jawapan tepat: Pintu B."],"explain":"Keputusan menjadi lebih jelas apabila Ki berani membaca kenyataan, bukan andaian.","choices":["Pintu C","Pintu A","Pintu B"]},{"kind":"input","title":"Surat Dalam Nombor","question":"Sebuah nota menggunakan A=1, B=2, …, Z=26. Tukar 20 – 5 – 11 – 1 – 4 menjadi satu perkataan Melayu lima huruf yang bermaksud kemahuan yang kuat.","answer":"TEKAD","hints":["Tukarkan setiap nombor kepada huruf abjad Inggeris.","20=T, 5=E, 11=K, 1=A, 4=D.","Jawapan tepat: TEKAD."],"explain":"Tekad mengikat harapan dengan tindakan yang nyata."},{"kind":"order","title":"Jambatan Empat Papan","question":"Empat papan jambatan tertulis langkah penyelesaian masalah. Susun supaya tindakan dibuat selepas memahami masalah.","answer":["Kenal pasti masalah","Cari beberapa pilihan","Pilih tindakan sesuai","Nilai hasilnya"],"hints":["Jangan terus menilai hasil sebelum berbuat sesuatu.","Kenal pasti dahulu, cari pilihan, kemudian bertindak dan menilai.","Jawapan tepat: Kenal pasti masalah → Cari beberapa pilihan → Pilih tindakan sesuai → Nilai hasilnya."],"explain":"Keputusan yang baik lahir daripada pemahaman dan semakan.","choices":["Nilai hasilnya","Cari beberapa pilihan","Kenal pasti masalah","Pilih tindakan sesuai"]},{"kind":"order","title":"Rancangan Lima Langkah","question":"Susun LIMA tindakan supaya Ki menamatkan perjalanan yang belum pernah dicuba secara lebih teratur.","answer":["Tentukan destinasi","Semak keadaan dan laluan","Sediakan keperluan penting","Mulakan perjalanan","Semak semula kemajuan"],"hints":["Tidak munasabah untuk memulakan perjalanan sebelum mengetahui destinasi.","Destinasi → semak laluan → sediakan barang → bermula → nilai kemajuan.","Jawapan tepat: Tentukan destinasi → Semak keadaan dan laluan → Sediakan keperluan penting → Mulakan perjalanan → Semak semula kemajuan."],"explain":"Persediaan membantu Ki bergerak dengan lebih yakin.","choices":["Semak semula kemajuan","Mulakan perjalanan","Tentukan destinasi","Sediakan keperluan penting","Semak keadaan dan laluan"]},{"kind":"input","title":"Jejak Tanpa Suara","question":"Saya muncul di belakang orang yang berjalan di pasir. Saya membuktikan dia pernah melalui tempat itu. Apakah saya?","answer":"JEJAK","hints":["Jawapan ini ialah kesan yang tertinggal selepas melangkah.","Lima huruf, bermula J, berakhir K.","Jawapan tepat: JEJAK."],"explain":"Tidak semua kemajuan kedengaran; ada yang sekadar meninggalkan jejak."},{"kind":"order","title":"Empat Hari Di Laluan","question":"Susun catatan Ki dari hari pertama hingga hari keempat mengikut petunjuk ini: Ki berehat SELEPAS merancang; Ki cuba berjalan SELEPAS berehat; Ki menilai hasil SELEPAS mencuba.","answer":["Merancang perjalanan","Berehat secukupnya","Mencuba langkah pertama","Menilai hasil"],"hints":["Ikut setiap perkataan SELEPAS dalam soalan.","Rancang dahulu, kemudian rehat; setelah itu cuba; terakhir nilai.","Urutan: Merancang perjalanan → Berehat secukupnya → Mencuba langkah pertama → Menilai hasil."],"explain":"Kemajuan tidak menolak rehat; kedua-duanya boleh wujud bersama.","choices":["Menilai hasil","Berehat secukupnya","Merancang perjalanan","Mencuba langkah pertama"]},{"kind":"truth","title":"Tanda Benar Di Persimpangan","question":"Sebuah papan memberitahu: Jambatan merah rosak; jambatan biru terbuka; peta masih di dalam beg; destinasi berada di seberang sungai. Pilih Benar atau Salah berdasarkan maklumat itu.","answer":["Salah","Benar","Benar","Salah"],"hints":["Jangan mengagak. Padankan ayat dengan fakta pada papan.","Merah bukan selamat, biru terbuka, peta memang dalam beg, dan destinasi bukan di tebing ini.","Jawapan: Salah, Benar, Benar, Salah."],"explain":"Tidak semua suara yakin adalah benar. Semak fakta sebelum melangkah.","statements":["Jambatan merah boleh digunakan dengan selamat.","Jambatan biru masih boleh dilalui.","Peta Ki ada di dalam beg.","Destinasi terletak di tebing tempat Ki berdiri."]},{"kind":"tiles","title":"Bina Sebuah Usaha","question":"Cari perkataan lima huruf yang bermaksud ikhtiar bersungguh-sungguh, dengan menyusun SEMUA kepingan huruf.","answer":"USAHA","hints":["Apakah yang dilakukan selepas menetapkan tujuan?","Bermula U, diikuti S; huruf A muncul dua kali.","Susunan tepat: U – S – A – H – A (USAHA)."],"explain":"Niat menunjukkan arah; usaha menggerakkan kaki.","letters":["A","H","S","A","U"]},{"kind":"memory","title":"Warna Pada Laluan","question":"Hafal urutan lampu di sepanjang laluan. Apabila bersedia, tekan “Sembunyikan”, kemudian ulang dengan menekan simbol mengikut urutan.","answer":["🌿","☀️","🌙","🌿","⭐","☀️"],"hints":["Ingat simbol yang muncul semula; dua simbol diulang.","Urutan mula dengan 🌿 → ☀️ → 🌙, kemudian 🌿.","Jawapan tepat: 🌿 → ☀️ → 🌙 → 🌿 → ⭐ → ☀️."],"explain":"Memberi perhatian pada satu langkah pada satu masa membantu kita tidak hilang arah.","choices":["🌿","☀️","🌙","⭐"]},{"kind":"multi","title":"Isi Beg Pengembara","question":"Ki hanya boleh membawa TIGA benda untuk perjalanan berjalan kaki yang panjang pada waktu siang. Pilih tiga benda yang paling relevan daripada senarai.","answer":["Air minuman","Peta laluan","Kasut yang sesuai"],"hints":["Fikirkan keperluan bergerak, arah dan hidrasi.","Pilih air, peta, dan alas kaki yang sesuai; elakkan barang hiasan.","Jawapan tepat: Air minuman, Peta laluan, Kasut yang sesuai."],"explain":"Persediaan ringkas yang betul membantu perjalanan terasa lebih selesa.","choices":["Air minuman","Bingkai gambar besar","Peta laluan","Kasut yang sesuai","Patung kaca yang berat"]},{"kind":"memory","title":"Jejak Lapan Simbol","question":"Ingat lapan simbol yang dilihat pada batu penanda. Sembunyikan semuanya sebelum Ki memasukkan semula urutan.","answer":["🌄","🌲","🌉","⭐","🌲","🌄","🌉","⭐"],"hints":["Empat simbol yang berbeza muncul dua kali.","Empat pertama ialah 🌄 🌲 🌉 ⭐; empat terakhir ialah 🌲 🌄 🌉 ⭐.","Jawapan tepat: 🌄 → 🌲 → 🌉 → ⭐ → 🌲 → 🌄 → 🌉 → ⭐."],"explain":"Perhatian pada setiap bahagian membantu Ki melihat gambaran besar.","choices":["🌄","🌲","🌉","⭐"]},{"kind":"memory","title":"Lampu Di Atas Jambatan","question":"Ingat susunan tujuh tanda cahaya. Sembunyikan, kemudian ulang semula mengikut urutan.","answer":["🔹","🔸","🌙","⭐","🔹","🌙","🔸"],"hints":["Perhatikan dua warna berlainan di permulaan.","Tiga tanda awal: 🔹 → 🔸 → 🌙; tanda keempat ialah ⭐.","Jawapan: 🔹 → 🔸 → 🌙 → ⭐ → 🔹 → 🌙 → 🔸."],"explain":"Perhatian kepada perincian membantu kita terus ke arah yang dipilih.","choices":["⭐","🔸","🔹","🌙"]},{"kind":"keypad","title":"Kunci Tiang Penanda","question":"Tiang menunjukkan siri 3, 6, 12, 24. Setiap nombor DIGANDAKAN. Kunci menggunakan nombor selepas 24 dalam TIGA digit.","answer":"048","hints":["Lihat hubungan 3 kepada 6 dan 6 kepada 12.","Setiap nilai darab dua: 24 × 2 = 48. Letak sifar di depan.","Kod tepat: 048."],"explain":"Sesuatu pola boleh difahami apabila Ki melihat hubungannya, bukan hanya hasilnya."},{"kind":"choice","title":"Bintang Di Hujung Jalan","question":"Ada tiga papan: (A) Kejayaan hanya apabila tidak pernah tersilap. (B) Kemajuan ialah belajar dan meneruskan usaha. (C) Jalan panjang sentiasa gagal. Papan mana yang paling sepadan dengan perjalanan Ki sepanjang bab ini?","answer":"B","hints":["Pilih ayat yang mengiktiraf usaha dan pembelajaran.","A menolak pembelajaran; C mengelirukan jarak dengan gagal.","Jawapan: B."],"explain":"Perjalanan yang baik boleh ada ralat, rehat, dan sambungan yang baru.","choices":["C","B","A"]},{"kind":"input","title":"Kod Kompas","question":"Gunakan kod A=1, B=2, ... Z=26. Nombor 1 – 18 – 1 – 8 membentuk perkataan Melayu apakah?","answer":"ARAH","hints":["Nombor 1 mewakili huruf A.","18=R dan 8=H; bacaan lengkap ialah A–R–A–H.","Jawapan tepat: ARAH."],"explain":"Kita mungkin tidak tahu semua perkara, tetapi masih boleh memilih arah."},{"kind":"match","title":"Musim Perjalanan","question":"Padankan keadaan dengan sikap yang sesuai.","answer":["Apabila tersilap","Apabila berjaya","Apabila keliru","Apabila letih"],"hints":["Pilih tindak balas yang paling membina, bukan yang paling cepat.","Tersilap = belajar; berjaya = bersyukur; keliru = bertanya; letih = berehat.","Jawapan tepat: Apabila tersilap → Belajar dan mencuba semula; Apabila berjaya → Menghargai usaha; Apabila keliru → Bertanya dan mencari penjelasan; Apabila letih → Mengambil rehat."],"explain":"Setiap fasa memerlukan cara menjaga diri yang berbeza.","choices":["Bertanya dan mencari penjelasan","Mengambil rehat","Belajar dan mencuba semula","Menghargai usaha"],"accept":["Belajar dan mencuba semula","Menghargai usaha","Bertanya dan mencari penjelasan","Mengambil rehat"]},{"kind":"pattern","title":"Langkah Mengelilingi Tasik","question":"Setiap pusingan Ki berjalan 400 meter. Jika Ki menamatkan 3 pusingan penuh, berapa meter Ki sudah berjalan? Taip nombor sahaja.","answer":"1200","hints":["Darab bilangan pusingan dengan jarak setiap pusingan.","3 × 400 = 1200.","Jawapan tepat: 1200."],"explain":"Perjalanan jauh sering merupakan himpunan langkah yang kecil."}],"wish":"Selamat hari lahir, Ki. Semoga usia baharu ini membuka banyak peluang baik untuk Ki melangkah: kesihatan yang terjaga, keselamatan ke mana pun pergi, dan keberanian untuk mencapai perkara yang Ki impikan. Kalau satu hari terasa berat, saya harap Ki tetap yakin bahawa berehat tidak menghilangkan semua usaha yang sudah dibuat. Semoga kaki Ki sentiasa dibawa ke tempat yang baik dan hati Ki tidak kekurangan harapan."},{"name":"MELODI","subtitle":"Di tengah dunia yang bising, masih ada ruang untuk mendengar dengan tenang.","symbol":"🎧","gift":"EARPHONE","intro":["Selepas berjalan jauh, Ki tiba di sebuah kota yang dipenuhi bunyi. Ada suara yang mendesak, bunyi jam yang mengejar, dan fikiran yang tidak berhenti bertanya. Semua kedengaran serentak sehingga sesuatu yang indah pun sukar dikenal pasti.","Dalam bab ini, Ki tidak perlu memadamkan seluruh kebisingan. Ki hanya perlu mengenal rentak, memilih bunyi yang membantu, dan menemui sedikit ruang untuk mendengar diri sendiri. Ketenangan bukan semestinya kesunyian; kadangkala ia ialah melodi yang akhirnya kita fahami.","Dalam bab ini, Ki akan menemui sepuluh babak dan tiga puluh cabaran. Ada teka-teki huruf, susunan masa, kod rahsia, ingatan, logik, dan perkara kecil yang memerlukan perhatian. Tiada jawapan yang meminta Ki meneka perasaan saya; setiap teka-teki mempunyai petunjuk yang boleh diperiksa.","Jika satu cabaran terasa sukar, Ki boleh membuka tiga petunjuk berperingkat. Petunjuk pertama memberi arah, yang kedua semakin jelas, dan yang ketiga memberitahu jawapan supaya perjalanan tidak terhenti."],"scenes":[["Lampu Pentas","Sebuah pintu terbuka kepada studio dengan lampu berwarna-warni dan meja penuh alat muzik. Bunyi datang dari setiap penjuru: ada yang lembut, ada yang terlampau kuat. Ki tidak diminta menjadi pemuzik hebat. Ki hanya diminta memilih apa yang mahu diberi perhatian. Saya berharap dalam hari-hari sibuk, Ki tetap punya ruang untuk mendengar perkara yang membuat hati terasa ringan."],["Ketukan Pertama","Di atas lantai ada deretan angka dan bunyi ketukan yang berulang. Jika Ki mendengar dengan sabar, di sebalik semua itu ada aturan yang boleh dikenal pasti. Begitu juga dengan kehidupan: kadang-kadang bunyi paling jelas bukan yang paling penting. Saya doakan Ki memiliki masa untuk mendengar diri sendiri tanpa tekanan untuk sentiasa menjawab semua perkara dengan segera."],["Bilik Dengan Empat Suis","Di bilik seterusnya, empat suis mengawal bunyi: mula, jeda, kuat dan senyap. Ada kerusi di tepi tingkap, tempat seseorang boleh duduk tanpa gangguan. Di atas pintunya tertulis: “Ki tidak perlu menerima setiap bunyi yang datang.” Puzzles dalam bilik ini tentang memilih, memahami dan mengira rentak. Saya berharap Ki selalu ingat bahawa berehat daripada kebisingan juga sebuah pilihan yang wajar."],["Studio Senyap","Bilik rakaman itu dipenuhi perkataan yang berbeza makna: tempo, jeda, lirik, dan melodi. Ki menyedari bahawa muzik tidak dibina dengan satu bunyi sahaja. Ada suara yang menyampaikan mesej, ada alat yang memperkuat, dan ada kesunyian yang memberi struktur. Saya berharap hidup Ki juga dipenuhi keseimbangan antara bekerja, mendengar, bercakap dan berehat."],["Frekuensi Yang Hilang","Sebuah radio lama menyembunyikan kod dalam nombor-nombor. Pada kertas sebelahnya tertulis “hening”. Apakah hening itu? Mungkin ia sekadar waktu singkat apabila seluruh perhatian kembali kepada satu perkara. Dalam bab ini, saya tidak mengharapkan Ki melarikan diri daripada dunia. Saya hanya mahu Ki mempunyai satu ruang yang Ki boleh pilih sendiri ketika dunia terlalu riuh."],["Lagu Yang Tidak Selesai","Sebuah melodi berhenti pada tengah bar. Ki boleh memilih untuk memulakannya semula, membaiki nota, atau mendengar sesuatu yang lain. Tidak semua perkara perlu dipaksa menjadi sempurna untuk dinikmati. Semoga Ki sentiasa menemui kegembiraan dalam usaha belajar sesuatu yang baru; bukan kerana hasilnya selalu betul, tetapi kerana pengalaman itu membuka ruang yang tidak diketahui sebelumnya."],["Perbualan Tanpa Gangguan","Di sebuah bilik terdapat dua kerusi, sebuah lampu, dan satu peraturan: “Dengar dahulu sebelum membalas.” Empat ayat pada manuskrip cuba menguji sama ada Ki membaca kenyataan seperti yang ditulis. Saya berharap Ki sentiasa didengari dengan perhatian yang ikhlas, dan Ki juga mendapat masa untuk menjelaskan perkara yang penting tanpa terburu-buru."],["Ruang Untuk Diri","Di luar studio, hujan turun perlahan dan orang ramai berlalu di kaki lima. Ki memasang lagu yang dirasakan sesuai. Bukan untuk menutup semua suara, tetapi untuk mencipta suasana kecil yang nyaman. Saya doakan ada banyak malam yang terasa aman, ada banyak pagi yang membawa tenaga baru, dan ada lagu yang mengingatkan Ki bahawa dunia masih menyimpan perkara baik."],["Radio Kenangan","Sebuah pita dari masa lampau mengeluarkan bunyi lembut. Tidak ada gambar, tetapi setiap nada seolah-olah menyimpan warna dan suasana. Ki perlu mengingat urutan, membuka kod, dan membaca pita yang terbalik. Saya berharap hari lahir ini juga menjadi satu kenangan yang baik: bukan kerana permainan ini sempurna, tetapi kerana ia dibuat dengan niat mahu memberi Ki sesuatu yang berbeza."],["Kotak Kedua","Di hujung studio ada kotak kecil dengan tanda gelombang bunyi. Pada labelnya tertulis: “Untuk muzik yang mengiringi hari biasa dan hari luar biasa.” Saya berharap Ki boleh memilih lagu yang menaikkan semangat, bunyi hujan yang menenangkan atau beberapa minit hening apabila itu yang Ki perlukan. Tidak semua melodi perlu didengar oleh orang lain untuk menjadi bermakna."]],"bridge":"Ki sudah membezakan bunyi daripada makna. Hadiah kedua bukan untuk melarikan diri daripada dunia, tetapi untuk memberi Ki pilihan—bila hendak mendengar dunia, dan bila hendak menikmati melodi sendiri.","tasks":[{"kind":"memory","title":"Lampu Pentas Pertama","question":"Hafal corak not muzik sebelum menyembunyikannya dan mengulanginya.","answer":["♪","♫","♬","♪","♩","♫"],"hints":["Tiga simbol pertama ialah ♪, ♫, ♬.","Selepas ♪ ♫ ♬, urutannya ialah ♪ ♩ ♫.","Jawapan tepat: ♪ → ♫ → ♬ → ♪ → ♩ → ♫."],"explain":"Mendengar bermula dengan memberi perhatian.","choices":["♪","♫","♬","♩"]},{"kind":"choice","title":"Suara Dalam Keramaian","question":"Seorang kawan sedang menerangkan masalah, tetapi Ki belum memahami maksudnya. Apakah langkah terbaik?","answer":"Dengar hingga selesai dan tanya dengan baik","hints":["Cari cara memahami sebelum memberi respons.","Jangan mencelah atau meneka sebelum orang itu selesai.","Jawapan tepat: Dengar hingga selesai dan tanya dengan baik."],"explain":"Mendengar dengan teliti ialah bentuk penghargaan.","choices":["Mencelah setiap ayat","Dengar hingga selesai dan tanya dengan baik","Tukar topik tanpa sebab","Terus membuat andaian"]},{"kind":"match","title":"Empat Suasana Muzik","question":"Padankan keperluan dengan jenis bunyi yang paling serasi.","answer":["Mahu bersemangat untuk bersenam","Mahu fokus membaca","Mahu tidur dengan selesa","Mahu menari dengan rakan"],"hints":["Pertimbangkan tempo dan jumlah gangguan.","Bersenam → rentak bertenaga; membaca → instrumental lembut; tidur → bunyi alam perlahan; menari → irama rancak.","Jawapan tepat: Mahu bersemangat untuk bersenam → Rentak bertenaga; Mahu fokus membaca → Instrumental lembut tanpa lirik; Mahu tidur dengan selesa → Bunyi alam dengan kelantangan rendah; Mahu menari dengan rakan → Irama rancak untuk menari."],"explain":"Muzik berbeza boleh menemani suasana yang berbeza.","choices":["Irama rancak untuk menari","Bunyi alam dengan kelantangan rendah","Instrumental lembut tanpa lirik","Rentak bertenaga"],"accept":["Rentak bertenaga","Instrumental lembut tanpa lirik","Bunyi alam dengan kelantangan rendah","Irama rancak untuk menari"]},{"kind":"input","title":"Anagram Irama","question":"Susun huruf A – M – A – R – I supaya menjadi perkataan berkaitan rentak muzik.","answer":"IRAMA","hints":["Perkataan ini bermaksud rentak atau alunan.","Lima huruf. Bermula I dan berakhir A.","Jawapan tepat: IRAMA."],"explain":"Irama membantu bunyi yang berbeza terasa tersusun."},{"kind":"pattern","title":"Rentak Ketukan","question":"Satu corak ketukan ialah 2, 4, 6, 8, __. Apakah nombor selepas 8?","answer":"10","hints":["Kenal pasti beza tetap setiap nombor.","Tambah 2 setiap langkah.","Jawapan tepat: 10."],"explain":"Corak mudah pun boleh menghasilkan rentak yang jelas."},{"kind":"match","title":"Peralatan Studio","question":"Padankan alat dengan kegunaan utamanya.","answer":["Mikrofon","Pembesar suara","Gendang","Earphone"],"hints":["Fikirkan cara setiap alat berinteraksi dengan bunyi.","Mikrofon merakam suara, pembesar suara mengeluarkan bunyi, gendang menghasilkan rentak, earphone mendengar secara peribadi.","Jawapan tepat: Mikrofon → Menangkap suara; Pembesar suara → Mengeluarkan bunyi ke ruang; Gendang → Menghasilkan rentak; Earphone → Dengar audio secara peribadi."],"explain":"Setiap alat ada peranannya dalam menghasilkan pengalaman mendengar.","choices":["Dengar audio secara peribadi","Menghasilkan rentak","Mengeluarkan bunyi ke ruang","Menangkap suara"],"accept":["Menangkap suara","Mengeluarkan bunyi ke ruang","Menghasilkan rentak","Dengar audio secara peribadi"]},{"kind":"truth","title":"Peraturan Bilik Bunyi","question":"Di pintu studio tertulis: lampu hijau bermaksud boleh masuk; lampu merah bermaksud jangan masuk; bunyi terlalu kuat perlu dikecilkan; jeda boleh membantu fokus. Tandakan Benar/Salah.","answer":["Benar","Salah","Benar","Benar"],"hints":["Teks pintu memberi empat arahan jelas.","Hijau boleh masuk; merah tidak boleh; bunyi kuat dikecilkan; jeda dibenarkan.","Jawapan: Benar, Salah, Benar, Benar."],"explain":"Kadang-kadang harmoni bermula apabila kita mendengar isyarat dengan betul.","statements":["Lampu hijau membenarkan Ki masuk.","Lampu merah juga membenarkan Ki masuk.","Bunyi yang terlalu kuat patut dikecilkan.","Jeda boleh membantu Ki memberi tumpuan."]},{"kind":"tiles","title":"Kepingan Dengar","question":"Susun SEMUA enam huruf menjadi kata kerja tentang memberi perhatian pada bunyi dan kata-kata.","answer":"DENGAR","hints":["Bab ini bukan tentang menutup seluruh dunia, tetapi memilih apa yang didengar.","Kata kerja bermula D dan berakhir R.","Jawapan: D – E – N – G – A – R (DENGAR)."],"explain":"Mendengar adalah tindakan aktif, bukan sekadar membiarkan bunyi lalu.","letters":["R","N","D","A","G","E"]},{"kind":"keypad","title":"Tempo Pintu Studio","question":"Empat ketukan dalam satu bar. Tiga bar dimainkan. Kod kunci ialah JUMLAH ketukan, dalam TIGA digit.","answer":"012","hints":["Jumlah = ketukan setiap bar × bilangan bar.","4 ketukan × 3 bar = 12 ketukan. Tambah sifar hingga tiga digit.","Kod: 012."],"explain":"Muzik menyatukan unit kecil menjadi sesuatu yang lebih besar."},{"kind":"pattern","title":"Rentak Yang Bertambah","question":"Ketukan muncul pada masa 1, 2, 4, 7, 11. Jarak antara masa meningkat 1, 2, 3, 4. Pada masa berapakah ketukan seterusnya?","answer":"16","hints":["Cari beza antara nombor berturutan, bukan nombornya sahaja.","Selepas beza 4, tambah beza 5 kepada 11.","Jawapan tepat: 16."],"explain":"Irama yang rumit boleh difahami dengan memecahkannya kepada corak kecil."},{"kind":"multi","title":"Pisahkan Bunyi Daripada Makna","question":"Pilih TEPAT TIGA tindakan yang membantu seseorang mendengar dengan lebih jelas.","answer":["Kurangkan gangguan","Tumpukan perhatian","Minta penjelasan bila keliru"],"hints":["Cari tindakan yang mengurangkan gangguan dan meningkatkan kefahaman.","Kurangkan gangguan, fokus dan bertanya jika tidak jelas.","Jawapan tepat: Kurangkan gangguan, Tumpukan perhatian, Minta penjelasan bila keliru."],"explain":"Mendengar bukan sekadar menerima bunyi; ia tentang memahami.","choices":["Kurangkan gangguan","Buka lebih banyak bunyi serentak","Tumpukan perhatian","Minta penjelasan bila keliru","Buat andaian tanpa mendengar"]},{"kind":"order","title":"Resipi Melodi","question":"Susun proses mudah ini untuk mencipta melodi: pilih not, atur rentak, dengar hasil, baiki bahagian yang sumbang.","answer":["Pilih beberapa not","Atur not menjadi rentak","Dengar hasilnya","Baiki bunyi yang kurang sesuai"],"hints":["Bina sesuatu sebelum menilainya.","Pilih not → atur → dengar → baiki.","Jawapan tepat: Pilih beberapa not → Atur not menjadi rentak → Dengar hasilnya → Baiki bunyi yang kurang sesuai."],"explain":"Sesuatu yang indah sering lahir daripada proses mencuba dan membaiki.","choices":["Baiki bunyi yang kurang sesuai","Dengar hasilnya","Atur not menjadi rentak","Pilih beberapa not"]},{"kind":"match","title":"Empat Suis Studio","question":"Padankan butang dengan fungsinya berdasarkan label pada meja studio.","answer":["PLAY","PAUSE","VOLUME +","MUTE"],"hints":["Setiap istilah ini digunakan pada alat audio.","PLAY mula, PAUSE henti sementara, + kuatkan, MUTE senyapkan.","Padanan: PLAY—Mainkan; PAUSE—Jeda sementara; VOLUME +—Kuatkan bunyi; MUTE—Senyapkan."],"explain":"Pilihan kecil memberi Ki kuasa untuk mengawal bunyi di sekeliling.","choices":["Senyapkan","Mainkan","Kuatkan bunyi","Jeda sementara"],"accept":["Mainkan","Jeda sementara","Kuatkan bunyi","Senyapkan"]},{"kind":"choice","title":"Siapa Mendengar Dulu?","question":"Studio mempunyai tiga alat: satu mikrofon menerima suara; satu pembesar suara mengeluarkan bunyi; satu pengadun mengubah aras bunyi. Alat manakah menerima suara sebagai input?","answer":"Mikrofon","hints":["Bezakan menerima bunyi dengan menghasilkan bunyi.","Alat yang menerima gelombang suara untuk dirakam ialah mikrofon.","Jawapan: Mikrofon."],"explain":"Mula-mula kita belajar mendengar; barulah sesuatu boleh disampaikan.","choices":["Pengadun","Mikrofon","Pembesar suara"]},{"kind":"input","title":"Kod Nota Tersembunyi","question":"Baca kod abjad dengan A=1, B=2, …, Z=26: 8 – 5 – 14 – 9 – 14 – 7. Ia satu perkataan berkaitan suasana yang sunyi.","answer":"HENING","hints":["Gunakan 1=A dan 26=Z.","8=H, 5=E, 14=N, 9=I, 14=N, 7=G.","Jawapan: HENING."],"explain":"Hening bukan kosong; ia boleh menjadi tempat fikiran menemui ruang."},{"kind":"input","title":"Kod Nada","question":"Gunakan A=1, B=2, ... Z=26. Tukarkan 14 – 1 – 4 – 1 kepada satu perkataan muzik.","answer":"NADA","hints":["14 ialah N dan 4 ialah D.","Urutannya N–A–D–A.","Jawapan tepat: NADA."],"explain":"Nada yang lembut kadangkala membawa kesan yang besar."},{"kind":"order","title":"Lima Not Sebuah Kisah","question":"Lima kad ini membentuk kisah mendengar yang baik. Susun daripada membina ruang sehingga mendapat pemahaman.","answer":["Cari ruang yang kurang gangguan","Dengar tanpa menyampuk","Catat perkara yang penting","Tanya bahagian yang belum jelas","Rumusan apa yang difahami"],"hints":["Tindakan pertama sepatutnya membantu Ki memberi perhatian.","Ruang tenang → dengar → catat → tanya → rumuskan.","Jawapan tepat: Cari ruang yang kurang gangguan → Dengar tanpa menyampuk → Catat perkara yang penting → Tanya bahagian yang belum jelas → Rumusan apa yang difahami."],"explain":"Mendengar teliti membantu mengurangkan salah faham.","choices":["Tanya bahagian yang belum jelas","Rumusan apa yang difahami","Dengar tanpa menyampuk","Cari ruang yang kurang gangguan","Catat perkara yang penting"]},{"kind":"memory","title":"Tiga Loceng","question":"Lihat urutan bunyi pada loceng, sembunyikan, kemudian pilih simbol yang tepat.","answer":["🔔","🥁","🎹","🔔","🎹","🥁","🔔"],"hints":["Perhatikan simbol pertama dan terakhir adalah sama.","Urutan ialah 🔔 🥁 🎹 🔔 🎹 🥁 🔔.","Jawapan tepat: 🔔 → 🥁 → 🎹 → 🔔 → 🎹 → 🥁 → 🔔."],"explain":"Bukan kekuatan bunyi yang utama, tetapi kebolehan mengenal coraknya.","choices":["🔔","🥁","🎹"]},{"kind":"order","title":"Rentak Perbualan","question":"Sebuah perbualan yang baik memerlukan empat tahap. Susun menurut petunjuk: mendengar mesti sebelum memahami; memahami sebelum menjawab; menjawab sebelum menyemak sama ada mesej diterima.","answer":["Dengar hingga selesai","Fahami maksud","Jawab dengan tenang","Semak kefahaman"],"hints":["Cari ayat yang menggunakan perkataan sebelum.","Dengar → Faham → Jawab → Semak.","Jawapan: Dengar hingga selesai → Fahami maksud → Jawab dengan tenang → Semak kefahaman."],"explain":"Ada melodi dalam percakapan yang memberi ruang kepada orang lain.","choices":["Semak kefahaman","Jawab dengan tenang","Dengar hingga selesai","Fahami maksud"]},{"kind":"truth","title":"Lembaran Nota Asli","question":"Di studio tertera: lagu A berdurasi 2 minit; lagu B 4 minit; lagu C 3 minit; album mini mengandungi A, B dan C sahaja. Tentukan Benar/Salah.","answer":["Benar","Salah","Benar","Salah"],"hints":["Gunakan jumlah atau masa yang TERTERA, bukan anggaran.","A+B=6 minit; B bukan paling singkat; tiga lagu; jumlah album = 9 minit.","Jawapan: Benar, Salah, Benar, Salah."],"explain":"Bunyi yang indah juga terhasil daripada ketepatan dan susunan.","statements":["A dan B berjumlah 6 minit.","Lagu B paling pendek.","Album mini mempunyai tiga lagu.","Jumlah album mini ialah 8 minit."]},{"kind":"tiles","title":"Peti Kesunyian","question":"Susun SEMUA huruf menjadi perkataan enam huruf yang bermaksud tiada suara atau tidak berbunyi.","answer":"SENYAP","hints":["Perkataan ini menggambarkan bilik apabila semua suis dimatikan.","Bermula S dan berakhir P.","Jawapan: S – E – N – Y – A – P (SENYAP)."],"explain":"Kesunyian sesekali membantu kita mendengar sesuatu yang penting.","letters":["A","P","S","Y","N","E"]},{"kind":"choice","title":"Ruang Untuk Diri","question":"Hari Ki sangat bising dan penuh tugasan. Apakah pilihan paling sesuai untuk berehat sebentar secara selamat?","answer":"Cari tempat sesuai dan dengar muzik pada kelantangan selesa","hints":["Utamakan pilihan yang membantu rehat tanpa menyusahkan diri.","Pilih rehat yang selesa dan kelantangan yang tidak terlalu kuat.","Jawapan tepat: Cari tempat sesuai dan dengar muzik pada kelantangan selesa."],"explain":"Berehat seketika juga sebahagian daripada menjaga diri.","choices":["Naikkan muzik paling kuat","Cari tempat sesuai dan dengar muzik pada kelantangan selesa","Abaikan rasa penat selamanya","Buka semua audio serentak"]},{"kind":"match","title":"Bahasa Muzik","question":"Padankan istilah dengan maksud.","answer":["Tempo","Lirik","Melodi","Jeda"],"hints":["Terdapat empat konsep: kelajuan, kata lagu, susunan nada dan masa berhenti.","Tempo=kelajuan; lirik=kata-kata; melodi=susunan nada; jeda=berhenti seketika.","Jawapan tepat: Tempo → Kelajuan muzik; Lirik → Kata-kata dalam lagu; Melodi → Susunan nada; Jeda → Berhenti seketika."],"explain":"Muzik mempunyai ruang untuk bunyi dan juga ruang untuk diam.","choices":["Berhenti seketika","Kata-kata dalam lagu","Kelajuan muzik","Susunan nada"],"accept":["Kelajuan muzik","Kata-kata dalam lagu","Susunan nada","Berhenti seketika"]},{"kind":"memory","title":"Bintang dan Bunyi","question":"Hafal lapan simbol persembahan, kemudian cuba ulang selepas skrin disembunyikan.","answer":["🎵","🌙","⭐","🎶","🎵","⭐","🌙","🎶"],"hints":["Perhatikan empat simbol pertama dan empat simbol terakhir.","Empat pertama 🎵 🌙 ⭐ 🎶; empat terakhir 🎵 ⭐ 🌙 🎶.","Jawapan tepat: 🎵 → 🌙 → ⭐ → 🎶 → 🎵 → ⭐ → 🌙 → 🎶."],"explain":"Fokus yang tenang menjadikan sesuatu yang rumit lebih mudah dikenali.","choices":["🎵","🌙","⭐","🎶"]},{"kind":"memory","title":"Mesej Dari Radio Lama","question":"Hafal urutan tujuh simbol bunyi, kemudian sembunyikan dan ulang.","answer":["🎵","🔔","🎶","🎧","🔔","🎵","🎧"],"hints":["Empat simbol berbeza digunakan; beberapa simbol muncul dua kali.","Mula: 🎵 → 🔔 → 🎶 → 🎧.","Jawapan: 🎵 → 🔔 → 🎶 → 🎧 → 🔔 → 🎵 → 🎧."],"explain":"Lagu yang diingati kadang-kadang menjadi penanda satu masa yang istimewa.","choices":["🔔","🎧","🎵","🎶"]},{"kind":"keypad","title":"Nombor Dalam Irama","question":"Pola rentak ialah 5, 10, 20, 40. Setiap nilai DIDARAB DUA. Masukkan nombor seterusnya sebagai TIGA digit.","answer":"080","hints":["Bandingkan 5 ke 10 dan 10 ke 20.","40 × 2 = 80; tambah sifar di hadapan.","Kod tepat: 080."],"explain":"Apabila pola dapat dibaca, bunyi yang rumit menjadi lebih tersusun."},{"kind":"input","title":"Pesan Di Pita Terbalik","question":"Pita lama memaparkan huruf “IDOLEM”. Mesin mengatakan setiap perkataan dipaparkan dari BELAKANG ke DEPAN. Balikkan untuk mendapat satu kata penting bagi bab ini.","answer":"MELODI","hints":["Baca keseluruhan rangkaian dari kanan ke kiri.","Huruf terakhir M menjadi huruf pertama jawapan.","Jawapan: MELODI."],"explain":"Setiap kisah memiliki melodi, walau ada bahagian yang dimainkan perlahan."},{"kind":"pattern","title":"Bar Muzik","question":"Satu bar mempunyai 4 ketukan. Berapa jumlah ketukan untuk 6 bar? Taip nombor sahaja.","answer":"24","hints":["Gunakan darab kerana setiap bar sama panjang.","4 × 6 = 24.","Jawapan tepat: 24."],"explain":"Bunyi yang berulang dengan pola boleh membentuk sesuatu yang tenang."},{"kind":"order","title":"Dari Riuh Ke Tenang","question":"Susun empat tindakan apabila persekitaran terlalu riuh supaya keputusan dibuat dengan lebih jelas.","answer":["Berhenti seketika","Alihkan perhatian daripada gangguan","Kenal pasti perkara utama","Fokus pada satu perkara dahulu"],"hints":["Mula dengan mewujudkan ruang untuk bertenang.","Berhenti → kurangkan gangguan → kenal pasti perkara utama → fokus.","Jawapan tepat: Berhenti seketika → Alihkan perhatian daripada gangguan → Kenal pasti perkara utama → Fokus pada satu perkara dahulu."],"explain":"Kadangkala yang kita perlukan bukan lebih banyak suara, tetapi lebih jelas pilihan.","choices":["Kenal pasti perkara utama","Fokus pada satu perkara dahulu","Berhenti seketika","Alihkan perhatian daripada gangguan"]},{"kind":"input","title":"Perkataan Tersembunyi","question":"Susun huruf A – P – N – E – S – Y menjadi perkataan yang berlawanan dengan “bising” dalam konteks suasana.","answer":"SENYAP","hints":["Perkataan ini menggambarkan tiada bunyi atau sangat sedikit bunyi.","Enam huruf, bermula S, berakhir P.","Jawapan tepat: SENYAP."],"explain":"Diam dan senyap tidak sama dengan kosong; kadangkala ia ruang untuk berfikir."}],"wish":"Selamat hari lahir sekali lagi, Ki. Semoga ada lebih banyak detik yang Ki mahu simpan sebagai kenangan: lagu yang datang pada waktu tepat, perjalanan dengan muzik kegemaran, dan ketenangan selepas hari yang padat. Saya doakan suara Ki didengar dengan hormat, dan Ki juga sentiasa diberi ruang untuk memilih apa yang baik bagi fikiran sendiri."},{"name":"DAMAI","subtitle":"Ada perkataan yang perlahan, tetapi tinggal paling lama di hati.","symbol":"📖","gift":"BUKU","intro":["Perjalanan membawa Ki ke sebuah perpustakaan tanpa penjaga. Raknya penuh dengan halaman yang belum dibaca, surat yang belum dibuka, dan ayat yang seolah-olah menunggu masa yang tepat untuk ditemui.","Bab terakhir ini tentang kata-kata: cara ia boleh melukai jika dipilih tanpa fikir, dan cara ia boleh membuka ruang baharu jika disampaikan dengan lembut. Ki akan menyusun makna, menafsir mesej, dan akhirnya membaca surat yang disimpan khas untuk hari lahir Ki.","Dalam bab ini, Ki akan menemui sepuluh babak dan tiga puluh cabaran. Ada teka-teki huruf, susunan masa, kod rahsia, ingatan, logik, dan perkara kecil yang memerlukan perhatian. Tiada jawapan yang meminta Ki meneka perasaan saya; setiap teka-teki mempunyai petunjuk yang boleh diperiksa.","Jika satu cabaran terasa sukar, Ki boleh membuka tiga petunjuk berperingkat. Petunjuk pertama memberi arah, yang kedua semakin jelas, dan yang ketiga memberitahu jawapan supaya perjalanan tidak terhenti."],"scenes":[["Perpustakaan Damai","Ki memasuki perpustakaan yang sunyi tetapi tidak kosong. Cahaya pagi jatuh di atas rak; setiap buku menyimpan perjalanan seseorang. Pada meja pertama ada nota: “Jangan buru-buru menamatkan halaman. Fahami satu ayat pun sudah berharga.” Saya berharap tahun baharu usia Ki dipenuhi peluang belajar perkara yang ingin difahami, bukan perkara yang dipaksa oleh orang lain."],["Rak Perkataan","Di tengah perpustakaan, perkataan sabar, syukur dan empati ditulis di atas kad kecil. Ia bukan mantera untuk menghapuskan masalah. Ia hanya cara manusia membina ruang supaya masalah boleh dilihat dengan lebih jelas. Saya doakan Ki sentiasa mempunyai orang yang memberi ruang untuk merasa, bertanya dan berkembang. Tiada satu pun emosi perlu disorok semata-mata untuk nampak kuat."],["Nota Dalam Laci","Laci meja lama menyimpan surat putih, beberapa kepingan huruf dan kunci nombor. Semuanya membentuk cerita tentang perkara yang ditempatkan pada ruang yang betul. Saya berharap pada hari lahir ini Ki menyedari bahawa nilai diri tidak bergantung pada jumlah kerja yang diselesaikan atau berapa ramai orang yang memuji. Kehadiran Ki sendiri layak diraikan dengan penuh hormat."],["Halaman Pertama","Ki membuka sebuah buku yang belum habis ditulis. Di sisi setiap ayat ada ruang untuk membetulkan perkara yang tidak difahami. Belajar tidak bermaksud tiada kesilapan; belajar bermaksud memberi diri peluang untuk berubah. Saya berharap setiap halaman baharu dalam hidup Ki mengandungi keberanian untuk bertanya dan rasa tenang untuk menerima bahawa masa depan belum mempunyai semua jawapan."],["Glosari Hati","Empat perkataan menunggu di rak kecil: SYUKUR, SABAR, EMPATI dan HARAPAN. Setiap satu diberikan makna yang jelas agar Ki tidak perlu meneka perasaan mana yang “sepatutnya” hadir. Saya berharap Ki dibenarkan menjadi manusia yang kompleks: boleh gembira dan risau pada hari yang sama, boleh bercita-cita besar dan tetap menghargai rehat yang kecil."],["Sepucuk Surat","Pada halaman seterusnya, Ki menemukan surat lama yang ditulis tanpa nama penerima. Surat itu berkata: “Jika hari ini terasa sukar, cuba buka halaman yang belum sempat dibaca.” Saya tidak berharap permainan ini menyelesaikan setiap kerisauan. Saya cuma mahu ia mengingatkan Ki bahawa kata-kata boleh menjadi ruang untuk berfikir dan berharap dengan lebih baik."],["Sebuah Hari, Empat Waktu","Ki membaca catatan seseorang yang bermula pada pagi dan berakhir pada malam. Tidak ada kejadian besar pun; hanya usaha, rehat, dan sedikit rasa syukur. Betapa banyak hari kita lalui dengan cara begitu. Saya berharap Ki dapat menghargai kebaikan biasa yang sering terlepas pandang: minuman yang menyegarkan, udara selepas hujan, dan orang yang mendengar dengan saksama."],["Kertas Yang Dilipat","Sebahagian halaman berkedut, sebahagian lagi masih putih bersih. Ki tidak perlu merobek semuanya hanya kerana satu ayat belum menjadi seperti yang dirancang. Kita boleh menyemak, menulis semula, dan belajar. Saya berharap perjalanan Ki dipenuhi peluang untuk membuat pilihan yang semakin sesuai dengan nilai yang Ki pegang, bukan sekadar mengikut jangkaan orang lain."],["Tanda Terakhir","Pada meja terakhir ada simbol hati, sebuah kunci kecil dan surat yang terbalik. Ki diminta mengingati beberapa lambang, mengira halaman dan membaca kata dari arah berbeza. Saya berharap Ki membawa pulang satu pesan: apabila hidup menjadi rumit, kadangkala jawapan tidak datang daripada menambah lebih banyak bunyi, tetapi daripada memberi sedikit ruang untuk memahami."],["Kotak Ketiga","Di hujung perpustakaan terdapat sebuah kotak yang tertutup kemas. Tulisannya berbunyi: “Untuk semua soalan yang masih menunggu jawapan, dan semua halaman yang akan dibuka.” Saya doakan Ki sentiasa mempunyai sebab untuk berharap, keberanian untuk memulakan sesuatu, kesabaran untuk meneruskannya, dan orang yang mengiktiraf perkembangan Ki tanpa memaksa perjalanan menjadi sempurna."]],"bridge":"Ki telah tiba di halaman terakhir. Di sini, jawapan bukan sekadar satu perkataan. Ia adalah tentang langkah yang diteruskan, melodi yang dipilih, dan kata-kata yang memberi ruang untuk hati menjadi damai.","tasks":[{"kind":"choice","title":"Ayat Pada Halaman Kosong","question":"Seseorang melakukan kesilapan. Ayat manakah paling membantu tanpa menafikan kesilapan itu?","answer":"Kesilapan ini boleh menjadi sesuatu yang Ki pelajari","hints":["Pilih ayat yang memberi ruang untuk belajar.","Elakkan label yang menghina atau ayat yang menafikan masalah.","Jawapan tepat: Kesilapan ini boleh menjadi sesuatu yang Ki pelajari."],"explain":"Kata-kata yang baik boleh mengakui kesilapan sambil membuka harapan.","choices":["Ki memang tidak boleh berubah","Kesilapan ini boleh menjadi sesuatu yang Ki pelajari","Semua perkara tidak pernah penting","Jangan pernah cuba lagi"]},{"kind":"input","title":"Anagram Damai","question":"Susun huruf I – A – D – A – M kepada perkataan yang bermaksud tenteram atau aman.","answer":"DAMAI","hints":["Perkataan ini dekat dengan ketenangan hati.","Lima huruf, bermula D, berakhir I.","Jawapan tepat: DAMAI."],"explain":"Kedamaian boleh bermula dengan cara kita melihat diri sendiri."},{"kind":"match","title":"Empat Jenis Surat","question":"Padankan keadaan dengan pembuka surat yang paling sesuai.","answer":["Surat terima kasih","Surat memohon maaf","Surat memberi semangat","Surat hari lahir"],"hints":["Tengok tujuan setiap surat terlebih dahulu.","Terima kasih → hargai bantuan; maaf → akui kesilapan; semangat → percaya usaha; hari lahir → doa dan ucapan.","Jawapan tepat: Surat terima kasih → Saya menghargai pertolongan Ki.; Surat memohon maaf → Saya sedar saya tersilap.; Surat memberi semangat → Saya percaya Ki boleh berusaha lagi.; Surat hari lahir → Saya doakan hari ini membawa kegembiraan.."],"explain":"Perkataan yang dipilih perlu sesuai dengan tujuan.","choices":["Saya doakan hari ini membawa kegembiraan.","Saya menghargai pertolongan Ki.","Saya sedar saya tersilap.","Saya percaya Ki boleh berusaha lagi."],"accept":["Saya menghargai pertolongan Ki.","Saya sedar saya tersilap.","Saya percaya Ki boleh berusaha lagi.","Saya doakan hari ini membawa kegembiraan."]},{"kind":"match","title":"Rak Perkataan","question":"Padankan kata dengan maksudnya.","answer":["Empati","Syukur","Harapan","Sabar"],"hints":["Baca maksud yang berkaitan dengan memahami, menghargai, percaya dan bertahan.","Empati=memahami perasaan; syukur=menghargai; harapan=percaya pada kemungkinan baik; sabar=bertahan dengan tenang.","Jawapan tepat: Empati → Memahami perasaan orang lain; Syukur → Menghargai apa yang ada; Harapan → Percaya pada kemungkinan baik; Sabar → Bertahan dengan tenang."],"explain":"Perkataan berbeza boleh membantu kita menghadapi hari yang berbeza.","choices":["Menghargai apa yang ada","Memahami perasaan orang lain","Percaya pada kemungkinan baik","Bertahan dengan tenang"],"accept":["Memahami perasaan orang lain","Menghargai apa yang ada","Percaya pada kemungkinan baik","Bertahan dengan tenang"]},{"kind":"order","title":"Surat Empat Baris","question":"Susun ayat menjadi surat yang logik, daripada mengenali hari sukar hingga menyampaikan harapan.","answer":["Saya tahu ada hari yang terasa berat.","Saya harap Ki memberi diri ruang untuk berehat.","Esok boleh membawa peluang baharu.","Saya doakan Ki menemui kekuatan untuk meneruskan."],"hints":["Surat bermula dengan memahami keadaan.","Fahami → rehat → harapan untuk esok → doa untuk meneruskan.","Jawapan tepat: Saya tahu ada hari yang terasa berat. → Saya harap Ki memberi diri ruang untuk berehat. → Esok boleh membawa peluang baharu. → Saya doakan Ki menemui kekuatan untuk meneruskan.."],"explain":"Kata yang lembut tidak menyelesaikan semua masalah, tetapi boleh memberi sokongan.","choices":["Esok boleh membawa peluang baharu.","Saya tahu ada hari yang terasa berat.","Saya doakan Ki menemui kekuatan untuk meneruskan.","Saya harap Ki memberi diri ruang untuk berehat."]},{"kind":"multi","title":"Kata Yang Menyembuhkan","question":"Pilih TEPAT TIGA contoh ayat yang menyokong seseorang yang sedang kecewa.","answer":["Saya sedia mendengar.","Ki boleh cuba lagi apabila bersedia.","Rehat seketika tidak mengapa."],"hints":["Ayat yang membantu memberi ruang dan tidak menghukum.","Pilih tawaran mendengar, peluang cuba lagi, dan izin berehat.","Jawapan tepat: Saya sedia mendengar., Ki boleh cuba lagi apabila bersedia., Rehat seketika tidak mengapa.."],"explain":"Kata-kata yang membawa damai selalunya tidak mendesak.","choices":["Saya sedia mendengar.","Ki patut malu selamanya.","Ki boleh cuba lagi apabila bersedia.","Rehat seketika tidak mengapa.","Perasaan Ki langsung tidak penting."]},{"kind":"truth","title":"Peraturan Rak Buku","question":"Pada meja ada empat nota: buku hijau di rak atas; surat putih dalam laci; pen hitam di sisi lampu; halaman kosong disimpan di dalam buku. Pilih Benar/Salah.","answer":["Benar","Salah","Benar","Benar"],"hints":["Semak kedudukan asal setiap benda.","Buku hijau atas, surat di laci, pen di lampu, halaman kosong dalam buku.","Jawapan: Benar, Salah, Benar, Benar."],"explain":"Kadangkala damai bermula dengan melihat apa yang sebenar ada di depan kita.","statements":["Buku hijau berada di rak atas.","Surat putih ada di bawah lampu.","Pen hitam terletak di sisi lampu.","Halaman kosong berada dalam sebuah buku."]},{"kind":"tiles","title":"Enam Huruf Menenangkan","question":"Susun SEMUA huruf menjadi perkataan enam huruf yang menggambarkan perasaan tidak gelisah.","answer":"TENANG","hints":["Perkataan ini melukiskan tujuan terakhir perjalanan Ki.","Bermula T, berakhir G, dan mempunyai enam huruf.","Jawapan: T – E – N – A – N – G (TENANG)."],"explain":"Tenang bukan bermakna semua masalah lenyap; tenang memberi ruang memilih langkah seterusnya.","letters":["N","G","T","A","E","N"]},{"kind":"keypad","title":"Kod Dua Rak","question":"Rak pertama mempunyai 7 buku. Rak kedua mempunyai 8 buku. Rak ketiga kosong. Kod tiga digit ialah jumlah buku dalam semua rak, ditulis dengan sifar di hadapan.","answer":"015","hints":["Jumlahkan semua buku, termasuk rak kosong yang menambah sifar.","7 + 8 + 0 = 15. Tiga digit diperlukan.","Kod tepat: 015."],"explain":"Satu halaman pun boleh membawa makna; banyak halaman membentuk perjalanan."},{"kind":"pattern","title":"Buku Empat Halaman Sehari","question":"Ki membaca 4 halaman setiap hari selama 7 hari. Berapa halaman yang sudah dibaca semuanya? Taip nombor sahaja.","answer":"28","hints":["Darab halaman sehari dengan bilangan hari.","4 × 7 = 28.","Jawapan tepat: 28."],"explain":"Pengetahuan tumbuh satu halaman pada satu masa."},{"kind":"input","title":"Kod Hati","question":"Gunakan A=1 hingga Z=26. Tukarkan 8 – 1 – 20 – 9 kepada satu perkataan Melayu.","answer":"HATI","hints":["8=H dan 20=T.","Bacaan lengkap: H–A–T–I.","Jawapan tepat: HATI."],"explain":"Hati tidak selalu berubah oleh suara kuat; kadangkala oleh satu ayat ikhlas."},{"kind":"memory","title":"Lembaran Bergambar","question":"Hafal susunan simbol pada buku lama sebelum menyembunyikannya dan mengulanginya.","answer":["📖","🌱","🕊️","✉️","📖","⭐","🕊️"],"hints":["Simbol pertama muncul sekali lagi di tempat kelima.","Urutannya 📖 🌱 🕊️ ✉️ 📖 ⭐ 🕊️.","Jawapan tepat: 📖 → 🌱 → 🕊️ → ✉️ → 📖 → ⭐ → 🕊️."],"explain":"Cerita yang kita ingati kadang-kadang memberi semangat ketika diperlukan.","choices":["📖","🌱","🕊️","✉️","⭐"]},{"kind":"match","title":"Penanda Dalam Diari","question":"Padankan perkataan dengan makna yang tertera pada glosari: SYUKUR=berterima kasih; SABAR=bertahan dengan tenang; EMPATI=memahami perasaan orang; HARAPAN=keinginan untuk masa depan.","answer":["SYUKUR","SABAR","EMPATI","HARAPAN"],"hints":["Glosari diberikan dalam soalan; baca setiap takrif.","Syukur = berterima kasih; sabar = bertahan; empati = memahami; harapan = keinginan masa depan.","Padanan: SYUKUR—Berterima kasih; SABAR—Bertahan dengan tenang; EMPATI—Memahami perasaan orang; HARAPAN—Keinginan untuk masa depan."],"explain":"Bahasa yang kita pilih boleh membantu hati memahami dirinya.","choices":["Keinginan untuk masa depan","Memahami perasaan orang","Berterima kasih","Bertahan dengan tenang"],"accept":["Berterima kasih","Bertahan dengan tenang","Memahami perasaan orang","Keinginan untuk masa depan"]},{"kind":"choice","title":"Halaman Yang Membawa Pulang","question":"Tiga nota dilekatkan pada tiga kotak. Nota A: “Semua soalan mesti dijawab hari ini.” Nota B: “Satu persoalan boleh direnungkan sedikit demi sedikit.” Nota C: “Tidak perlu pernah membaca.” Nota manakah paling menyokong sikap belajar secara berperingkat?","answer":"Nota B","hints":["Cari ayat yang tidak mendesak semua jawapan serentak.","Nota B mengizinkan proses perlahan dan bertahap.","Jawapan: Nota B."],"explain":"Rasa ingin tahu tidak memerlukan kita memahami segalanya pada satu hari.","choices":["Nota A","Nota C","Nota B"]},{"kind":"input","title":"Huruf Dalam Pesan Lama","question":"Tukarkan kod A=1, B=2, …, Z=26: 19 – 1 – 2 – 1 – 18. Ini satu perkataan lima huruf tentang kesabaran.","answer":"SABAR","hints":["Tukarkan nombor kepada huruf, tanpa menambah huruf lain.","19=S, 1=A, 2=B, 1=A, 18=R.","Jawapan tepat: SABAR."],"explain":"Sabar bukan menyerah; ia memilih cara yang baik untuk meneruskan."},{"kind":"choice","title":"Dua Cara Menegur","question":"Ki mahu mengingatkan seseorang tentang kesilapan. Pilihan manakah paling jelas dan hormat?","answer":"Terangkan perkara yang salah dan cadangkan cara membaikinya","hints":["Teguran paling berkesan memberi maklumat yang berguna.","Fokus pada perbuatan dan cara membaiki, bukan menghina orangnya.","Jawapan tepat: Terangkan perkara yang salah dan cadangkan cara membaikinya."],"explain":"Kejujuran boleh disampaikan tanpa menyakitkan hati.","choices":["Mengejek di hadapan ramai orang","Terangkan perkara yang salah dan cadangkan cara membaikinya","Mendiamkan tanpa penjelasan selama-lamanya","Mengulang tuduhan tanpa bukti"]},{"kind":"order","title":"Lima Baris Ucapan","question":"Susun LIMA baris ini menjadi satu ucapan yang mempunyai pembuka, penghargaan, harapan, doa dan penutup.","answer":["Selamat hari lahir, Ki.","Terima kasih atas kebaikan Ki.","Semoga Ki terus menemukan perkara yang membahagiakan.","Saya doakan kesihatan dan ketenangan untuk Ki.","Semoga bab baharu hidup Ki membawa makna."],"hints":["Mulakan dengan ucapan hari lahir, bukan penutup.","Pembuka → terima kasih → harapan → doa → penutup.","Jawapan tepat: Selamat hari lahir, Ki. → Terima kasih atas kebaikan Ki. → Semoga Ki terus menemukan perkara yang membahagiakan. → Saya doakan kesihatan dan ketenangan untuk Ki. → Semoga bab baharu hidup Ki membawa makna.."],"explain":"Susunan ayat membantu mesej kedengaran lebih ikhlas dan jelas.","choices":["Saya doakan kesihatan dan ketenangan untuk Ki.","Semoga bab baharu hidup Ki membawa makna.","Terima kasih atas kebaikan Ki.","Selamat hari lahir, Ki.","Semoga Ki terus menemukan perkara yang membahagiakan."]},{"kind":"pattern","title":"Halaman Yang Hilang","question":"Sebuah buku mempunyai halaman bernombor 21, 22, 23, __, 25. Apakah nombor halaman yang hilang?","answer":"24","hints":["Nombor halaman bertambah satu demi satu.","Nombor di antara 23 dan 25.","Jawapan tepat: 24."],"explain":"Kadangkala satu halaman kecil melengkapkan sebuah cerita."},{"kind":"order","title":"Surat Yang Dilipat","question":"Susun empat ayat surat berdasarkan masa yang jelas: pagi → tengah hari → petang → malam.","answer":["Pagi saya membuka halaman pertama.","Tengah hari saya mencatat perkara yang dipelajari.","Petang saya berhenti seketika untuk berfikir.","Malam saya menutup buku dengan rasa syukur."],"hints":["Perhatikan penanda waktu pada setiap ayat.","Pagi berlaku sebelum tengah hari, kemudian petang, kemudian malam.","Jawapan: Pagi → Tengah hari → Petang → Malam."],"explain":"Satu hari yang sederhana juga berhak menjadi cerita yang indah.","choices":["Malam saya menutup buku dengan rasa syukur.","Petang saya berhenti seketika untuk berfikir.","Pagi saya membuka halaman pertama.","Tengah hari saya mencatat perkara yang dipelajari."]},{"kind":"truth","title":"Empat Ayat Dalam Manuskrip","question":"Dalam cerita: Ki membaca halaman 1 pada Isnin, halaman 2 pada Selasa, halaman 3 pada Rabu. Pada Khamis, Ki belum membuka buku. Tandakan Benar/Salah.","answer":["Benar","Salah","Benar","Salah"],"hints":["Semak hari dan nombor halaman yang dinyatakan.","Isnin 1, Selasa 2, Rabu 3, Khamis belum membaca.","Jawapan: Benar, Salah, Benar, Salah."],"explain":"Halaman yang belum dibuka tidak bermakna kisah sudah tamat.","statements":["Halaman 1 dibaca pada Isnin.","Halaman 3 dibaca pada Selasa.","Ki membaca pada Rabu.","Ki sudah membaca halaman 4 pada Khamis."]},{"kind":"tiles","title":"Kata Dalam Hati","question":"Susun SEMUA huruf menjadi perkataan enam huruf yang bermaksud jujur dan tulus melakukan sesuatu.","answer":"IKHLAS","hints":["Sesuatu pemberian tidak mesti mahal untuk mempunyai makna ini.","Huruf pertama I; huruf terakhir S.","Jawapan: I – K – H – L – A – S (IKHLAS)."],"explain":"Keikhlasan bukan ukuran harga, tetapi niat di sebalik suatu perbuatan.","letters":["A","S","K","I","L","H"]},{"kind":"match","title":"Sampul Dan Pesanan","question":"Padankan situasi dengan pesanan ringkas yang sesuai.","answer":["Ki berjaya menyiapkan sesuatu","Ki perlu berehat","Ki masih belajar perkara baharu","Ki berdepan pilihan sukar"],"hints":["Setiap pesanan perlu sepadan dengan keadaan.","Berjaya=raikan usaha; letih=rehat; belajar=tidak perlu terus mahir; pilihan sukar=nilai dan tujuan.","Jawapan tepat: Ki berjaya menyiapkan sesuatu → Raikan usaha yang telah dibuat; Ki perlu berehat → Ambil masa untuk pulihkan tenaga; Ki masih belajar perkara baharu → Tidak mengapa jika belum mahir; Ki berdepan pilihan sukar → Pilih berdasarkan nilai dan tujuan."],"explain":"Sokongan yang baik terasa tepat kerana ia memahami keadaan.","choices":["Raikan usaha yang telah dibuat","Ambil masa untuk pulihkan tenaga","Tidak mengapa jika belum mahir","Pilih berdasarkan nilai dan tujuan"],"accept":["Raikan usaha yang telah dibuat","Ambil masa untuk pulihkan tenaga","Tidak mengapa jika belum mahir","Pilih berdasarkan nilai dan tujuan"]},{"kind":"order","title":"Resipi Mendengar Hati","question":"Susun tindakan apabila Ki mahu memahami perasaan sendiri: namakan emosi, kenal pasti punca, pilih respons, semak keadaan.","answer":["Namakan perasaan","Fikirkan apa yang mencetuskannya","Pilih langkah kecil yang membantu","Perhatikan sama ada keadaan bertambah baik"],"hints":["Mulakan dengan mengenal perasaan.","Perasaan → punca → tindakan → semakan.","Jawapan tepat: Namakan perasaan → Fikirkan apa yang mencetuskannya → Pilih langkah kecil yang membantu → Perhatikan sama ada keadaan bertambah baik."],"explain":"Memahami diri selalunya mengambil masa dan itu tidak mengapa.","choices":["Pilih langkah kecil yang membantu","Perhatikan sama ada keadaan bertambah baik","Namakan perasaan","Fikirkan apa yang mencetuskannya"]},{"kind":"memory","title":"Cap Pada Sampul","question":"Hafal urutan lapan cap surat ini, kemudian sembunyikan dan ulang.","answer":["✉️","🌸","📖","🕯️","✉️","📖","🌸","🕯️"],"hints":["Cap pertama berulang di tempat kelima.","Empat pertama ✉️ 🌸 📖 🕯️; empat terakhir ✉️ 📖 🌸 🕯️.","Jawapan tepat: ✉️ → 🌸 → 📖 → 🕯️ → ✉️ → 📖 → 🌸 → 🕯️."],"explain":"Ada mesej yang menjadi lebih bermakna apabila diperhatikan dengan teliti.","choices":["✉️","🌸","📖","🕯️"]},{"kind":"memory","title":"Tujuh Tanda Pada Kertas","question":"Hafal urutan tujuh tanda di kertas, sembunyikan dan ulang.","answer":["📖","🕊️","✉️","🌱","📖","✉️","🌱"],"hints":["Simbol pertama ialah buku; simbol kedua ialah burung merpati.","Empat tanda awal: 📖 → 🕊️ → ✉️ → 🌱.","Jawapan: 📖 → 🕊️ → ✉️ → 🌱 → 📖 → ✉️ → 🌱."],"explain":"Ada perkara kecil yang tinggal dalam ingatan kerana kita memberi perhatian.","choices":["🌱","✉️","🕊️","📖"]},{"kind":"keypad","title":"Kunci Nombor Halaman","question":"Setiap bahagian mempunyai 6 halaman. Terdapat 4 bahagian. Kunci ialah jumlah halaman ditulis sebagai TIGA digit.","answer":"024","hints":["Darab halaman setiap bahagian dengan jumlah bahagian.","6 × 4 = 24. Tulis menggunakan tiga digit.","Kod: 024."],"explain":"Satu bab kecil boleh menyumbang kepada makna keseluruhan."},{"kind":"input","title":"Pesan Di Cermin","question":"Pada muka belakang kertas tertera “ITAH”. Tulisan itu perlu dibaca dari KANAN ke KIRI. Apakah perkataan Melayu empat huruf yang muncul?","answer":"HATI","hints":["Balikkan susunan huruf, bukan bentuk huruf.","Huruf pertama baharu ialah H; terakhir I.","Jawapan tepat: HATI."],"explain":"Kadang-kadang kita perlu membaca dengan cara berbeza untuk menemui maksud."},{"kind":"input","title":"Anagram Halaman","question":"Susun huruf A – M – A – N – H – A – L menjadi satu perkataan yang terdapat di dalam buku dan boleh dibaca satu demi satu.","answer":"HALAMAN","hints":["Ia mempunyai nombor dalam kebanyakan buku.","Tujuh huruf, bermula H, berakhir N.","Jawapan tepat: HALAMAN."],"explain":"Satu halaman mungkin kecil, tetapi boleh membawa idea yang besar."},{"kind":"multi","title":"Isi Surat Yang Ikhlas","question":"Pilih TEPAT TIGA unsur yang membuat ucapan hari lahir terasa bermakna.","answer":["Doa yang baik","Penghargaan yang jujur","Harapan untuk masa depan"],"hints":["Pilih isi yang menghargai penerima dan hidupnya.","Doa, penghargaan, dan harapan lebih bermakna daripada ejekan atau tekanan.","Jawapan tepat: Doa yang baik, Penghargaan yang jujur, Harapan untuk masa depan."],"explain":"Ucapan yang baik bukan pertandingan kata-kata paling hebat.","choices":["Doa yang baik","Ejekan tentang kekurangan","Penghargaan yang jujur","Harapan untuk masa depan","Desakan agar sentiasa sempurna"]},{"kind":"input","title":"Kata Dalam Bingkai","question":"Susun huruf K – U – B – U menjadi benda yang mempunyai halaman dan menyimpan cerita.","answer":"BUKU","hints":["Benda ini boleh dibaca.","Empat huruf, bermula B dan berakhir U.","Jawapan tepat: BUKU."],"explain":"Buku menyimpan suara penulis walaupun halaman dibaca dalam diam."}],"wish":"Selamat hari lahir, Ki. Saya doakan Ki dikurniakan hati yang lapang, fikiran yang jernih, ilmu yang bermanfaat, persahabatan yang ikhlas dan rezeki yang berkat. Semoga ada banyak halaman indah yang belum Ki baca, kejutan baik yang belum Ki jumpa dan sebab untuk bersyukur yang terus muncul sepanjang tahun ini."}];
const TOTAL=chapters.reduce((a,c)=>a+c.tasks.length,0);
const KEY='tiga_bab_satu_takdir_ki_90_puzzles_v2';
const app=document.getElementById('app');
const progress=document.getElementById('progress');
const clock=document.getElementById('clock');
const scoreLabel=document.getElementById('scoreLabel');
function blank(){return {phase:'home',chapter:0,index:0,solved:0,score:0,hintsUsed:0,wrong:0,started:0,correct:false,hintLevel:0,picks:[],selected:'',typed:'',matches:{},truth:{},memoryVisible:true,notice:''};}
let state=blank();
try {let prev=JSON.parse(localStorage.getItem(KEY)||'null');if(prev&&['home','intro','puzzle','bridge','ending'].includes(prev.phase)&&Number.isInteger(prev.chapter)&&prev.chapter>=0&&prev.chapter<3&&Number.isInteger(prev.index)&&prev.index>=0&&prev.index<30&&Number.isInteger(prev.solved)&&prev.solved>=0&&prev.solved<=TOTAL){state={...blank(),...prev,picks:Array.isArray(prev.picks)?prev.picks:[],matches:prev.matches&&typeof prev.matches==='object'?prev.matches:{}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const esc=x=>String(x).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const normalize=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[.,;:!?\-]+/g,' ').replace(/\s+/g,' ');
function current(){return chapters[state.chapter].tasks[state.index]}
function panel(kicker,title,body,buttons=''){app.innerHTML=`<section class="panel"><div class="eyebrow">${esc(kicker)}</div><h1 class="${state.phase==='home'?'display':'h2'}">${title}</h1>${body}${buttons?`<div class="actions">${buttons}</div>`:''}</section>`;updateHeader();save()}
function button(label,act,extra=''){return `<button type="button" class="btn ${extra}" data-action="${act}">${label}</button>`}
function updateHeader(){progress.style.width=(state.solved/TOTAL*100)+'%';scoreLabel.textContent='Mata: '+state.score;updateClock()}
function updateClock(){let sec=state.started?Math.max(0,Math.floor((Date.now()-state.started)/1000)):0;clock.textContent=`${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
setInterval(updateClock,1000);
function resetPuzzle(){state.correct=false;state.hintLevel=0;state.picks=[];state.selected='';state.typed='';state.matches={};state.truth={};state.memoryVisible=true;state.notice='';state.wrong=0;}
function showHome(){state.phase='home';panel('Untuk seseorang bernama Ki','Tiga Bab,<br>Satu Takdir',`<div class="intro"><p>Ki, ada tiga hadiah yang menunggu di penghujung sebuah perjalanan. Tetapi sebelum setiap hadiah boleh dibuka, ada cerita yang perlu difahami dan teka-teki yang perlu diselesaikan.</p><p>Ini bukan permainan tentang siapa paling pantas. Setiap bab menyimpan satu doa dan satu harapan untuk perjalanan Ki yang seterusnya.</p></div><div class="chapter-list"><div class="chapter-card"><div class="emoji">👣</div><strong>Bab I</strong><span>Langkah</span></div><div class="chapter-card"><div class="emoji">🎧</div><strong>Bab II</strong><span>Melodi</span></div><div class="chapter-card"><div class="emoji">📖</div><strong>Bab III</strong><span>Damai</span></div></div><div class="menu-pills"><span class="chip">90 teka-teki</span><span class="chip">10 bentuk cabaran</span><span class="chip">Anggaran 60–90 minit</span></div><p class="muted small">Jawapan perlu tepat untuk meneruskan. Setiap cabaran ada tiga petunjuk berperingkat. Kemajuan disimpan secara automatik dalam pelayar yang sama.</p>`,button('Mulakan perjalanan Ki →','begin','primary wide'));}
function intro(){state.phase='intro';let c=chapters[state.chapter];panel(`Bab ${state.chapter+1} daripada 3 · ${esc(c.name)}`,`${c.symbol} ${esc(c.name)}`,`<p class="muted">${esc(c.subtitle)}</p><div class="divider"></div><div class="intro">${c.intro.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="menu-pills"><span class="chip">30 cabaran</span><span class="chip">10 babak cerita</span><span class="chip">3 petunjuk setiap cabaran</span></div>`,button('Buka bab ini →','startchapter','primary wide'));}
function sectionScene(){if(state.index%4!==0)return '';const s=chapters[state.chapter].scenes[state.index/4];return `<div class="scene"><div class="scene-title">Babak ${state.index/4+1} · ${esc(s[0])}</div><p>${esc(s[1])}</p></div>`}
function choiceHTML(t){return `<div class="method">PILIH SATU JAWAPAN</div><div class="choices">${t.choices.map((x,i)=>`<button type="button" class="option ${state.selected===x?'selected':''}" aria-pressed="${state.selected===x}" data-action="choose" data-value="${i}" ${state.correct?'disabled':''}>${esc(x)}</button>`).join('')}</div>`}
function multiHTML(t){return `<div class="method">PILIH TEPAT ${t.answer.length} PILIHAN</div><div class="choices">${t.choices.map((x,i)=>`<button type="button" class="option ${state.picks.includes(x)?'selected':''}" aria-pressed="${state.picks.includes(x)}" data-action="multichoose" data-value="${i}" ${state.correct?'disabled':''}>${esc(x)}</button>`).join('')}</div><div class="status">${state.picks.length} daripada ${t.answer.length} dipilih.</div>`}
function orderHTML(t){return `<div class="method">SUSUN DENGAN MENEKAN PILIHAN MENGIKUT URUTAN</div><div class="selected-list" aria-label="Susunan dipilih">${state.picks.length?state.picks.map((x,i)=>`<span class="mini">${i+1}. ${esc(x)}</span>`).join(''):'Belum ada potongan dipilih.'}</div><div class="stack">${t.choices.map((x,i)=>`<button type="button" class="option ${state.picks.includes(x)?'selected':''}" data-action="orderchoose" data-value="${i}" ${state.picks.includes(x)||state.correct?'disabled':''}>${esc(x)}</button>`).join('')}</div>${button('↶ Buang pilihan terakhir','undo','subtle')} ${button('Kosongkan susunan','clear','subtle')}`}
function inputHTML(t){return `<div class="method">TAIP JAWAPAN</div><input id="answer" class="field" type="text" placeholder="Taip jawapan Ki di sini…" value="${esc(state.typed)}" autocomplete="off" autocapitalize="off" spellcheck="false" ${state.correct?'disabled':''} aria-label="Jawapan teka-teki"><div class="muted small" style="margin-top:8px">Huruf besar atau kecil tidak mempengaruhi semakan.</div>`}
function matchHTML(t){return `<div class="method">PADANKAN KEEMPAT-EMPAT ITEM</div><div class="stack">${t.answer.map((x,i)=>`<div class="rowpair"><label for="match-${i}">${esc(x)}</label><select id="match-${i}" data-index="${i}" aria-label="Padanan untuk ${esc(x)}" ${state.correct?'disabled':''}><option value="">— Pilih maksud —</option>${t.choices.map(v=>`<option value="${esc(v)}" ${state.matches[i]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`).join('')}</div>`}
function memoryHTML(t){return `<div class="method">INGAT URUTAN, SEMBUNYIKAN, KEMUDIAN ULANG</div><div class="memory-board" aria-label="Urutan memori">${state.memoryVisible?t.answer.map(x=>`<span class="memory-symbol">${esc(x)}</span>`).join(''):'<span class="memory-hide">Urutan disembunyikan. Pilih simbol di bawah satu demi satu.</span>'}</div>${state.memoryVisible?button('Sembunyikan & jawab','hide','primary wide'):`<div class="selected-list" aria-label="Urutan jawapan Ki">${state.picks.length?state.picks.map(x=>`<span class="mini">${esc(x)}</span>`).join(''):'Pilih simbol mengikut susunan yang diingati.'}</div><div class="memory-keys">${t.choices.map((v,i)=>`<button type="button" class="tile" data-action="memorychoose" data-value="${i}" ${state.correct||state.picks.length>=t.answer.length?'disabled':''}>${esc(v)}</button>`).join('')}</div><div class="actions">${button('↶ Buang simbol','undo','subtle')}${button('Lihat urutan semula','reveal','subtle')}</div>`}`}

function truthHTML(t){return `<div class="method">PILIH BENAR ATAU SALAH UNTUK SETIAP AYAT</div><div class="stack">${t.statements.map((s,i)=>`<div class="truth-row"><div class="truth-sentence"><strong>${i+1}.</strong> ${esc(s)}</div><div class="truth-actions">${['Benar','Salah'].map(v=>`<button type="button" class="option compact ${state.truth[i]===v?'selected':''}" aria-pressed="${state.truth[i]===v}" data-action="truth" data-index="${i}" data-value="${v}" ${state.correct?'disabled':''}>${v}</button>`).join('')}</div></div>`).join('')}</div>`}
function tilesHTML(t){return `<div class="method">BINA JAWAPAN DENGAN KEPINGAN HURUF</div><div class="selected-list tiles-preview">${state.picks.length?state.picks.map(i=>`<span class="letter-picked">${esc(t.letters[i])}</span>`).join(''):'Tekan satu huruf demi satu huruf.'}</div><div class="tile-grid">${t.letters.map((l,i)=>`<button type="button" class="tile" data-action="tilepick" data-value="${i}" ${state.picks.includes(i)||state.correct?'disabled':''}>${esc(l)}</button>`).join('')}</div><div class="actions">${button('↶ Buang huruf terakhir','undo','subtle')}${button('Kosongkan jawapan','clear','subtle')}</div>`}
function keypadHTML(t){return `<div class="method">KUNCI NOMBOR · TIGA DIGIT</div><div class="keypad-display" aria-label="Kod yang telah dimasukkan">${[0,1,2].map(i=>`<span class="digit">${state.picks[i]??'—'}</span>`).join('')}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','↶','0','✕'].map(x=>`<button type="button" class="tile" data-action="${x==='↶'?'undo':x==='✕'?'clear':'digit'}" ${x==='↶'||x==='✕'?'':`data-value="${x}"`} ${state.correct?'disabled':''}>${x}</button>`).join('')}</div>`}

function puzzle(){state.phase='puzzle';const c=chapters[state.chapter],t=current();let method=({choice:choiceHTML,multi:multiHTML,order:orderHTML,input:inputHTML,pattern:inputHTML,match:matchHTML,memory:memoryHTML,truth:truthHTML,tiles:tilesHTML,keypad:keypadHTML})[t.kind](t);const notices=state.notice?`<div class="notice ${state.correct?'good':'bad'}" role="status">${esc(state.notice)}</div>`:'';let hints=`<div class="hint-zone"><div class="hint-title"><span>✧ Petunjuk ${state.hintLevel}/3</span><span>${state.hintLevel<3?'Setiap petunjuk mengurangkan mata teka-teki ini sebanyak 5':'Semua petunjuk telah dibuka'}</span></div>${state.hintLevel?`<ol>${t.hints.slice(0,state.hintLevel).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="small muted">Mulakan dengan berfikir sendiri, atau buka petunjuk pertama jika Ki perlukan bantuan. Setiap petunjuk berikutnya semakin jelas.</p>'}</div>`;
 const nextButton=state.correct?button('Teruskan ke cabaran seterusnya →','next','primary wide'):button('Semak jawapan','check','primary wide');
 const hintButton=button(state.hintLevel>=3?'Semua petunjuk dibuka':`Buka petunjuk ${state.hintLevel+1}/3`,'hint','subtle');
 panel(`Bab ${state.chapter+1}: ${esc(c.name)}`,`${esc(t.title)}`,`<div class="taskline"><span class="counter">Cabaran ${state.index+1}/${c.tasks.length} · Keseluruhan ${state.solved+(state.correct?0:1)}/${TOTAL}</span><span class="counter">${Math.round(state.solved/TOTAL*100)}% selesai</span></div>${sectionScene()}<div class="question"><p>${esc(t.question)}</p></div>${method}${notices}${state.correct?`<div class="notice good"><strong>Makna di sebalik jawapan:</strong> ${esc(t.explain)}</div>`:''}${hints}`,`<div style="width:100%">${nextButton}</div>${!state.correct?`<div style="width:100%">${hintButton.replace('class="btn','class="btn wide') .replace('data-action="hint"',`data-action="hint" ${state.hintLevel>=3?'disabled':''}`)}</div>`:''}`);
}
